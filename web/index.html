<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Intelligence Metropolis | SCIANCE D1.1</title>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-space: #050811;
      --bg-panel: rgba(10, 16, 32, 0.85);
      --bg-panel-border: rgba(0, 240, 255, 0.25);
      --accent-cyan: #00f0ff;
      --accent-emerald: #00e599;
      --accent-amber: #ffb700;
      --accent-violet: #c040ff;
      --accent-cobalt: #3a86ff;
      --accent-red: #ff3366;
      --priority-gold: #ffe9a8;
      --text-main: #f0f4fc;
      --text-muted: #8a9bb8;
      --text-dim: #4d5d78;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-space); font-family: var(--font-ui); color: var(--text-main); }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* Vignette & Crystalline Atmosphere */
    .viewport-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 130px rgba(3, 6, 16, 0.9);
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 5, 15, 0.6) 100%);
      z-index: 5;
    }

    /* TOP HUD BAR */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .hud-brand {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 240, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-logo-gem {
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .hud-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #c7ddff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-tag {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      color: var(--accent-cyan);
    }

    /* LAYER TOGGLE CONTROLS (HUD RIGHT) */
    .hud-layers-panel {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .layer-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .layer-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .layer-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
    }

    .layer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .layer-btn[data-layer="bottlenecks"].active {
      border-color: var(--accent-red);
      background: rgba(255, 51, 102, 0.14);
      box-shadow: 0 0 14px rgba(255, 51, 102, 0.3);
    }

    .layer-btn[data-layer="challenges"].active {
      border-color: var(--accent-amber);
      background: rgba(255, 183, 0, 0.14);
      box-shadow: 0 0 14px rgba(255, 183, 0, 0.3);
    }

    .layer-btn[data-layer="conduits"].active {
      border-color: var(--accent-violet);
      background: rgba(192, 64, 255, 0.14);
      box-shadow: 0 0 14px rgba(192, 64, 255, 0.3);
    }

    /* LEFT COLLAPSIBLE SPIRE & HIGHWAY LEGEND */
    .spire-legend-card {
      position: absolute;
      top: 90px;
      left: 20px;
      width: 330px;
      max-height: calc(100vh - 120px);
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 240, 255, 0.08);
      z-index: 20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
    }

    .spire-legend-card.collapsed {
      transform: translateX(-370px);
      opacity: 0;
      pointer-events: none;
    }

    .legend-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
    }

    .legend-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .collapse-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .legend-scroll {
      padding: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 190px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .legend-scroll::-webkit-scrollbar { width: 5px; }
    .legend-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    .district-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .district-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .district-group-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .district-label-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .district-color-bar {
      width: 4px;
      height: 20px;
      border-radius: 2px;
    }

    .district-group-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .district-group-scale {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-muted);
    }

    .spire-item {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .spire-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateX(3px);
    }

    .spire-item.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .spire-item-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .spire-item-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    /* RESTORE LEGEND BUTTON */
    .restore-legend-btn {
      position: absolute;
      top: 90px;
      left: 20px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--bg-panel-border);
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 19;
      transition: all 0.2s;
    }

    .restore-legend-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
    }

    .restore-legend-btn.visible {
      display: flex;
    }

    /* RIGHT DETAIL DRAWER */
    .detail-drawer {
      position: absolute;
      top: 90px;
      right: 20px;
      width: 400px;
      max-height: calc(100vh - 120px);
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.12);
      z-index: 20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(440px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
    }

    .detail-drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .drawer-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .drawer-type-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-spire { background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 240, 255, 0.3); }
    .badge-bottleneck { background: rgba(255, 51, 102, 0.18); color: var(--accent-red); border: 1px solid rgba(255, 51, 102, 0.4); }
    .badge-challenge { background: rgba(255, 183, 0, 0.18); color: var(--accent-amber); border: 1px solid rgba(255, 183, 0, 0.4); }
    .badge-conduit { background: rgba(192, 64, 255, 0.18); color: var(--accent-violet); border: 1px solid rgba(192, 64, 255, 0.4); }

    .drawer-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .drawer-close-btn:hover { color: #ffffff; }

    .drawer-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .drawer-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* PAGER CONTROLS IN DRAWER */
    .drawer-pager-bar {
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pager-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pager-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-cyan);
    }

    .pager-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pager-chips-container {
      display: flex;
      gap: 4px;
      max-width: 210px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .pager-chips-container::-webkit-scrollbar { display: none; }

    .pager-chip {
      min-width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pager-chip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .pager-chip.active {
      background: var(--accent-cyan);
      color: #060913;
      font-weight: 700;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .drawer-content {
      padding: 16px 18px;
      overflow-y: auto;
      max-height: calc(100vh - 290px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-content::-webkit-scrollbar { width: 5px; }
    .drawer-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* METRICS TILES */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .spire-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .spire-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(0, 240, 255, 0.5);
      background: rgba(0, 240, 255, 0.08); color: #00f0ff; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; text-decoration: none; }
    .spire-link:hover { background: rgba(0, 240, 255, 0.18); }
    .drawer-body-text {
      font-size: 13px;
      line-height: 1.6;
      color: #ccd7e8;
    }

    .drawer-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remedy-box {
      background: rgba(0, 229, 153, 0.08);
      border-left: 3px solid var(--accent-emerald);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: #bbf7d0;
    }

    .hazard-box {
      background: rgba(255, 51, 102, 0.1);
      border-left: 3px solid var(--accent-red);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: #fecdd3;
    }

    /* INTER-SPIRE JUMP BUTTONS IN CONDUIT CARD */
    .conduit-endpoints-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conduit-endpoint-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.2s;
    }

    .conduit-endpoint-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      transform: translateX(3px);
    }

    /* BOTTOM CONTROLS & CAMERA ACTIONS */
    .hud-footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .hud-controls-pill {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .control-action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .control-action-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #ffffff;
    }

    .control-action-btn.active {
      background: var(--accent-cyan);
      color: #060913;
      font-weight: 700;
    }

    /* SCALE AXIS RUNWAY BAR */
    .scale-axis-strip {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .scale-step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .scale-step-item:hover { color: #ffffff; }

    .scale-step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* MAP MARKERS & STENCILS */
    /* PUNCHY CODENAME MARKERS (NO MORE BLAND CODES!) */
    .hazard-radar-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 51, 102, 0.22);
      border: 1px solid var(--accent-red);
      padding: 4px 9px;
      border-radius: 6px;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.5);
      transition: transform 0.2s, background 0.2s;
    }

    .hazard-radar-marker:hover {
      transform: scale(1.12);
      background: rgba(255, 51, 102, 0.4);
      box-shadow: 0 0 24px rgba(255, 51, 102, 0.8);
    }

    .hazard-pulse-ring {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red);
      animation: radarPing 1.8s infinite;
    }

    @keyframes radarPing {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .hazard-radar-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .challenge-beacon-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(40, 34, 14, 0.82);
      border: 1px solid var(--priority-gold);
      padding: 4px 9px;
      border-radius: 6px;
      box-shadow: 0 0 14px rgba(255, 233, 168, 0.35);
      transition: transform 0.2s, background 0.2s;
    }

    .challenge-beacon-marker:hover {
      transform: scale(1.12);
      background: rgba(70, 60, 24, 0.92);
      box-shadow: 0 0 22px rgba(255, 233, 168, 0.7);
    }

    .challenge-gem {
      width: 7px;
      height: 7px;
      background: var(--priority-gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--priority-gold);
    }

    .challenge-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* CLICKABLE CONDUIT FLOATING BADGES */
    .conduit-beacon-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(192, 64, 255, 0.25);
      border: 1px solid var(--accent-violet);
      padding: 3px 8px;
      border-radius: 14px;
      box-shadow: 0 0 14px rgba(192, 64, 255, 0.4);
      transition: all 0.2s;
    }

    .conduit-beacon-marker:hover {
      transform: scale(1.12);
      background: rgba(192, 64, 255, 0.45);
      box-shadow: 0 0 22px rgba(192, 64, 255, 0.7);
    }

    .conduit-beacon-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* ===== SCHEMA v2: CONSTRAINT PRIMITIVES ===== */
    .layer-btn[data-layer="traffic"].active { border-color: rgba(255, 109, 0, 0.6); background: rgba(255, 109, 0, 0.12); }
    .layer-btn[data-layer="queues"].active { border-color: rgba(255, 51, 102, 0.6); background: rgba(255, 51, 102, 0.12); }
    .layer-btn[data-layer="weather"].active { border-color: rgba(160, 170, 200, 0.6); background: rgba(160, 170, 200, 0.12); }
    .layer-btn.hidden-layer { display: none; }

    /* Edge incident pin — like a crash / roadworks report on a road */
    .incident-pin {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      background: rgba(20, 6, 10, 0.9);
      border: 1px solid rgba(255, 23, 68, 0.75);
      border-radius: 6px; padding: 3px 8px 3px 4px;
      box-shadow: 0 0 14px rgba(255, 23, 68, 0.45);
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: #fff;
      transition: transform 0.2s ease;
    }
    .incident-pin:hover { transform: scale(1.08); }
    .incident-icon {
      width: 20px; height: 20px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      background: #ff1744; font-size: 11px;
    }
    .incident-pin.closure .incident-icon { background: #7a0019; }
    .incident-pin.barrier { border-color: #8a93a6; background: rgba(28, 30, 38, 0.92); box-shadow: 0 0 10px rgba(138, 147, 166, 0.35); }
    .incident-pin.barrier .incident-icon { background: #3a3f4d; }
    .incident-pin.barrier .delay-chip { background: rgba(138, 147, 166, 0.25); color: #dfe3ec; }
    .delay-chip {
      font-size: 9.5px; font-weight: 700; color: #ffd0d8;
      background: rgba(255, 23, 68, 0.25); border-radius: 3px; padding: 1px 5px;
    }

    /* Node wait-time chips — like "usually a 4 h wait" on a place */
    .node-chip-stack { display: flex; flex-direction: column; gap: 3px; align-items: center; pointer-events: none; }
    .node-chip {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      background: rgba(30, 8, 14, 0.9);
      border: 1px solid rgba(255, 109, 0, 0.7);
      border-radius: 12px; padding: 2px 8px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #ffe0cc;
      box-shadow: 0 0 10px rgba(255, 109, 0, 0.35);
    }
    .node-chip:hover { filter: brightness(1.3); }


    /* Field forecast row — one chip per constraint acting on the district */
    .forecast-row { display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; pointer-events: none; }
    .forecast-chip {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      background: rgba(12, 16, 28, 0.88);
      border: 1px solid; border-radius: 12px; padding: 2px 8px 2px 4px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #e8ecf5;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .forecast-chip:hover { transform: scale(1.06); }
    .forecast-chip.dim { opacity: 0.3; }
    .forecast-chip.lit { box-shadow: 0 0 12px var(--tape, rgba(255,255,255,0.5)); }
    .tape-swatch { width: 16px; height: 0; border-top: 3px solid var(--tape); display: inline-block; }
    .tape-swatch.tape-noise { border-top-style: dotted; }
    .tape-swatch.tape-slowdown { border-top-style: dashed; }

    /* Spire kind key at the top of the directory */
    .kind-key { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 6px 4px 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }

    /* Guided tour */
    .tour-card {
      position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
      width: min(640px, calc(100vw - 32px)); z-index: 25; display: none;
      background: rgba(8, 12, 24, 0.94); border: 1px solid rgba(124, 255, 178, 0.45); border-radius: 12px;
      padding: 14px 18px 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px);
    }
    .tour-card.open { display: block; }
    .tour-head { display: flex; align-items: baseline; gap: 10px; }
    .tour-step { font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: #7cffb2; white-space: nowrap; }
    .tour-title { font-size: 17px; font-weight: 800; color: #fff; flex: 1; margin: 0; }
    .tour-text { margin: 8px 0 6px; font-size: 13.5px; line-height: 1.55; color: var(--text-main); }
    .tour-items { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .tour-items:empty { display: none; }
    .tour-items li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-main); }
    .tour-item-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tour-item-verdict { margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .challenge-short { font-weight: 600; color: #dfe6f5; }
    .tour-look { margin: 0 0 10px; font-family: var(--font-mono); font-size: 11px; color: #ffcf66; }
    .tour-look:empty { display: none; }
    /* Narrated tour: the line being spoken, with its speaker */
    .tour-sub { display: none; margin: 4px 0 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); font-size: 14px; line-height: 1.5; color: #fff; }
    body.narrating .tour-sub { display: block; }
    body.narrating .tour-text { display: none; }
    body.quizzing .tour-sub { border: 1px dashed #ffcf66; }
    body.quizzing .tour-sub::after { content: '👆 Answer by clicking on the map — or Next to skip'; display: block; margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px; color: #ffcf66; }
    .tour-sub-who { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
    #listenBtn, #orbitBtn, #tourBtn { white-space: nowrap; }
    .tour-listen { font-family: var(--font-mono); font-size: 11px; }
    .tour-listen.active { color: #0a0f1c; background: #7cffb2; border-color: #7cffb2; }
    /* #listen deep link: one click to allow sound */
    .listen-gate { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(5, 8, 16, 0.55); }
    .listen-gate.open { display: flex; }
    .listen-gate button { font-family: var(--font-mono); font-size: 16px; font-weight: 800; padding: 16px 28px; border-radius: 12px; cursor: pointer;
      color: #0a0f1c; background: #7cffb2; border: none; box-shadow: 0 0 30px rgba(124, 255, 178, 0.5); }

    /* Talk to the city (level 3): a live voice agent that points at the map */
    .talk-panel { position: absolute; right: 24px; bottom: 96px; width: min(340px, calc(100vw - 32px)); z-index: 26; display: none;
      background: rgba(8, 12, 24, 0.94); border: 1px solid rgba(0, 240, 255, 0.45); border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); }
    body.talking .talk-panel { display: block; }
    .talk-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: #00f0ff; letter-spacing: 1px; }
    .talk-dot { width: 10px; height: 10px; border-radius: 50%; background: #8a9bb8; flex: none; }
    .talk-panel[data-mode="listening"] .talk-dot { background: #7cffb2; box-shadow: 0 0 10px #7cffb2; }
    .talk-panel[data-mode="speaking"] .talk-dot { background: #00f0ff; box-shadow: 0 0 10px #00f0ff; animation: talkPulse 0.9s ease-in-out infinite; }
    @keyframes talkPulse { 50% { transform: scale(1.35); } }
    .talk-status { flex: 1; }
    .talk-line { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: #fff; min-height: 1.5em; }
    .talk-you { margin-top: 6px; font-size: 12px; color: var(--text-muted); font-style: italic; }
    .talk-you:empty, .talk-line:empty { display: none; }
    #talkBtn.pulse { animation: askPulse 1s ease-in-out 12; border-color: #00f0ff; color: #00f0ff; }
    @keyframes askPulse { 50% { box-shadow: 0 0 0 6px rgba(0, 240, 255, 0.35), 0 0 24px rgba(0, 240, 255, 0.8); transform: translateY(-2px); } }
    #talkBtn.active { color: #0a0f1c; background: #00f0ff; border-color: #00f0ff; }
    .tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tour-dots { display: flex; gap: 6px; }
    .tour-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); cursor: pointer; }
    .tour-dot.active { background: #7cffb2; box-shadow: 0 0 8px #7cffb2; }
    body.touring .maplibregl-marker:not(.tour-focus), body.spotlight .maplibregl-marker:not(.tour-focus) { opacity: 0.12; transition: opacity 0.4s ease; }
    body.touring .maplibregl-marker.tour-focus, body.spotlight .maplibregl-marker.tour-focus { opacity: 1; transition: opacity 0.4s ease; }
    body.touring .hud-footer .scale-axis-strip { opacity: 0.35; }

    /* Data plazas */
    .plaza-switch {
      pointer-events: auto; cursor: pointer; display: flex; gap: 4px; align-items: center;
      background: rgba(10, 16, 32, 0.88); border: 1px solid rgba(0, 240, 255, 0.45); border-radius: 8px;
      padding: 3px 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #dfe6f5;
    }
    .plaza-switch button {
      cursor: pointer; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #dfe6f5;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 5px; padding: 1px 6px;
    }
    .plaza-switch button.active { background: rgba(0, 240, 255, 0.25); border-color: var(--accent-cyan); }
    .plaza-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; }
    .plaza-table th, .plaza-table td { border: 1px solid rgba(255, 255, 255, 0.12); padding: 4px 6px; text-align: center; }
    .plaza-table th { color: var(--text-muted); font-weight: 600; }
    .plaza-table td { color: #fff; font-weight: 700; }
    .plaza-table td.np { color: var(--text-dim); font-weight: 500; }
    .challenge-beacon-marker.compact { padding: 2px 6px; gap: 4px; }
    .challenge-beacon-marker.compact .challenge-text { font-size: 10px; }
    .verdict-tag { font-size: 9px; font-weight: 800; margin-left: 4px; letter-spacing: 0.4px; }

    /* "You are here" chip at the west end of the now-line */
    .now-chip {
      pointer-events: none;
      font-family: var(--font-mono); font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
      color: #062014; background: #7cffb2; border-radius: 12px; padding: 3px 10px;
      box-shadow: 0 0 16px rgba(124, 255, 178, 0.6); white-space: nowrap;
    }

    /* Conduit badge status variants */
    .conduit-beacon-marker.status-thin { opacity: 0.8; border-style: dashed; }
    .conduit-beacon-marker.status-planned { border-color: #8a93a6; background: rgba(40, 44, 56, 0.85); box-shadow: none; }
    .conduit-beacon-marker .constrained-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff1744; box-shadow: 0 0 6px #ff1744; }

    /* Drawer: relations */
    .relation-block { margin-top: 14px; }
    .relation-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .ref-chip {
      cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
      padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05); color: #fff;
    }
    .ref-chip:hover { background: rgba(255,255,255,0.14); }
    .ref-chip.kind-bneck { border-color: rgba(255, 23, 68, 0.6); color: #ffb3c1; }
    .ref-chip.kind-chal { border-color: rgba(255, 183, 0, 0.6); color: #ffe08a; }
    .ref-chip.kind-conduit { border-color: rgba(192, 64, 255, 0.6); color: #e3b3ff; }
    .ref-chip.kind-spire { border-color: rgba(0, 240, 255, 0.5); color: #b3fbff; }
    .ref-chip.kind-dist { border-color: rgba(160, 170, 200, 0.5); color: #dfe6f5; }
    .scope-banner {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700; margin-bottom: 12px;
    }
    .scope-tag { padding: 3px 8px; border-radius: 4px; background: rgba(255, 23, 68, 0.18); color: #ffb3c1; border: 1px solid rgba(255, 23, 68, 0.4); }

    /* Route (Directions) panel */
    .route-panel {
      position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100vw - 32px)); max-height: 46vh; overflow-y: auto;
      background: var(--bg-panel); border: 1px solid var(--bg-panel-border);
      border-radius: 12px; padding: 14px 16px; z-index: 20;
      backdrop-filter: blur(12px); display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .route-panel.open { display: block; }
    .route-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .route-form select {
      width: 100%; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; padding: 6px; font-family: var(--font-mono); font-size: 11px;
    }
    .route-swap { cursor: pointer; background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; padding: 5px 8px; }
    .route-option { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); cursor: pointer; }
    .route-option input { vertical-align: middle; margin-right: 6px; }
    .route-summary { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
    .route-legs { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .route-leg { font-family: var(--font-mono); font-size: 11px; color: #fff; display: flex; gap: 8px; align-items: baseline; }
    .route-leg .leg-kind { color: var(--text-dim); min-width: 18px; }
    .route-leg.against { color: #ffd08a; }
    .route-incidents { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .route-incident { font-family: var(--font-mono); font-size: 11px; color: #ffb3c1; cursor: pointer; }
    .route-incident.field { color: #dfe6f5; }
    .route-incident.status { color: #ffd08a; }
    .route-close { float: right; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }

    /* ===== Metro view ===== */
    .metro-view { position: absolute; inset: 0; z-index: 6; display: none; background: #0a0f1c; cursor: grab; }
    .metro-view.dragging { cursor: grabbing; }
    body.metro .metro-view { display: block; }
    body.touring .metro-legend { display: none; }
    body.metro .hud-layers-panel, body.metro #scaleBtn, body.metro #routeBtn, body.metro #orbitBtn,
    body.metro #resetCamBtn, body.metro .scale-axis-strip { display: none !important; }
    #metroSvg { width: 100%; height: 100%; display: block; }
    .view-switch { display: flex; gap: 4px; margin-right: 10px; align-self: center; pointer-events: auto; }
    .view-switch button {
      cursor: pointer; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #dfe6f5;
      background: rgba(10, 16, 32, 0.85); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 6px 10px;
    }
    .view-switch button.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0, 240, 255, 0.12); }
    .metro-station { cursor: pointer; }
    .metro-station:hover .m-dot { stroke-width: 6; }
    .metro-station-label { cursor: pointer; }
    .metro-ic, .metro-ic-g { cursor: pointer; }
    .metro-legend {
      position: absolute; left: 20px; top: 140px; z-index: 3; display: flex; flex-direction: column; gap: 6px;
      background: #0a0f1c; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      max-width: 300px;
    }
    .metro-legend-item { display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #e8ecf5; }
    .metro-legend-item:hover { color: #ffffff; }
    .metro-legend-bar { width: 26px; height: 7px; border-radius: 4px; flex: none; }
    .metro-legend-sub { display: block; font-weight: 500; color: var(--text-muted); font-size: 10px; }
    .metro-legend-ic { margin-top: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
    .metro-ic:hover { stroke: var(--accent-cyan); }
    .metro-ic.m-selected { stroke: var(--accent-cyan); stroke-width: 6; }
    .ic-member { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; }
    .ic-line-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    body.touring .metro-station-label:not(.m-focus), body.spotlight .metro-station-label:not(.m-focus) { opacity: 0.25; }
    .metro-label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e8ecf5; paint-order: stroke; stroke: #0a0f1c; stroke-width: 4px; }
    .metro-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8a9bb8; paint-order: stroke; stroke: #0a0f1c; stroke-width: 3px; }
    .metro-line-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .metro-ic-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; fill: #ffffff; paint-order: stroke; stroke: #0a0f1c; stroke-width: 4px; }
    body.touring .metro-station:not(.m-focus), body.touring .metro-line:not(.m-focus),
    body.spotlight .metro-station:not(.m-focus), body.spotlight .metro-line:not(.m-focus) { opacity: 0.18; }
    .metro-station.m-selected .m-dot { stroke: #ffffff; stroke-width: 7; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="metroView" class="metro-view" aria-label="Metro map"><svg id="metroSvg" xmlns="http://www.w3.org/2000/svg"></svg><div id="metroLegend" class="metro-legend"></div></div>
  <div class="viewport-overlay"></div>

  <!-- TOP HUD BAR -->
  <header class="hud-header">
    <div class="hud-brand">
      <div class="hud-title-row">
        <div class="hud-logo-gem"></div>
        <h1 class="hud-title" id="hudTitle">Metropolis</h1>
      </div>
      <div class="hud-subtitle" id="hudSubtitle"></div>
    </div>

    <!-- LAYER VISIBILITY TOGGLES -->
    <div class="view-switch" id="viewSwitch">
      <button data-view="city" class="active" title="3D city">🏙 City</button>
      <button data-view="metro" title="Schematic metro map">🚇 Metro</button>
    </div>
    <div class="hud-layers-panel">
      <button class="layer-btn active" data-layer="districts" title="Toggle District Scale Zones">
        <span class="layer-dot" style="color: var(--accent-cyan);"></span>
        <span>Districts</span>
      </button>
      <button class="layer-btn active" data-layer="spires" title="Toggle AI Models & Facilities">
        <span class="layer-dot" style="color: var(--accent-emerald);"></span>
        <span>Spires</span>
      </button>
      <button class="layer-btn active" data-layer="conduits" title="Toggle highways, ferries and planned roads">
        <span class="layer-dot" style="color: var(--accent-violet);"></span>
        <span>Highways</span>
      </button>
      <button class="layer-btn active" data-layer="bottlenecks" title="Toggle Physical Rate-Limiters">
        <span class="layer-dot" style="color: var(--accent-red);"></span>
        <span>Bottlenecks</span>

  <!-- ROUTE (DIRECTIONS) PANEL -->

    <div id="routeResult"></div>
