<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Intelligence Metropolis | SCIANCE D1.1</title>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-space: #050811;
      --bg-panel: rgba(10, 16, 32, 0.85);
      --bg-panel-border: rgba(0, 240, 255, 0.25);
      --accent-cyan: #00f0ff;
      --accent-emerald: #00e599;
      --accent-amber: #ffb700;
      --accent-violet: #c040ff;
      --accent-cobalt: #3a86ff;
      --accent-red: #ff3366;
      --priority-gold: #ffe9a8;
      --text-main: #f0f4fc;
      --text-muted: #8a9bb8;
      --text-dim: #4d5d78;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-space); font-family: var(--font-ui); color: var(--text-main); }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* Vignette & Crystalline Atmosphere */
    .viewport-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 130px rgba(3, 6, 16, 0.9);
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 5, 15, 0.6) 100%);
      z-index: 5;
    }

    /* TOP HUD BAR */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .hud-brand {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 240, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-logo-gem {
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .hud-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #c7ddff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-tag {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      color: var(--accent-cyan);
    }

    /* LAYER TOGGLE CONTROLS (HUD RIGHT) */
    .hud-layers-panel {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .layer-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .layer-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .layer-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
    }

    .layer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .layer-btn[data-layer="bottlenecks"].active {
      border-color: var(--accent-red);
      background: rgba(255, 51, 102, 0.14);
      box-shadow: 0 0 14px rgba(255, 51, 102, 0.3);
    }

    .layer-btn[data-layer="challenges"].active {
      border-color: var(--accent-amber);
      background: rgba(255, 183, 0, 0.14);
      box-shadow: 0 0 14px rgba(255, 183, 0, 0.3);
    }

    .layer-btn[data-layer="conduits"].active {
      border-color: var(--accent-violet);
      background: rgba(192, 64, 255, 0.14);
      box-shadow: 0 0 14px rgba(192, 64, 255, 0.3);
    }

    /* LEFT COLLAPSIBLE SPIRE & HIGHWAY LEGEND */
    .spire-legend-card {
      position: absolute;
      top: 90px;
      left: 20px;
      width: 330px;
      max-height: calc(100vh - 120px);
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 240, 255, 0.08);
      z-index: 20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
    }

    .spire-legend-card.collapsed {
      transform: translateX(-370px);
      opacity: 0;
      pointer-events: none;
    }

    .legend-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
    }

    .legend-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .collapse-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .legend-scroll {
      padding: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 190px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .legend-scroll::-webkit-scrollbar { width: 5px; }
    .legend-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    .district-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .district-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .district-group-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .district-label-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .district-color-bar {
      width: 4px;
      height: 20px;
      border-radius: 2px;
    }

    .district-group-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .district-group-scale {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-muted);
    }

    .spire-item {
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .spire-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateX(3px);
    }

    .spire-item.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .spire-item-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .spire-item-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    /* RESTORE LEGEND BUTTON */
    .restore-legend-btn {
      position: absolute;
      top: 90px;
      left: 20px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--bg-panel-border);
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 19;
      transition: all 0.2s;
    }

    .restore-legend-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
    }

    .restore-legend-btn.visible {
      display: flex;
    }

    /* RIGHT DETAIL DRAWER */
    .detail-drawer {
      position: absolute;
      top: 90px;
      right: 20px;
      width: 400px;
      max-height: calc(100vh - 120px);
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.12);
      z-index: 20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(440px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
    }

    .detail-drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .drawer-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .drawer-type-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-spire { background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 240, 255, 0.3); }
    .badge-bottleneck { background: rgba(255, 51, 102, 0.18); color: var(--accent-red); border: 1px solid rgba(255, 51, 102, 0.4); }
    .badge-challenge { background: rgba(255, 183, 0, 0.18); color: var(--accent-amber); border: 1px solid rgba(255, 183, 0, 0.4); }
    .badge-conduit { background: rgba(192, 64, 255, 0.18); color: var(--accent-violet); border: 1px solid rgba(192, 64, 255, 0.4); }

    .drawer-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .drawer-close-btn:hover { color: #ffffff; }

    .drawer-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .drawer-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* PAGER CONTROLS IN DRAWER */
    .drawer-pager-bar {
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pager-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pager-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-cyan);
    }

    .pager-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pager-chips-container {
      display: flex;
      gap: 4px;
      max-width: 210px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .pager-chips-container::-webkit-scrollbar { display: none; }

    .pager-chip {
      min-width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pager-chip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .pager-chip.active {
      background: var(--accent-cyan);
      color: #060913;
      font-weight: 700;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .drawer-content {
      padding: 16px 18px;
      overflow-y: auto;
      max-height: calc(100vh - 290px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-content::-webkit-scrollbar { width: 5px; }
    .drawer-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* METRICS TILES */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .drawer-body-text {
      font-size: 13px;
      line-height: 1.6;
      color: #ccd7e8;
    }

    .drawer-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remedy-box {
      background: rgba(0, 229, 153, 0.08);
      border-left: 3px solid var(--accent-emerald);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: #bbf7d0;
    }

    .hazard-box {
      background: rgba(255, 51, 102, 0.1);
      border-left: 3px solid var(--accent-red);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: #fecdd3;
    }

    /* INTER-SPIRE JUMP BUTTONS IN CONDUIT CARD */
    .conduit-endpoints-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conduit-endpoint-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.2s;
    }

    .conduit-endpoint-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      transform: translateX(3px);
    }

    /* BOTTOM CONTROLS & CAMERA ACTIONS */
    .hud-footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .hud-controls-pill {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .control-action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .control-action-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #ffffff;
    }

    .control-action-btn.active {
      background: var(--accent-cyan);
      color: #060913;
      font-weight: 700;
    }

    /* SCALE AXIS RUNWAY BAR */
    .scale-axis-strip {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .scale-step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .scale-step-item:hover { color: #ffffff; }

    .scale-step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* MAP MARKERS & STENCILS */
    /* PUNCHY CODENAME MARKERS (NO MORE BLAND CODES!) */
    .hazard-radar-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 51, 102, 0.22);
      border: 1px solid var(--accent-red);
      padding: 4px 9px;
      border-radius: 6px;
      box-shadow: 0 0 16px rgba(255, 51, 102, 0.5);
      transition: transform 0.2s, background 0.2s;
    }

    .hazard-radar-marker:hover {
      transform: scale(1.12);
      background: rgba(255, 51, 102, 0.4);
      box-shadow: 0 0 24px rgba(255, 51, 102, 0.8);
    }

    .hazard-pulse-ring {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px var(--accent-red);
      animation: radarPing 1.8s infinite;
    }

    @keyframes radarPing {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .hazard-radar-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .challenge-beacon-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(40, 34, 14, 0.82);
      border: 1px solid var(--priority-gold);
      padding: 4px 9px;
      border-radius: 6px;
      box-shadow: 0 0 14px rgba(255, 233, 168, 0.35);
      transition: transform 0.2s, background 0.2s;
    }

    .challenge-beacon-marker:hover {
      transform: scale(1.12);
      background: rgba(70, 60, 24, 0.92);
      box-shadow: 0 0 22px rgba(255, 233, 168, 0.7);
    }

    .challenge-gem {
      width: 7px;
      height: 7px;
      background: var(--priority-gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--priority-gold);
    }

    .challenge-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* CLICKABLE CONDUIT FLOATING BADGES */
    .conduit-beacon-marker {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(192, 64, 255, 0.25);
      border: 1px solid var(--accent-violet);
      padding: 3px 8px;
      border-radius: 14px;
      box-shadow: 0 0 14px rgba(192, 64, 255, 0.4);
      transition: all 0.2s;
    }

    .conduit-beacon-marker:hover {
      transform: scale(1.12);
      background: rgba(192, 64, 255, 0.45);
      box-shadow: 0 0 22px rgba(192, 64, 255, 0.7);
    }

    .conduit-beacon-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* ===== SCHEMA v2: CONSTRAINT PRIMITIVES ===== */
    .layer-btn[data-layer="traffic"].active { border-color: rgba(255, 109, 0, 0.6); background: rgba(255, 109, 0, 0.12); }
    .layer-btn[data-layer="queues"].active { border-color: rgba(255, 51, 102, 0.6); background: rgba(255, 51, 102, 0.12); }
    .layer-btn[data-layer="weather"].active { border-color: rgba(160, 170, 200, 0.6); background: rgba(160, 170, 200, 0.12); }
    .layer-btn.hidden-layer { display: none; }

    /* Edge incident pin — like a crash / roadworks report on a road */
    .incident-pin {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      background: rgba(20, 6, 10, 0.9);
      border: 1px solid rgba(255, 23, 68, 0.75);
      border-radius: 6px; padding: 3px 8px 3px 4px;
      box-shadow: 0 0 14px rgba(255, 23, 68, 0.45);
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: #fff;
      transition: transform 0.2s ease;
    }
    .incident-pin:hover { transform: scale(1.08); }
    .incident-icon {
      width: 20px; height: 20px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      background: #ff1744; font-size: 11px;
    }
    .incident-pin.closure .incident-icon { background: #7a0019; }
    .incident-pin.barrier { border-color: #8a93a6; background: rgba(28, 30, 38, 0.92); box-shadow: 0 0 10px rgba(138, 147, 166, 0.35); }
    .incident-pin.barrier .incident-icon { background: #3a3f4d; }
    .incident-pin.barrier .delay-chip { background: rgba(138, 147, 166, 0.25); color: #dfe3ec; }
    .delay-chip {
      font-size: 9.5px; font-weight: 700; color: #ffd0d8;
      background: rgba(255, 23, 68, 0.25); border-radius: 3px; padding: 1px 5px;
    }

    /* Node wait-time chips — like "usually a 4 h wait" on a place */
    .node-chip-stack { display: flex; flex-direction: column; gap: 3px; align-items: center; pointer-events: none; }
    .node-chip {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      background: rgba(30, 8, 14, 0.9);
      border: 1px solid rgba(255, 109, 0, 0.7);
      border-radius: 12px; padding: 2px 8px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #ffe0cc;
      box-shadow: 0 0 10px rgba(255, 109, 0, 0.35);
    }
    .node-chip:hover { filter: brightness(1.3); }


    /* Field forecast row — one chip per constraint acting on the district */
    .forecast-row { display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; pointer-events: none; }
    .forecast-chip {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      background: rgba(12, 16, 28, 0.88);
      border: 1px solid; border-radius: 12px; padding: 2px 8px 2px 4px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #e8ecf5;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .forecast-chip:hover { transform: scale(1.06); }
    .forecast-chip.dim { opacity: 0.3; }
    .forecast-chip.lit { box-shadow: 0 0 12px var(--tape, rgba(255,255,255,0.5)); }
    .tape-swatch { width: 16px; height: 0; border-top: 3px solid var(--tape); display: inline-block; }
    .tape-swatch.tape-noise { border-top-style: dotted; }
    .tape-swatch.tape-slowdown { border-top-style: dashed; }

    /* Spire kind key at the top of the directory */
    .kind-key { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 6px 4px 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }

    /* Guided tour */
    .tour-card {
      position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
      width: min(640px, calc(100vw - 32px)); z-index: 25; display: none;
      background: rgba(8, 12, 24, 0.94); border: 1px solid rgba(124, 255, 178, 0.45); border-radius: 12px;
      padding: 14px 18px 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px);
    }
    .tour-card.open { display: block; }
    .tour-head { display: flex; align-items: baseline; gap: 10px; }
    .tour-step { font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: #7cffb2; white-space: nowrap; }
    .tour-title { font-size: 17px; font-weight: 800; color: #fff; flex: 1; margin: 0; }
    .tour-text { margin: 8px 0 6px; font-size: 13.5px; line-height: 1.55; color: var(--text-main); }
    .tour-look { margin: 0 0 10px; font-family: var(--font-mono); font-size: 11px; color: #ffcf66; }
    .tour-look:empty { display: none; }
    .tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tour-dots { display: flex; gap: 6px; }

    .tour-dot.active { background: #7cffb2; box-shadow: 0 0 8px #7cffb2; }
    body.touring .maplibregl-marker:not(.tour-focus) { opacity: 0.12; transition: opacity 0.4s ease; }
    body.touring .maplibregl-marker.tour-focus { opacity: 1; transition: opacity 0.4s ease; }
    body.touring .hud-footer .scale-axis-strip { opacity: 0.35; }

    /* Data plazas */
    .plaza-switch {
      pointer-events: auto; cursor: pointer; display: flex; gap: 4px; align-items: center;
      background: rgba(10, 16, 32, 0.88); border: 1px solid rgba(0, 240, 255, 0.45); border-radius: 8px;
      padding: 3px 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #dfe6f5;
    }
    .plaza-switch button {
      cursor: pointer; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #dfe6f5;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 5px; padding: 1px 6px;
    }
    .plaza-switch button.active { background: rgba(0, 240, 255, 0.25); border-color: var(--accent-cyan); }
    .plaza-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; }
    .plaza-table th, .plaza-table td { border: 1px solid rgba(255, 255, 255, 0.12); padding: 4px 6px; text-align: center; }

    .plaza-table td.np { color: var(--text-dim); font-weight: 500; }
    .verdict-tag { font-size: 9px; font-weight: 800; margin-left: 4px; letter-spacing: 0.4px; }

    /* "You are here" chip at the west end of the now-line */
    .now-chip {

      font-family: var(--font-mono); font-size: 11px; font-weight: 800; letter-spacing: 0.5px;

    .conduit-beacon-marker.status-thin { opacity: 0.8; border-style: dashed; }

    .conduit-beacon-marker .constrained-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff1744; box-shadow: 0 0 6px #ff1744; }

    .relation-block { margin-top: 14px; }
    .relation-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .ref-chip {

      padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.18);

    }

    .scope-banner {

    }
    .scope-tag { padding: 3px 8px; border-radius: 4px; background: rgba(255, 23, 68, 0.18); color: #ffb3c1; border: 1px solid rgba(255, 23, 68, 0.4); }

    /* Route (Directions) panel */
    .route-panel {
      position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100vw - 32px)); max-height: 46vh; overflow-y: auto;
      background: var(--bg-panel); border: 1px solid var(--bg-panel-border);
      border-radius: 12px; padding: 14px 16px; z-index: 20;

    .route-panel.open { display: block; }
    .route-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .route-form select {
      width: 100%; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; padding: 6px; font-family: var(--font-mono); font-size: 11px;

    .route-swap { cursor: pointer; background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; padding: 5px 8px; }
    .route-option { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); cursor: pointer; }
    .route-option input { vertical-align: middle; margin-right: 6px; }
    .route-summary { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
    .route-legs { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .route-leg { font-family: var(--font-mono); font-size: 11px; color: #fff; display: flex; gap: 8px; align-items: baseline; }
    .route-leg .leg-kind { color: var(--text-dim); min-width: 18px; }

    .route-incidents { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .route-incident { font-family: var(--font-mono); font-size: 11px; color: #ffb3c1; cursor: pointer; }
    .route-incident.field { color: #dfe6f5; }
    .route-incident.status { color: #ffd08a; }
    .route-close { float: right; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
  </style>
</head>

  <!-- BOTTOM HUD CONTROLS & SCALE RUNWAY -->

    <div class="scale-axis-strip" id="scaleAxisStrip">

  <!-- LOAD COMPILED DATASET -->
  <script src="city-data.js"></script>

  <script>
    // State management
    let map = null;
    let isOrbiting = false;
    let orbitAnimationId = null;
    let activeSelection = null; // { type: 'spire'|'bottleneck'|'challenge'|'conduit', id: string, index: number }
    let layerVisibility = {
      districts: true,
      spires: true,
      conduits: true,
      bottlenecks: true,
      challenges: true,
      traffic: true,
      queues: true,
      weather: true
    };

    const districtMarkers = [];
    // District names are painted on the ground as textures (canvas -> image source), so WebGL
    // projects them with the same camera as the districts and they never drift off the edge.
    const districtNames = [];            // { id, bbox: [minLng, minLat, maxLng, maxLat] }
    const NAME_INSET_M = 20;             // from the district's west edge
    const NAME_GAP_M = 16;               // below the district's south edge
    const NAME_MAX_WIDTH = 0.92;         // share of the district width the name may use
    const NAME_MAX_HEIGHT_M = 110;       // both lines together; the strip between districts is 240 m
    let districtNameHover = false;

    function drawSpacedText(g, text, x, y, spacing) {
      for (const ch of text) {
        g.fillText(ch, x, y);
        x += g.measureText(ch).width + spacing;
      }
    }

    function spacedWidth(g, text, spacing) {
      let w = 0;
      for (const ch of text) w += g.measureText(ch).width + spacing;
      return w - spacing;
    }

    function drawDistrictName(d) {
      const TITLE = '800 96px "JetBrains Mono", monospace', TAG = '600 68px "JetBrains Mono", monospace';
      const title = d.name.toUpperCase(), tag = (d.scale_label || '').toUpperCase();
      const pad = 60;
      const probe = document.createElement('canvas').getContext('2d');
      probe.font = TITLE; const titleW = spacedWidth(probe, title, 24);
      probe.font = TAG; const tagW = spacedWidth(probe, tag, 12);
      const canvas = document.createElement('canvas');
      canvas.width = Math.min(4096, Math.ceil(Math.max(titleW, tagW) + 2 * pad));
      canvas.height = Math.ceil(96 * 1.15 + 12 + 68 * 1.15 + 2 * pad);
      const g = canvas.getContext('2d');
      g.textBaseline = 'top';
      g.fillStyle = d.color;
      g.shadowColor = d.color;
      g.font = TITLE;
      g.globalAlpha = 0.85;
      [70, 28].forEach(blur => { g.shadowBlur = blur; drawSpacedText(g, title, pad, pad, 24); });
      g.font = TAG;
      g.globalAlpha = 0.7;
      g.shadowBlur = 16;
      drawSpacedText(g, tag, pad, pad + 96 * 1.15 + 12, 12);
      return canvas;
    }

    function addDistrictNames() {
      window.DISTRICTS.forEach((d, i) => {
        const canvas = drawDistrictName(d);
        const lngs = d.bounds.map(p => p[0]);
        const lats = d.bounds.map(p => p[1]);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs), minLat = Math.min(...lats);
        const mPerDegLng = 111320 * Math.cos(d.center[1] * Math.PI / 180);
        const widthM = (maxLng - minLng) * mPerDegLng;
        const metresPerPx = Math.min((widthM - 2 * NAME_INSET_M) * NAME_MAX_WIDTH / canvas.width, NAME_MAX_HEIGHT_M / canvas.height);
        const west = minLng + NAME_INSET_M / mPerDegLng;
        const east = west + canvas.width * metresPerPx / mPerDegLng;
        const north = minLat - NAME_GAP_M / 111320;
        const south = north - canvas.height * metresPerPx / 111320;
        const id = `district-name-${i}`;
        map.addSource(id, { type: 'image', url: canvas.toDataURL('image/png'), coordinates: [[west, north], [east, north], [east, south], [west, south]] });
        map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-opacity': 0.95, 'raster-fade-duration': 0 } }, 'fields-tape-blind');
        districtNames.push({ id: d.id, layer: id, bbox: [west, south, east, north] });
      });
    }

    // ===== Guided tour (city_metadata-independent: window.TOUR from the spec's "tour") =====
    const TOUR = window.TOUR || [];
    let tourIndex = -1;
    const tourSaved = {};

    function tourRefsIn(el) {
      const refs = [];
      if (el.dataset && el.dataset.tourRef) refs.push(el.dataset.tourRef);
      el.querySelectorAll('[data-tour-ref]').forEach(n => refs.push(n.dataset.tourRef));
      return refs;
    }

    function saveTourPaint() {
      const save = (layer, prop) => { if (map.getLayer(layer)) tourSaved[`${layer}|${prop}`] = map.getPaintProperty(layer, prop); };
      ['buildings-3d', 'buildings-ghost'].forEach(l => save(l, 'fill-extrusion-color'));
      ['conduits-glow', 'conduits-core', 'conduits-core-thin', 'conduits-core-planned', 'targets-rings', 'targets-arcs', 'targets-dot'].forEach(l =>
        save(l, map.getLayer(l) && map.getLayer(l).type === 'fill' ? 'fill-opacity' : 'line-opacity'));
      PLAZAS.forEach(pz => save(`plaza-tex-${pz.id}`, 'raster-opacity'));
      save('plaza-bars', 'fill-extrusion-opacity');
    }

    function restoreTourPaint() {
      Object.entries(tourSaved).forEach(([key, val]) => {
        const [layer, prop] = key.split('|');
        if (map.getLayer(layer)) map.setPaintProperty(layer, prop, val);
      });
    }

    // Everything outside the stop's focus fades: building colours turn slate (opacity is
    // per layer in MapLibre, colour is per feature), roads and plazas dim, markers fade.
    function applyTourFocus(stop) {
      restoreTourPaint();
      const focus = new Set(stop.focus || []);
      const list = [...focus];
      const dim = '#1c2333';
      const inFocus = key => ['in', ['get', key], ['literal', list]];
      ['buildings-3d', 'buildings-ghost'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        map.setPaintProperty(layer, 'fill-extrusion-color', ['case',
          ['any', inFocus('spire_ref'), inFocus('challenge_ref'), inFocus('bottleneck_ref')],
          ['coalesce', ['get', 'color'], '#00f0ff'], dim]);
      });
      ['conduits-glow', 'conduits-core', 'conduits-core-thin', 'conduits-core-planned'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        const base = tourSaved[`${layer}|line-opacity`];
        map.setPaintProperty(layer, 'line-opacity', ['case', inFocus('id'), base === undefined ? 0.9 : base, 0.08]);
      });
      ['targets-rings', 'targets-arcs'].forEach(layer => {
        if (map.getLayer(layer)) map.setPaintProperty(layer, 'line-opacity', ['case', inFocus('challenge_ref'), 0.9, 0.12]);
      });
      if (map.getLayer('targets-dot')) map.setPaintProperty('targets-dot', 'fill-opacity', ['case', inFocus('challenge_ref'), 0.9, 0.15]);
      PLAZAS.forEach(pz => {
        const layer = `plaza-tex-${pz.id}`;
        if (map.getLayer(layer)) map.setPaintProperty(layer, 'raster-opacity', focus.has(pz.id) ? 0.97 : 0.2);
      });
      if (map.getLayer('plaza-bars')) {
        const anyPlaza = PLAZAS.some(pz => focus.has(pz.id));
        map.setPaintProperty('plaza-bars', 'fill-extrusion-opacity', anyPlaza ? 0.85 : 0.2);
      }
      // a constraint in focus also lights up the spire it sits on; a spire lights its node chips
      document.querySelectorAll('.maplibregl-marker').forEach(el => {
        el.classList.toggle('tour-focus', tourRefsIn(el).some(r => focus.has(r)));
      });
    }

    function goToStop(i) {
      if (!TOUR.length) return;
      tourIndex = Math.max(0, Math.min(TOUR.length - 1, i));
      const stop = TOUR[tourIndex];
      closeDrawer();
      stopOrbit();
      Object.entries(stop.plaza_layers || {}).forEach(([pid, layer]) => setPlazaLayer(pid, layer));
      applyTourFocus(stop);
      map.flyTo({ ...stop.camera, duration: 1600, essential: true, padding: { top: 60, bottom: 230, left: 360, right: 40 } });
      document.getElementById('tourStep').textContent = `${tourIndex + 1} / ${TOUR.length}`;
      document.getElementById('tourTitle').textContent = stop.title;
      document.getElementById('tourText').textContent = stop.text;
      document.getElementById('tourLook').textContent = stop.look ? `👁 ${stop.look}` : '';
      document.querySelectorAll('.tour-dot').forEach((d, j) => d.classList.toggle('active', j === tourIndex));
      document.getElementById('tourPrevBtn').disabled = tourIndex === 0;
      document.getElementById('tourNextBtn').textContent = tourIndex === TOUR.length - 1 ? 'Finish ✓' : 'Next ▶';
      try { history.replaceState(null, '', `#tour=${tourIndex + 1}`); } catch (e) { /* file:// or sandboxed */ }
    }

    function startTour(i) {
      if (!TOUR.length) return;
      if (tourIndex < 0) saveTourPaint();
      document.body.classList.add('touring');
      document.getElementById('tourCard').classList.add('open');
      document.getElementById('tourBtn').classList.add('active');
      goToStop(i || 0);
    }

    function endTour() {
      if (tourIndex < 0) return;
      tourIndex = -1;
      restoreTourPaint();
      PLAZAS.forEach(pz => setPlazaLayer(pz.id, (pz.layers[0] || {}).id));
      document.body.classList.remove('touring');
      document.querySelectorAll('.maplibregl-marker.tour-focus').forEach(el => el.classList.remove('tour-focus'));
      document.getElementById('tourCard').classList.remove('open');
      document.getElementById('tourBtn').classList.remove('active');
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    }

    function setupTour() {
      const btn = document.getElementById('tourBtn');
      if (!TOUR.length) { btn.style.display = 'none'; return; }
      document.getElementById('tourDots').innerHTML = TOUR.map((s, j) => `<span class="tour-dot" title="${s.title}" data-stop="${j}"></span>`).join('');
      document.getElementById('tourDots').addEventListener('click', e => {
        const d = e.target.closest('[data-stop]');
        if (d) goToStop(+d.dataset.stop);
      });
      btn.addEventListener('click', () => (tourIndex < 0 ? startTour(0) : endTour()));
      document.getElementById('tourPrevBtn').addEventListener('click', () => goToStop(tourIndex - 1));
      document.getElementById('tourNextBtn').addEventListener('click', () => (tourIndex >= TOUR.length - 1 ? endTour() : goToStop(tourIndex + 1)));
      document.getElementById('tourCloseBtn').addEventListener('click', endTour);
      // Capture phase: while touring, these keys belong to the tour, not to the drawer pager
      window.addEventListener('keydown', (e) => {
        if (tourIndex < 0) return;
        if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
        let handled = true;
        if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') goToStop(tourIndex + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToStop(tourIndex - 1);
        else if (e.key === 'Escape') endTour();
        else if (/^[1-9]$/.test(e.key) && +e.key <= TOUR.length) goToStop(+e.key - 1);
        else handled = false;
        if (handled) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
      const m = /#tour=(\d+)/.exec(location.hash);
      if (m) {
        // wait for district names / plaza textures so the first stop is dimmed correctly
        setTimeout(() => startTour(+m[1] - 1), 1200);
      }
    }

    // ===== Live building size (Alt/Option + scroll, [ / ] keys) =====
    // Heights scale through a paint multiplier; footprints are rescaled around each building's
    // centre (or its spire, for scaffolding and queues) from the compiled geometry.
    let buildingSize = 1;                // runtime factor on top of the compiled city_metadata.building_scale
    let buildingScaleFrame = null;
    const ORIG_BUILDINGS = JSON.parse(JSON.stringify(window.BUILDINGS_GEOJSON || { type: 'FeatureCollection', features: [] }));
    const ORIG_WIREFRAME = JSON.parse(JSON.stringify(window.WIREFRAME_GEOJSON || { type: 'FeatureCollection', features: [] }));

    function scaleRing(ring, k, center) {
      const pts = ring.length > 1 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1] ? ring.slice(0, -1) : ring;
      const c = center || [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
      return ring.map(p => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k]);
    }

    function applyBuildingSize() {
      buildingScaleFrame = null;
      const k = buildingSize;
      ['buildings-3d', 'buildings-ghost'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        map.setPaintProperty(layer, 'fill-extrusion-height', ['*', ['get', 'height'], k]);
        map.setPaintProperty(layer, 'fill-extrusion-base', ['*', ['get', 'base_height'], k]);
      });
      const buildings = {
        type: 'FeatureCollection',
        features: ORIG_BUILDINGS.features.map(f => ({
          ...f,
          geometry: { ...f.geometry, coordinates: f.geometry.coordinates.map(r => scaleRing(r, k, f.properties.scale_center)) }
        }))
      };
      map.getSource('buildings-geo').setData(buildings);
      if (map.getSource('wireframe-geo')) {
        map.getSource('wireframe-geo').setData({
          type: 'FeatureCollection',
          features: ORIG_WIREFRAME.features.map(f => ({ ...f, geometry: { ...f.geometry, coordinates: scaleRing(f.geometry.coordinates, k) } }))
        });
      }
      const effective = k * ((window.CITY_CONFIG || {}).building_scale || 1);
      document.getElementById('scaleLabel').textContent = `×${effective.toFixed(2)}`;
    }

    function setBuildingSize(k) {
      buildingSize = Math.min(2.5, Math.max(0.3, k));
      if (!buildingScaleFrame) buildingScaleFrame = setTimeout(applyBuildingSize, 30);  // coalesce bursts of wheel events
    }

    function setupBuildingSizeControls() {
      // Capture phase on the map container, so MapLibre never sees Alt+wheel as a zoom
      document.getElementById('map').addEventListener('wheel', (e) => {
        if (!e.altKey) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        setBuildingSize(buildingSize * Math.exp(-e.deltaY * 0.0015));
      }, { capture: true, passive: false });
      window.addEventListener('keydown', (e) => {
        if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
        if (e.key === ']') setBuildingSize(buildingSize * 1.1);
        if (e.key === '[') setBuildingSize(buildingSize / 1.1);
      });
      document.getElementById('scaleBtn').addEventListener('click', () => setBuildingSize(1));
      applyBuildingSize();
    }

    // ===== Data plazas =====
    const PLAZAS = window.PLAZAS || [];
    const plazaActive = {};           // plaza id -> active layer id
    PLAZAS.forEach(pz => { plazaActive[pz.id] = (pz.layers[0] || {}).id; });

    function plazaBarFilter() {
      const parts = PLAZAS.map(pz => ['all', ['==', ['get', 'plaza'], pz.id], ['==', ['get', 'layer'], plazaActive[pz.id] || '']]);
      return ['all', ['==', ['get', 'kind'], 'bar'], parts.length ? ['any', ...parts] : false];
    }

    function fitFont(g, text, weight, maxPx, maxWidth) {
      let size = maxPx;
      g.font = `${weight} ${size}px "JetBrains Mono", monospace`;
      while (size > 8 && g.measureText(text).width > maxWidth) {
        size -= 1;
        g.font = `${weight} ${size}px "JetBrains Mono", monospace`;
      }
      return size;
    }

    function drawPlaza(pz) {
      const f = pz.frame;
      const ppm = Math.min(4, 4096 / f.width_m);
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(f.width_m * ppm);
      canvas.height = Math.ceil(f.height_m * ppm);
      const g = canvas.getContext('2d');
      const X = m => m * ppm;
      const gx = X(f.grid_x_m), gy = X(f.grid_y_m), cs = X(f.cell_m);
      const layer = pz.layers.find(l => l.id === plazaActive[pz.id]) || pz.layers[0] || { cells: [] };
      const cellsW = cs * pz.cols.length, cellsH = cs * pz.rows.length;
      g.fillStyle = 'rgba(8, 12, 24, 0.72)';
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.textBaseline = 'top';
      // title and axis captions in the header margin
      g.fillStyle = pz.color;
      fitFont(g, pz.title, 800, X(22), canvas.width - X(16));
      g.fillText(pz.title, X(8), X(8));
      g.fillStyle = 'rgba(223, 230, 245, 0.85)';
      fitFont(g, layer.label || pz.subtitle || '', 600, X(13), canvas.width - X(16));
      g.fillText(layer.label || pz.subtitle || '', X(8), X(36));
      if (pz.col_axis) {
        g.fillStyle = 'rgba(223, 230, 245, 0.6)';
        fitFont(g, pz.col_axis + ' →', 600, X(12), cellsW);
        g.fillText(pz.col_axis + ' →', gx, X(58));
      }
      if (pz.row_axis) {
        g.fillStyle = 'rgba(223, 230, 245, 0.6)';
        fitFont(g, '↓ ' + pz.row_axis, 600, X(12), gx - X(12));
        g.fillText('↓ ' + pz.row_axis, X(8), X(58));
      }
      // column headers
      g.textAlign = 'center';
      pz.cols.forEach((c, i) => {
        g.fillStyle = '#dfe6f5';
        fitFont(g, c, 700, X(13), cs - X(6));
        g.fillText(c, gx + cs * (i + 0.5), gy - X(26));
      });
      // row headers
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      pz.rows.forEach((r, j) => {
        g.fillStyle = '#dfe6f5';
        fitFont(g, r, 700, X(14), gx - X(14));
        g.fillText(r, gx - X(8), gy + cs * (j + 0.5));
      });
      // grid
      g.strokeStyle = 'rgba(223, 230, 245, 0.35)';
      g.lineWidth = Math.max(1, X(0.8));
      for (let i = 0; i <= pz.cols.length; i++) { g.beginPath(); g.moveTo(gx + cs * i, gy); g.lineTo(gx + cs * i, gy + cellsH); g.stroke(); }
      for (let j = 0; j <= pz.rows.length; j++) { g.beginPath(); g.moveTo(gx, gy + cs * j); g.lineTo(gx + cellsW, gy + cs * j); g.stroke(); }
      // values: number in the top-left of each cell, n/p for unpublished cells
      g.textAlign = 'left';
      g.textBaseline = 'top';
      (layer.cells || []).forEach((row, j) => row.forEach((v, i) => {
        const x = gx + cs * i + X(4), y = gy + cs * j + X(3);
        if (typeof v === 'string') {
          g.fillStyle = '#ffcf66';
          g.font = `800 ${X(15)}px "JetBrains Mono", monospace`;
          g.fillText(v, x, y);
        } else if (v === null || v === undefined) {
          g.fillStyle = 'rgba(160, 168, 188, 0.6)';
          g.font = `600 ${X(11)}px "JetBrains Mono", monospace`;
          g.fillText('n/p', x, y);
        } else {
          g.fillStyle = v === 0 ? 'rgba(160, 168, 188, 0.85)' : '#ffffff';
          g.font = `800 ${X(15)}px "JetBrains Mono", monospace`;
          g.fillText(String(v), x, y);
        }
      }));
      // special cells: caption under the fence
      (pz.highlight || []).forEach(h => {
        g.fillStyle = h.kind === 'forbidden' ? '#ff5c7a' : '#ffcf66';
        g.textAlign = 'center';
        g.textBaseline = 'bottom';
        fitFont(g, h.label || '', 800, X(10), cs - X(4));
        g.fillText(h.label || '', gx + cs * (h.col + 0.5), gy + cs * (h.row + 1) - X(3));
      });
      return canvas;
    }

    function addPlazaTextures() {
      PLAZAS.forEach(pz => {
        const id = `plaza-tex-${pz.id}`;
        map.addSource(id, { type: 'image', url: drawPlaza(pz).toDataURL('image/png'), coordinates: pz.corners });
        map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-opacity': 0.97, 'raster-fade-duration': 0 } }, 'plaza-highlight');
      });
    }

    function setPlazaLayer(plazaId, layerId) {
      plazaActive[plazaId] = layerId;
      const pz = PLAZAS.find(p => p.id === plazaId);
      const src = map.getSource(`plaza-tex-${plazaId}`);
      if (src) src.updateImage({ url: drawPlaza(pz).toDataURL('image/png'), coordinates: pz.corners });
      map.setFilter('plaza-bars', plazaBarFilter());
      document.querySelectorAll(`.plaza-switch[data-plaza="${plazaId}"] button`).forEach(b => b.classList.toggle('active', b.dataset.layer === layerId));
      if (activeSelection && activeSelection.type === 'plaza' && activeSelection.id === plazaId) {
        selectObject('plaza', plazaId, PLAZAS.indexOf(pz), true);
      }
    }

    function renderPlazaControls() {
      PLAZAS.forEach((pz, idx) => {
        const el = document.createElement('div');
        el.className = 'plaza-switch';
        el.dataset.plaza = pz.id;
        el.dataset.tourRef = pz.id;
        el.innerHTML = `<span class="plaza-switch-title">▦ ${pz.title}</span>` + (pz.layers.length > 1
          ? pz.layers.map(l => `<button data-layer="${l.id}" class="${l.id === plazaActive[pz.id] ? 'active' : ''}" title="${l.label || l.id}">${l.short || l.id}</button>`).join('')
          : '');
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const btn = e.target.closest('button');
          if (btn) setPlazaLayer(pz.id, btn.dataset.layer);
          else selectObject('plaza', pz.id, idx);
        });
        districtMarkers.push(new maplibregl.Marker({ element: el, anchor: 'bottom-left', pitchAlignment: 'viewport' })
          .setLngLat(pz.corners[0]).addTo(map));
      });
    }

    function districtNameAt(lngLat) {
      if (!layerVisibility.districts) return null;
      return districtNames.find(n => lngLat.lng >= n.bbox[0] && lngLat.lng <= n.bbox[2] && lngLat.lat >= n.bbox[1] && lngLat.lat <= n.bbox[3]) || null;
    }
    const bottleneckMarkers = [];
    const incidentMarkers = [];
    const nodeMarkers = [];
    const fieldMarkers = [];

    // Schema v2: constraints drawn where they act (edge = traffic, node = queue, field = weather)
    const BNECKS = window.BOTTLENECKS || [];
    const SCOPED = BNECKS.filter(b => b.scope);
    const TRAFFIC = window.TRAFFIC_GEOJSON || { type: 'FeatureCollection', features: [] };
    const FIELDS = window.FIELDS_GEOJSON || { type: 'FeatureCollection', features: [] };
    const EFFECT_ICON = { slowdown: '⚠️', closure: '⛔', noise: '🌫️', blind: '🌑' };
    const EFFECT_WORD = { slowdown: 'SLOWDOWN', closure: 'CLOSURE', noise: 'NOISE', blind: 'BLIND SPOT' };
    const SCOPE_WORD = { edge: 'ON A HIGHWAY', node: 'AT A SPIRE', field: 'OVER DISTRICTS' };
    // Road types by conduit status: a highway, a ferry (weak or episodic flow), a road not built yet
    const ROAD = {
      operational: { word: 'HIGHWAY', icon: '⚡', title: 'Highway — established flow' },
      thin: { word: 'FERRY', icon: '⛴️', title: 'Ferry — weak or episodic flow' },
      planned: { word: 'PLANNED ROAD', icon: '🚧', title: 'Planned road — called for, not built yet' }
    };
    const roadOf = c => ROAD[c.status] || ROAD.operational;
    // Card wording can be overridden per city (city_metadata.ui_labels), e.g. for a project map
    const L = (key, fallback) => ((window.CITY_CONFIG || {}).ui_labels || {})[key] || fallback;
    const SPIRE_STATUS = {
      done: { icon: '🟢', word: 'Built / operational' },
      active: { icon: '🟡', word: 'In progress' },
      planned: { icon: '⚪', word: 'Planned' }
    };
    const VERDICT = {
      supported: { color: '#00e599', word: 'BOUNDED SUPPORT' },
      conditional: { color: '#ffb700', word: 'CONDITIONAL' },
      contradicted: { color: '#ff1744', word: 'CONTRADICTED' },
      exploratory: { color: '#a0a8bc', word: 'EXPLORATORY' }
    };
    // Spire archetypes (spire `kind`): shape says what a thing is
    const KIND = {
      system: { icon: '🏢', word: 'System' },
      knowledge: { icon: '⛪', word: 'Knowledge' },
      instrument: { icon: '🔭', word: 'Instrument' },
      hub: { icon: '📡', word: 'Hub' }
    };
    const HAS_KINDS = (window.SPIRES_INDEX || []).some(sp => sp.kind && sp.kind !== 'system');
    const kindOf = sp => KIND[sp.kind || 'system'] || KIND.system;
    const kindWord = sp => L(`kind_${sp.kind || 'system'}`, kindOf(sp).word);
    const HAS_STATUS = (window.SPIRES_INDEX || []).some(sp => sp.status && sp.status !== 'done');

    function bneckIcon(b) {
      if (!b.scope) return '⚠️';
      if (b.scope === 'node') return b.effect === 'closure' ? '⛔' : '⏱️';
      return EFFECT_ICON[b.effect] || '⚠️';
    }
    const challengeMarkers = [];
    const conduitMarkers = [];

    // Initialize MapLibre with Directional Sunlight & Depth
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {},
          layers: [{
            id: 'background',
            type: 'background',
            paint: {
              'background-color': '#060a14'
            }
          }]
        },
        center: window.CITY_CONFIG.center,
        zoom: window.CITY_CONFIG.zoom,
        pitch: window.CITY_CONFIG.pitch,
        bearing: window.CITY_CONFIG.bearing,
        antialias: true
      });

      map.on('load', () => {
        // Configure MapLibre 3D Lighting
        if (map.setLight) {
          map.setLight({
            anchor: 'viewport',
            color: '#ffffff',
            intensity: 0.65,
            position: [1.3, 75, 45]
          });
        }

        initHeader();
        setupSourcesAndLayers();
        renderGroundStencilsAndMarkers();
        renderConstraintMarkers();
        setupInteraction();
        setupRoutePanel();
        setupBuildingSizeControls();
        setupTour();
        buildLegendUI();
        buildScaleRunway();
        startConstraintAnimations();
      });
    }

    function setupSourcesAndLayers() {
      // 1. Districts Runway Base
      const districtPolygons = {
        type: 'FeatureCollection',
        features: window.DISTRICTS.map(d => ({
          type: 'Feature',
          properties: {
            id: d.id,
            name: d.name,
            color: d.color,
            scale_label: d.scale_label
          },
          geometry: {
            type: 'Polygon',
            coordinates: [d.bounds]
          }
        }))
      };

      map.addSource('districts-geo', {
        type: 'geojson',
        data: districtPolygons
      });

      map.addLayer({
        id: 'districts-fill',
        type: 'fill',
        source: 'districts-geo',
        paint: {
          'fill-color': ['get', 'color'],
          'fill-opacity': 0.06
        }
      });

      map.addLayer({
        id: 'districts-line',
        type: 'line',
        source: 'districts-geo',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 1.5,
          'line-dasharray': [4, 3],
          'line-opacity': 0.7
        }
      });

      // 1b. Field constraints: one coloured tape per constraint along the border of each district
      // it covers. Colour = which problem, stroke = effect (solid blind · dotted noise · dashed slowdown).
      addConstraintPatterns();
      map.addSource('fields-geo', { type: 'geojson', data: FIELDS });
      [['blind', null], ['noise', [0.1, 2]], ['slowdown', [4, 2]]].forEach(([effect, dash]) => {
        const paint = { 'line-color': ['get', 'color'], 'line-width': 3, 'line-opacity': 0.85 };
        if (dash) paint['line-dasharray'] = dash;
        map.addLayer({
          id: `fields-tape-${effect}`,
          type: 'line',
          source: 'fields-geo',
          filter: ['==', ['get', 'effect'], effect],
          layout: { 'line-cap': dash && dash[0] < 1 ? 'round' : 'butt' },
          paint
        });
      });
      map.addLayer({
        id: 'fields-tape-hit',
        type: 'line',
        source: 'fields-geo',
        paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.001 }
      });

      // 1c. Priorities: ground target (bullseye) with arcs of support (green) and blockage (red)
      map.addSource('targets-geo', { type: 'geojson', data: window.TARGETS_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'targets-dot',
        type: 'fill',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'dot'],
        paint: { 'fill-color': '#ffe9a8', 'fill-opacity': 0.9 }
      });
      map.addLayer({
        id: 'targets-rings',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'ring'],
        paint: { 'line-color': '#ffe9a8', 'line-width': 1.6, 'line-opacity': 0.75 }
      });
      map.addLayer({
        id: 'targets-arcs',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'arc'],
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': ['get', 'color'], 'line-width': 4, 'line-opacity': 0.9 }
      });
      map.addLayer({
        id: 'targets-arcs-hit',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'arc'],
        paint: { 'line-color': '#000000', 'line-width': 14, 'line-opacity': 0.001 }
      });

      // Data plazas: grid texture on the ground, bars per cell, fenced special cells
      map.addSource('plaza-geo', { type: 'geojson', data: window.PLAZAS_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'plaza-hit', type: 'fill', source: 'plaza-geo', filter: ['==', ['get', 'kind'], 'hit'],
        paint: { 'fill-color': '#000000', 'fill-opacity': 0.001 }
      });
      map.addLayer({
        id: 'plaza-highlight', type: 'line', source: 'plaza-geo', filter: ['==', ['get', 'kind'], 'highlight'],
        paint: {
          'line-color': ['match', ['get', 'style'], 'forbidden', '#ff1744', '#ffb300'],
          'line-width': 3, 'line-dasharray': [1.5, 1]
        }
      });
      map.addLayer({
        id: 'plaza-bars', type: 'fill-extrusion', source: 'plaza-geo', filter: plazaBarFilter(),
        paint: {
          'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'base_height'], 'fill-extrusion-opacity': 0.85
        }
      });

      // District names painted on the ground (after the webfont is available)
      const fontsReady = document.fonts && document.fonts.load
        ? Promise.all([document.fonts.load('800 96px "JetBrains Mono"'), document.fonts.load('600 68px "JetBrains Mono"')]).catch(() => null)
        : Promise.resolve();
      fontsReady.then(() => { addDistrictNames(); addPlazaTextures(); });

      // 2. Highways (conduits)
      map.addSource('conduits-geo', {
        type: 'geojson',
        data: window.CONDUITS_GEOJSON
      });

      // Wide invisible hit-area for easy clicking anywhere near the conduit
      map.addLayer({
        id: 'conduits-hitarea',
        type: 'line',
        source: 'conduits-geo',
        paint: {
          'line-color': '#000000',
          'line-width': 22,
          'line-opacity': 0.001
        }
      });

      // Outer luminous halo
      map.addLayer({
        id: 'conduits-glow',
        type: 'line',
        source: 'conduits-geo',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 8,
          'line-blur': 5,
          'line-opacity': ['match', ['get', 'status'], 'planned', 0.12, 'thin', 0.3, 0.65]
        }
      });

      // Inner core — one layer per status, since dash patterns cannot be data-driven:
      // operational = solid road, thin = ferry line (sparse dots), planned = road under construction
      map.addLayer({
        id: 'conduits-core',
        type: 'line',
        source: 'conduits-geo',
        filter: ['!', ['in', ['get', 'status'], ['literal', ['thin', 'planned']]]],
        paint: {
          'line-color': '#ffffff',
          'line-width': 2.5,
          'line-dasharray': [3, 2],
          'line-opacity': 0.95
        }
      });
      map.addLayer({
        id: 'conduits-core-thin',
        type: 'line',
        source: 'conduits-geo',
        filter: ['==', ['get', 'status'], 'thin'],
        layout: { 'line-cap': 'round' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 2.5,
          'line-dasharray': [0.1, 3.2],
          'line-opacity': 0.9
        }
      });
      map.addLayer({
        id: 'conduits-core-planned',
        type: 'line',
        source: 'conduits-geo',
        filter: ['==', ['get', 'status'], 'planned'],
