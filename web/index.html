  <!-- LOAD COMPILED DATASET -->
  <script src="city-data.js"></script>

  <script>
    // State management
    let map = null;
    let isOrbiting = false;
    let orbitAnimationId = null;
    let activeSelection = null; // { type: 'spire'|'bottleneck'|'challenge'|'conduit', id: string, index: number }
    let layerVisibility = {
      districts: true,
      spires: true,
      conduits: true,
      bottlenecks: true,
      challenges: true,
      traffic: true,
      queues: true,
      weather: true
    };

    const districtMarkers = [];
    // District names are painted on the ground as textures (canvas -> image source), so WebGL
    // projects them with the same camera as the districts and they never drift off the edge.
    const districtNames = [];            // { id, bbox: [minLng, minLat, maxLng, maxLat] }
    const NAME_INSET_M = 20;             // from the district's west edge
    const NAME_GAP_M = 16;               // below the district's south edge
    const NAME_MAX_WIDTH = 0.92;         // share of the district width the name may use
    const NAME_MAX_HEIGHT_M = 110;       // both lines together; the strip between districts is 240 m
    let districtNameHover = false;

    function drawSpacedText(g, text, x, y, spacing) {
      for (const ch of text) {
        g.fillText(ch, x, y);
        x += g.measureText(ch).width + spacing;
      }
    }

    function spacedWidth(g, text, spacing) {
      let w = 0;
      for (const ch of text) w += g.measureText(ch).width + spacing;
      return w - spacing;
    }

    function drawDistrictName(d) {
      const TITLE = '800 96px "JetBrains Mono", monospace', TAG = '600 68px "JetBrains Mono", monospace';
      const title = d.name.toUpperCase(), tag = (d.scale_label || '').toUpperCase();
      const pad = 60;
      const probe = document.createElement('canvas').getContext('2d');
      probe.font = TITLE; const titleW = spacedWidth(probe, title, 24);
      probe.font = TAG; const tagW = spacedWidth(probe, tag, 12);
      const canvas = document.createElement('canvas');
      canvas.width = Math.min(4096, Math.ceil(Math.max(titleW, tagW) + 2 * pad));
      canvas.height = Math.ceil(96 * 1.15 + 12 + 68 * 1.15 + 2 * pad);
      const g = canvas.getContext('2d');
      g.textBaseline = 'top';
      g.fillStyle = d.color;
      g.shadowColor = d.color;
      g.font = TITLE;
      g.globalAlpha = 0.85;
      [70, 28].forEach(blur => { g.shadowBlur = blur; drawSpacedText(g, title, pad, pad, 24); });
      g.font = TAG;
      g.globalAlpha = 0.7;
      g.shadowBlur = 16;
      drawSpacedText(g, tag, pad, pad + 96 * 1.15 + 12, 12);
      return canvas;
    }

    function addDistrictNames() {
      window.DISTRICTS.forEach((d, i) => {
        const canvas = drawDistrictName(d);
        const lngs = d.bounds.map(p => p[0]);
        const lats = d.bounds.map(p => p[1]);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs), minLat = Math.min(...lats);
        const mPerDegLng = 111320 * Math.cos(d.center[1] * Math.PI / 180);
        const widthM = (maxLng - minLng) * mPerDegLng;
        const metresPerPx = Math.min((widthM - 2 * NAME_INSET_M) * NAME_MAX_WIDTH / canvas.width, NAME_MAX_HEIGHT_M / canvas.height);
        const west = minLng + NAME_INSET_M / mPerDegLng;
        const east = west + canvas.width * metresPerPx / mPerDegLng;
        const north = minLat - NAME_GAP_M / 111320;
        const south = north - canvas.height * metresPerPx / 111320;
        const id = `district-name-${i}`;
        map.addSource(id, { type: 'image', url: canvas.toDataURL('image/png'), coordinates: [[west, north], [east, north], [east, south], [west, south]] });
        map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-opacity': 0.95, 'raster-fade-duration': 0 } }, 'fields-tape-blind');
        districtNames.push({ id: d.id, layer: id, bbox: [west, south, east, north] });
      });
    }

    // ===== Guided tour (city_metadata-independent: window.TOUR from the spec's "tour") =====
    const TOUR = window.TOUR || [];
    let tourIndex = -1;
    const tourSaved = {};

    function tourRefsIn(el) {
      const refs = [];
      if (el.dataset && el.dataset.tourRef) refs.push(el.dataset.tourRef);
      el.querySelectorAll('[data-tour-ref]').forEach(n => refs.push(n.dataset.tourRef));
      return refs;
    }

    let paintSaved = false;
    function saveTourPaint() {
      if (paintSaved) return;
      paintSaved = true;
      const save = (layer, prop) => { if (map.getLayer(layer)) tourSaved[`${layer}|${prop}`] = map.getPaintProperty(layer, prop); };
      ['buildings-3d', 'buildings-ghost'].forEach(l => save(l, 'fill-extrusion-color'));
      ['conduits-glow', 'conduits-core', 'conduits-core-thin', 'conduits-core-planned', 'targets-rings', 'targets-arcs', 'targets-dot'].forEach(l =>
        save(l, map.getLayer(l) && map.getLayer(l).type === 'fill' ? 'fill-opacity' : 'line-opacity'));
      PLAZAS.forEach(pz => save(`plaza-tex-${pz.id}`, 'raster-opacity'));
      save('plaza-bars', 'fill-extrusion-opacity');
      save('districts-line', 'line-width');
      save('districts-line', 'line-opacity');
    }

    function restoreTourPaint() {
      Object.entries(tourSaved).forEach(([key, val]) => {
        const [layer, prop] = key.split('|');
        if (map.getLayer(layer)) map.setPaintProperty(layer, prop, val);
      });
    }

    // Everything outside the stop's focus fades: building colours turn slate (opacity is
    // per layer in MapLibre, colour is per feature), roads and plazas dim, markers fade.
    function applyTourFocus(stop) { applyFocus(stop.focus || []); }

    function applyFocus(refs) {
      restoreTourPaint();
      const focus = new Set(refs);
      const dists = refs.filter(r => r.startsWith('@dist-'));
      window.SPIRES_INDEX.forEach(sp => { if (dists.includes(sp.district_ref)) focus.add(sp.id); });
      const list = [...focus];
      const dim = '#1c2333';
      const inFocus = key => ['in', ['get', key], ['literal', list]];
      ['buildings-3d', 'buildings-ghost'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        map.setPaintProperty(layer, 'fill-extrusion-color', ['case',
          ['any', inFocus('spire_ref'), inFocus('challenge_ref'), inFocus('bottleneck_ref')],
          ['coalesce', ['get', 'color'], '#00f0ff'], dim]);
      });
      ['conduits-glow', 'conduits-core', 'conduits-core-thin', 'conduits-core-planned'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        const base = tourSaved[`${layer}|line-opacity`];
        map.setPaintProperty(layer, 'line-opacity', ['case', inFocus('id'), base === undefined ? 0.9 : base, 0.08]);
      });
      ['targets-rings', 'targets-arcs'].forEach(layer => {
        if (map.getLayer(layer)) map.setPaintProperty(layer, 'line-opacity', ['case', inFocus('challenge_ref'), 0.9, 0.12]);
      });
      if (map.getLayer('targets-dot')) map.setPaintProperty('targets-dot', 'fill-opacity', ['case', inFocus('challenge_ref'), 0.9, 0.15]);
      PLAZAS.forEach(pz => {
        const layer = `plaza-tex-${pz.id}`;
        if (map.getLayer(layer)) map.setPaintProperty(layer, 'raster-opacity', focus.has(pz.id) ? 0.97 : 0.2);
      });
      if (map.getLayer('plaza-bars')) {
        const anyPlaza = PLAZAS.some(pz => focus.has(pz.id));
        map.setPaintProperty('plaza-bars', 'fill-extrusion-opacity', anyPlaza ? 0.85 : 0.2);
      }
      if (dists.length && map.getLayer('districts-line')) {
        map.setPaintProperty('districts-line', 'line-width', ['case', inFocus('id'), 4, 1.5]);
        map.setPaintProperty('districts-line', 'line-opacity', ['case', inFocus('id'), 1, 0.25]);
      }
      // a constraint in focus also lights up the spire it sits on; a spire lights its node chips
      document.querySelectorAll('.maplibregl-marker').forEach(el => {
        el.classList.toggle('tour-focus', tourRefsIn(el).some(r => focus.has(r)));
      });
    }

    function goToStop(i) {
      if (!TOUR.length) return;
      tourIndex = Math.max(0, Math.min(TOUR.length - 1, i));
      const stop = TOUR[tourIndex];
      closeDrawer();
      stopOrbit();
      Object.entries(stop.plaza_layers || {}).forEach(([pid, layer]) => setPlazaLayer(pid, layer));
      actionFocus = null;
      clearPlazaCells();
      document.body.classList.remove('spotlight');
      applyTourFocus(stop);
      map.flyTo({ ...stop.camera, duration: currentView === 'metro' ? 0 : 1600, essential: true, padding: { top: 60, bottom: 230, left: 360, right: 40 } });
      if (currentView === 'metro') { highlightMetro(metroStationRefs(stop.focus || [])); focusMetro(metroStationRefs(stop.focus || [])); }
      document.getElementById('tourStep').textContent = `${tourIndex + 1} / ${TOUR.length}`;
      document.getElementById('tourTitle').textContent = stop.title;
      document.getElementById('tourText').textContent = stop.text;
      document.getElementById('tourLook').textContent = stop.look ? `👁 ${stop.look}` : '';
      // optional list (e.g. the six rules), coloured by the verdict of the referenced challenge
      document.getElementById('tourItems').innerHTML = (stop.items || []).map(it => {
        const e = refEntity(it.ref);
        const verdict = e && e.kind === 'challenge' && e.item.verdict ? VERDICT[e.item.verdict] : null;
        return `<li><span class="tour-item-dot" style="background: ${verdict ? verdict.color : '#7cffb2'};"></span><span>${it.text}</span>${
          verdict ? `<span class="tour-item-verdict" style="color: ${verdict.color};">${verdict.word.toLowerCase()}</span>` : ''}</li>`;
      }).join('');
      document.querySelectorAll('.tour-dot').forEach((d, j) => d.classList.toggle('active', j === tourIndex));
      document.getElementById('tourPrevBtn').disabled = tourIndex === 0;
      document.getElementById('tourNextBtn').textContent = tourIndex === TOUR.length - 1 ? 'Finish ✓' : 'Next ▶';
      try { history.replaceState(null, '', `#tour=${tourIndex + 1}`); } catch (e) { /* file:// or sandboxed */ }
      (stop.do || []).forEach(act);
      playStopNarration();
    }

    let layersBeforeTour = null;

    function startTour(i) {
      if (!TOUR.length) return;
      if (tourIndex < 0) {
        layersBeforeTour = { ...layerVisibility };
        Object.keys(layerVisibility).forEach(key => setLayerVisible(key, true));
        saveTourPaint();
      }
      document.body.classList.add('touring');
      document.getElementById('tourCard').classList.add('open');
      document.getElementById('tourBtn').classList.add('active');
      goToStop(i || 0);
    }

    function endTour() {
      if (tourIndex < 0) return;
      tourIndex = -1;
      stopNarration();
      actionFocus = null;
      clearPlazaCells();
      restoreTourPaint();
      PLAZAS.forEach(pz => setPlazaLayer(pz.id, (pz.layers[0] || {}).id));
      document.body.classList.remove('touring');
      document.querySelectorAll('.maplibregl-marker.tour-focus').forEach(el => el.classList.remove('tour-focus'));
      document.getElementById('tourCard').classList.remove('open');
      document.getElementById('tourBtn').classList.remove('active');
      if (currentView === 'metro') { highlightMetro([]); fitMetro(true); }
      if (layersBeforeTour) {
        Object.entries(layersBeforeTour).forEach(([key, visible]) => setLayerVisible(key, visible));
        layersBeforeTour = null;
      }
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    }

    // ===== Actions: one vocabulary for the tour script, pre-voiced answers and the voice agent =====
    // {show: ref | [refs]}   fly there and light only that; a district shows whole
    // {open: ref}            open its card
    // {tour: n}              go to stop n (1-based; 0 ends the tour)
    // {view: 'city'|'metro'}
    // {highlight: [refs]}    light only these, camera stays; [] goes back to the stop's focus
    // {plaza_cell: {plaza, row, col}}  ring one cell (row/col as index or label); null clears
    let actionFocus = null;      // refs lit by an action; null = the tour stop's own focus
    const plazaCellMark = {};    // plaza id → {row, col}
    const asList = v => (Array.isArray(v) ? v : v ? [v] : []);

    function currentFocus() { return actionFocus || (tourIndex >= 0 ? TOUR[tourIndex].focus || [] : []); }

    // Refs as the metro draws them: a district is its line, a road its two ends, a constraint what it constrains
    function metroStationRefs(refs) {
      const st = new Set(METRO.stations.map(s => s.ref));
      const out = new Set();
      const add = ref => {
        if (st.has(ref)) { out.add(ref); return; }
        const e = refEntity(ref);
        if (!e) return;
        if (e.kind === 'district') METRO.stations.filter(s => s.line === ref).forEach(s => out.add(s.ref));
        else if (e.kind === 'conduit') [e.item.from, e.item.to].forEach(r => st.has(r) && out.add(r));
        else if (e.kind === 'bottleneck') asList(e.item.constrains).forEach(r => r !== ref && add(r));
      };
      refs.forEach(add);
      return [...out];
    }

    function setFocus(refs) {
      if (!refs.length && tourIndex < 0) {
        document.body.classList.remove('spotlight');
        restoreTourPaint();
        document.querySelectorAll('.maplibregl-marker.tour-focus').forEach(el => el.classList.remove('tour-focus'));
        if (currentView === 'metro') highlightMetro([]);
        return;
      }
      if (tourIndex < 0) document.body.classList.add('spotlight');
      saveTourPaint();
      applyFocus(refs);
      if (currentView === 'metro') highlightMetro(metroStationRefs(refs));
    }

    function showRefs(refs) {
      refs = refs.filter(r => refEntity(r));
      if (!refs.length) return;
      actionFocus = refs;
      setFocus(refs);
      if (currentView === 'metro') { focusMetro(metroStationRefs(refs)); return; }
      stopOrbit();
      const pts = [];
      refs.forEach(r => {
        const e = refEntity(r);
        if (e.kind === 'district') pts.push(...e.item.bounds);
        else if (refLocation(r)) pts.push(refLocation(r));
      });
      if (!pts.length) return;
      const padding = tourIndex >= 0 ? { top: 70, bottom: 250, left: 80, right: 80 } : { top: 80, bottom: 80, left: 360, right: 80 };
      const bounds = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
      const cam = map.cameraForBounds(bounds, { padding, maxZoom: 15.8 }) || { center: pts[0], zoom: 15.4 };
      // cameraForBounds frames a flat map; tilted, the far side recedes, so back off a little.
      // A single building keeps its neighbours in view.
      map.flyTo({ center: cam.center, zoom: Math.min(cam.zoom - 0.4, 15.4), pitch: map.getPitch(), bearing: map.getBearing(),
        padding, duration: 1400, essential: true });
    }

    function redrawPlaza(pid) {
      const pz = PLAZAS.find(p => p.id === pid);
      const src = map.getSource(`plaza-tex-${pid}`);
      if (pz && src) src.updateImage({ url: drawPlaza(pz).toDataURL('image/png'), coordinates: pz.corners });
    }

    function clearPlazaCells() {
      Object.keys(plazaCellMark).forEach(pid => { delete plazaCellMark[pid]; redrawPlaza(pid); });
    }

    function markPlazaCell(arg) {
      if (!arg) { clearPlazaCells(); return; }
      const pz = PLAZAS.find(p => p.id === arg.plaza);
      if (!pz) return;
      const index = (v, labels) => (typeof v === 'number' ? v : labels.indexOf(v));
      const row = index(arg.row, pz.rows), col = index(arg.col, pz.cols);
      if (!(row >= 0 && row < pz.rows.length && col >= 0 && col < pz.cols.length)) return;
      clearPlazaCells();
      plazaCellMark[pz.id] = { row, col };
      redrawPlaza(pz.id);
      // a dimmed plaza would hide the ring: bring it into the focus
      const focus = currentFocus();
      if ((tourIndex >= 0 || actionFocus) && !focus.includes(pz.id)) { actionFocus = [...focus, pz.id]; setFocus(actionFocus); }
    }

    const ACTIONS = {
      show: v => showRefs(asList(v)),
      open: v => { if (refEntity(v)) gotoRef(v); },
      tour: v => { const n = +v; if (!n) endTour(); else if (tourIndex < 0) startTour(n - 1); else goToStop(n - 1); },
      view: v => setView(v),
      highlight: v => { const refs = asList(v).filter(r => refEntity(r)); actionFocus = refs.length ? refs : null; setFocus(currentFocus()); },
      plaza_cell: v => markPlazaCell(v),
      ask: v => (v === 'start' ? startTalk() : pulseAsk()),
    };

    function act(action) {
      Object.entries(action || {}).forEach(([name, arg]) => {
        if (ACTIONS[name]) ACTIONS[name](arg);
        else console.warn(`metropolis: unknown action ${name}`);
      });
    }
    window.metropolis = { act, actions: Object.keys(ACTIONS) };

    // ===== Narrated tour: each stop's dialogue as voiced audio (deckcast), subtitles, and the
    // line's actions fired when the line starts. A stop may end with a quiz: the map asks, the
    // reader answers by clicking an object, a voiced line says right or wrong, the tour moves on.
    // window.NARRATION comes from the compiler; pages are keyed like deckcast's: stop n -> n,
    // quiz k of stop n -> 100n + 10k + (1 ask, 2 right, 3 wrong).
    const NARRATION = window.NARRATION || null;
    const SPEAKER_COLORS = ['#7cffb2', '#ffcf66', '#00f0ff', '#ff7ad9'];
    const narrAudio = new Audio();
    narrAudio.preload = 'auto';
    let narrating = false;   // the narrated mode is on (survives stop changes)
    let clip = null;         // what the audio plays now: { key, lines, onEnd }
    let narrCue = -1;        // index of the line being spoken within the clip
    let narrNext = null;     // timer to the next stop
    let quiz = null;         // { i, q } while the map waits for the reader's click

    const narrPage = key => (NARRATION && NARRATION.base ? NARRATION.pages[String(key)] : null);
    const hasNarration = () => TOUR.some((_, i) => narrPage(i + 1));
    const quizKey = (i, k, part) => 100 * (i + 1) + 10 * (k + 1) + part;

    function speakerOf(id) {
      const k = NARRATION.speakers.findIndex(sp => sp.id === id);
      return { ...(NARRATION.speakers[k] || { name: id }), color: SPEAKER_COLORS[Math.max(0, k) % SPEAKER_COLORS.length] };
    }

    function showSubtitle(line) {
      const who = document.getElementById('tourSubWho');
      if (!line) { who.textContent = ''; document.getElementById('tourSubText').textContent = ''; return; }
      const sp = speakerOf(line.speaker);
      who.textContent = sp.name;
      who.style.color = sp.color;
      document.getElementById('tourSubText').textContent = line.text.replace(/\[[^\]]*\]\s*/g, '');
    }

    function setListenUI() {
      const btn = document.getElementById('tourListenBtn');
      btn.classList.toggle('active', narrating && !narrAudio.paused);
      btn.textContent = !narrating ? '🔊 Listen' : quiz && narrAudio.ended ? '↻ Ask again' : narrAudio.paused ? '▶ Resume' : '⏸ Pause';
      btn.style.display = hasNarration() ? '' : 'none';
      document.body.classList.toggle('narrating', narrating && !!narrPage(tourIndex + 1));
      document.body.classList.toggle('quizzing', !!quiz);
    }

    function narrTick() { narrTickOnce(); if (narrating && !narrAudio.paused) requestAnimationFrame(narrTick); }

    function narrTickOnce() {
      const page = clip && narrPage(clip.key);
      if (!narrating || !page) return;
      const t = narrAudio.currentTime;
      let idx = -1;
      page.cues.forEach((c, j) => { if (c.start <= t + 0.05) idx = j; });
      if (idx > narrCue) {
        // fire every line passed since the last tick (a seek or a slow frame can skip one)
        for (let j = narrCue + 1; j <= idx; j++) (clip.lines[j] && clip.lines[j].do || []).forEach(act);
        narrCue = idx;
        showSubtitle(clip.lines[idx]);
      }
    }

    function playClip(key, lines, onEnd) {
      clearTimeout(narrNext);
      narrAudio.pause();
      narrCue = -1;
      clip = { key, lines, onEnd };
      narrAudio.src = NARRATION.base + narrPage(key).file;
      narrAudio.currentTime = 0;
      showSubtitle(lines[0]);
      narrAudio.play().then(() => { setListenUI(); narrTick(); }).catch(err => {
        setListenUI();
        // browsers refuse sound before the first click: ask for one (deep link #listen)
        if (err && err.name === 'NotAllowedError') document.getElementById('listenGate').classList.add('open');
      });
      setListenUI();
    }

    function playStopNarration() {
      quiz = null;
      clearTimeout(narrNext);
      if (!narrating || !narrPage(tourIndex + 1)) { clip = null; narrAudio.pause(); showSubtitle(null); setListenUI(); return; }
      const i = tourIndex;
      playClip(i + 1, TOUR[i].dialogue || [], () => afterStop(i));
    }

    function afterStop(i) {
      const q = (TOUR[i].quiz || [])[0];
      if (q && narrPage(quizKey(i, 0, 1))) {
        quiz = { i, q };   // a click during the question already counts
        playClip(quizKey(i, 0, 1), [q.ask], setListenUI);
      } else nextStop();
    }

    function nextStop() {
      narrNext = setTimeout(() => {
        if (narrating && tourIndex >= 0 && tourIndex < TOUR.length - 1) goToStop(tourIndex + 1);
        else { narrating = false; setListenUI(); }
      }, 1400);
    }

    // called by selectObject: while a quiz waits, a click on the map is an answer, not a card
    function answerQuiz(ref) {
      if (!quiz || !narrating) return false;
      const { i, q } = quiz;
      quiz = null;
      const right = (q.answer || []).includes(ref);
      playClip(quizKey(i, 0, right ? 2 : 3), [right ? q.right : q.wrong], nextStop);
      return true;
    }

    function stopNarration() {
      narrating = false;
      document.getElementById('listenGate').classList.remove('open');
      quiz = null;
      clip = null;
      clearTimeout(narrNext);
      narrAudio.pause();
      showSubtitle(null);
      setListenUI();
    }

    function toggleListen() {
      if (!narrating) { narrating = true; if (tourIndex < 0) startTour(0); else playStopNarration(); return; }
      if (narrAudio.paused) narrAudio.play().then(() => { setListenUI(); narrTick(); }).catch(() => {});
      else narrAudio.pause();
      setListenUI();
    }

    narrAudio.addEventListener('pause', setListenUI);
    // timeupdate keeps lines moving when frames are throttled (background tab, slow GPU)
    narrAudio.addEventListener('timeupdate', narrTickOnce);
    narrAudio.addEventListener('ended', () => {
      narrTickOnce();
      setListenUI();
      if (narrating && clip && clip.onEnd) clip.onEnd();
    });

    function setupNarration() {
      if (!hasNarration()) return;
      const listen = document.getElementById('listenBtn');
      listen.style.display = '';
      listen.addEventListener('click', () => { if (tourIndex >= 0 && narrating) endTour(); else toggleListen(); });
      document.getElementById('tourListenBtn').addEventListener('click', toggleListen);
      window.addEventListener('keydown', e => {
        if (tourIndex < 0 || (e.target && /input|select|textarea/i.test(e.target.tagName))) return;
        if (e.key === 'p' || e.key === 'P') { e.preventDefault(); toggleListen(); }
      });
      document.getElementById('listenGateBtn').addEventListener('click', () => {
        document.getElementById('listenGate').classList.remove('open');
        narrAudio.play().then(() => { setListenUI(); narrTick(); }).catch(() => {});
      });
      // deep link: #listen starts the narrated tour (at #tour=N if given), e.g. …/#tour=1&listen
      if (/(^#|&)listen\b/.test(location.hash)) {
        const m = /tour=(\d+)/.exec(location.hash);
        setTimeout(() => { narrating = true; if (tourIndex < 0) startTour(m ? +m[1] - 1 : 0); else playStopNarration(); }, 1500);
      }
      setListenUI();
    }

    // ===== Talk to the city (level 3): an ElevenLabs voice agent (made by cli.voice_agent) that
    // knows the map from its knowledge-base export and points at it through the same actions.
    // The SDK loads only when the reader presses Ask; the agent id is public, the key never is.
    const ELEVEN_SDK = 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/+esm';
    let talk = null;   // the live conversation

    function talkUI(mode, status) {
      const panel = document.getElementById('talkPanel');
      panel.dataset.mode = mode;
      document.getElementById('talkStatus').textContent = status;
    }

    // the model sometimes drops the leading @ of an id, or sends one id instead of a list
    const refsOf = v => asList(v).map(r => String(r).trim()).map(r => (r.startsWith('@') ? r : '@' + r));

    async function startTalk() {
      if (talk) return;
      if (narrating && !narrAudio.paused) narrAudio.pause();   // one voice at a time
      document.body.classList.add('talking');
      document.getElementById('talkBtn').classList.add('active');
      document.getElementById('talkYou').textContent = '';
      document.getElementById('talkLine').textContent = '';
      talkUI('connecting', 'CONNECTING…');
      const tool = (name, fn) => params => {
        console.info('metropolis: agent calls', name, JSON.stringify(params));
        try { fn(params || {}); } catch (e) { console.warn(e); }
        return `${name}: done`;
      };
      try {
        const { Conversation } = await import(ELEVEN_SDK);
        talk = await Conversation.startSession({
          agentId: NARRATION.agent_id,
          clientTools: {
            show: tool('show', p => act({ show: refsOf(p.refs || p.ref) })),
            highlight: tool('highlight', p => act({ highlight: refsOf(p.refs) })),
            open: tool('open', p => act({ open: refsOf(p.ref)[0] })),
            view: tool('view', p => act({ view: p.mode })),
            tour: tool('tour', p => act({ tour: +p.stop || 0 })),
          },
          // only a live conversation ends the panel; a failed start keeps it open with the reason
          onStatusChange: ({ status }) => { if (status === 'disconnected' && talk) endTalk(); },
          onModeChange: ({ mode }) => talkUI(mode, mode === 'speaking' ? 'SPEAKING' : 'LISTENING — ASK ANYTHING'),
          onMessage: ({ source, message }) => {
            const text = String(message).replace(/\[[^\]]*\]\s*/g, '');   // the voice's [emotion] tags
            document.getElementById(source === 'user' ? 'talkYou' : 'talkLine').textContent = source === 'user' ? `“${text}”` : text;
          },
          onError: msg => { console.warn('talk:', msg); talkUI('error', 'CONNECTION PROBLEM'); },
        });
        talkUI('listening', 'LISTENING — ASK ANYTHING');
      } catch (e) {
        console.warn('talk:', e);
        talk = null;
        // the usual causes: no microphone permission, a page served over plain http, or no network
        talkUI('error', window.isSecureContext ? 'NO MICROPHONE OR NO NETWORK' : 'NEEDS HTTPS OR LOCALHOST');
      }
    }

    function endTalk() {
      const t = talk;
      talk = null;
      if (t) t.endSession().catch(() => {});
      document.body.classList.remove('talking');
      document.getElementById('talkBtn').classList.remove('active');
    }

    // a typed question to the live agent (the same conversation as the microphone)
    window.metropolis.ask = text => (talk ? talk.sendUserMessage(String(text)) : null);

    // point at the Ask button for a few seconds (a narrated line says "press Ask")
    function pulseAsk() {
      const btn = document.getElementById('talkBtn');
      if (!btn || btn.style.display === 'none') return;
      btn.classList.remove('pulse');
      void btn.offsetWidth;   // restart the animation
      btn.classList.add('pulse');
      setTimeout(() => btn.classList.remove('pulse'), 12000);
    }

    function setupTalk() {
      if (!NARRATION || !NARRATION.agent_id) return;
      const btn = document.getElementById('talkBtn');
      btn.style.display = '';
      btn.addEventListener('click', () => (document.body.classList.contains('talking') ? endTalk() : startTalk()));
      document.getElementById('talkEndBtn').addEventListener('click', endTalk);
      if (/(^#|&)ask\b/.test(location.hash)) {
        const gate = document.getElementById('listenGate'), gbtn = document.getElementById('listenGateBtn');
        gbtn.textContent = '🎙 Talk to the city';
        gbtn.onclick = () => { gate.classList.remove('open'); gbtn.textContent = '🎧 Start the narrated tour'; gbtn.onclick = null; startTalk(); };
        setTimeout(() => gate.classList.add('open'), 1200);
      }
    }

    function setupTour() {
      const btn = document.getElementById('tourBtn');
      if (!TOUR.length) { btn.style.display = 'none'; return; }
      document.getElementById('tourDots').innerHTML = TOUR.map((s, j) => `<span class="tour-dot" title="${s.title}" data-stop="${j}"></span>`).join('');
      document.getElementById('tourDots').addEventListener('click', e => {
        const d = e.target.closest('[data-stop]');
        if (d) goToStop(+d.dataset.stop);
      });
      btn.addEventListener('click', () => (tourIndex < 0 ? startTour(0) : endTour()));
      document.getElementById('tourPrevBtn').addEventListener('click', () => goToStop(tourIndex - 1));
      document.getElementById('tourNextBtn').addEventListener('click', () => (tourIndex >= TOUR.length - 1 ? endTour() : goToStop(tourIndex + 1)));
      document.getElementById('tourCloseBtn').addEventListener('click', endTour);
      // Capture phase: while touring, these keys belong to the tour, not to the drawer pager
      window.addEventListener('keydown', (e) => {
        if (tourIndex < 0) return;
        if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
        let handled = true;
        if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') goToStop(tourIndex + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToStop(tourIndex - 1);
        else if (e.key === 'Escape') endTour();
        else if (/^[1-9]$/.test(e.key) && +e.key <= TOUR.length) goToStop(+e.key - 1);
        else handled = false;
        if (handled) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
      const m = /#tour=(\d+)/.exec(location.hash);
      if (m) {
        // wait for district names / plaza textures so the first stop is dimmed correctly
        setTimeout(() => startTour(+m[1] - 1), 1200);
      }
    }


    // ===== Metro view: schematic map from window.METRO (same spec as the city) =====
    const METRO = window.METRO || { lines: [], stations: [], interchanges: [] };
    const M_UNIT = 120, M_ROW = 130, M_PAD = 220;
    let metroView = null;      // { x, y, w, h } viewBox
    let metroBuilt = false;
    let currentView = 'city';

    function metroY(row) { const rows = METRO.lines.length; return M_PAD + (rows - 1 - row) * M_ROW; }
    function metroX(x) { return M_PAD + 260 + x * M_UNIT; }
    function metroStationLabel(st) {
      const e = refEntity(st.ref);
      if (!e) return { name: st.ref, sub: '' };
      const it = e.item;
      if (e.kind === 'plaza') return { name: it.title, sub: '▦ table' };
      if (e.kind === 'challenge') return { name: `${it.codename} · ${it.title}`, sub: it.verdict ? VERDICT[it.verdict].word.toLowerCase() : '' };
      return { name: it.title, sub: it.metrics && it.metrics.scale ? it.metrics.scale : '' };
    }
    function wrapLabel(text, max) {
      const words = text.split(' '); const out = []; let cur = '';
      words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
      if (cur) out.push(cur);
      return out.slice(0, 3);
    }

    // Labels live in screen pixels: each label group is drawn at 1 unit = 1 px and placed with
    // translate(x, y) scale(k), k = SVG units per screen pixel. On every zoom the labels are
    // re-placed greedily (most important first) into free spots around their station; a label
    // that fits nowhere is hidden until the user zooms in (its name stays in the hover tooltip).
    const M_FONT = 12, M_SUB = 10;
    let metroLabels = [];      // { g, cx, cy, w, h, r, prio, side }
    let metroFixed = [];       // { g, ux, uy, w, h, anchor } line names (always shown)
    let metroLastK = null;
    let metroFocus = new Set();   // tour / selection focus: their labels are placed first

    // Line geometry: each line runs along its row, but at an interchange its members leave
    // their rows on 45° diagonals and pass side by side as close parallel tracks, so a
    // transfer is a short capsule instead of a bar across the map. Lines go back to their row
    // between interchanges when there is room for the two diagonals.
    const M_TRACK = 20, M_FLAT = 26;
    let mGeo = null;   // { paths: {lineId: [[x,y]...]}, st: {ref: {x,y}}, ic: {id: {x,y0,y1}} }
    function metroGeometry() {
      const target = {};   // ref -> y at its interchange
      const ic = {};
      METRO.interchanges.forEach(c => {
        const members = c.members.slice().sort((a, b) => {
          const ra = METRO.stations.find(s => s.ref === a).row, rb = METRO.stations.find(s => s.ref === b).row;
          return rb - ra;   // higher row = higher on screen = smaller y
        });
        const ys = members.map(m => metroY(METRO.stations.find(s => s.ref === m).row));
        const yc = ys.reduce((a, b) => a + b, 0) / ys.length;
        members.forEach((m, i) => { target[m] = yc + (i - (members.length - 1) / 2) * M_TRACK; });
        const tys = members.map(m => target[m]);
        ic[c.id] = { x: metroX(c.x), y0: Math.min(...tys), y1: Math.max(...tys) };
      });
      const paths = {}, st = {};
      METRO.lines.forEach(ln => {
        const h = metroY(ln.row);
        const stations = METRO.stations.filter(s => s.line === ln.id).sort((a, b) => a.x - b.x);
        const knots = stations.filter(s => s.ref in target).map(s => [metroX(s.x), target[s.ref]]);
        // a line whose first station is an interchange starts right there, at the track height
        const firstIsKnot = stations.length && stations[0].ref in target;
        const start = metroX(ln.x0) - 40;
        const y0 = firstIsKnot ? target[stations[0].ref] : h;
        const pts = [[start, y0]];
        let [cx, cy] = [start, y0];
        const push = (x, y) => { if (x > cx + 0.01 || pts.length === 0) { pts.push([x, y]); cx = x; cy = y; } else { pts[pts.length - 1] = [Math.max(x, cx), y]; cy = y; } };
        knots.forEach(([kx, ky]) => {
          const via = Math.abs(cy - h) + Math.abs(ky - h);
          if (cy !== h && kx - M_FLAT - cx >= via + 20) {
            push(cx + Math.abs(cy - h), h);                     // back to the row
          }
          const d = Math.abs(ky - cy);
          if (kx - M_FLAT - d > cx) push(kx - M_FLAT - d, cy);  // run level, then diagonal
          push(kx - M_FLAT, ky);
          push(kx + M_FLAT, ky);
        });
        const end = Math.max(metroX(ln.x1) + 40, cx + Math.abs(cy - h) + 40);
        if (cy !== h) push(cx + Math.abs(cy - h), h);
        push(end, h);
        paths[ln.id] = pts;
        ln._startY = y0;
        const yAt = x => {
          for (let i = 1; i < pts.length; i++) {
            const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
            if (x <= x1) return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0);
          }
          return pts[pts.length - 1][1];
        };
        stations.forEach(s => { const x = metroX(s.x); st[s.ref] = { x, y: s.ref in target ? target[s.ref] : yAt(x) }; });
      });
      return { paths, st, ic };
    }

    function buildMetro() {
      const svg = document.getElementById('metroSvg');
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v)); (parent || svg).appendChild(n); return n; };
      svg.innerHTML = '';
      metroLabels = []; metroFixed = []; metroLastK = null;
      const maxX = Math.max(1, ...METRO.stations.map(s => s.x));
      const W = metroX(maxX) + M_PAD + 120, H = metroY(-1) + M_PAD / 2;
      const gLines = el('g'), gIc = el('g'), gSt = el('g'), gLab = el('g');
      mGeo = metroGeometry();
      const textBlock = (parent, rows, sub, anchor, bold) => {
        rows.forEach((txt, k) => {
          const t = el('text', { x: 0, y: k * (M_FONT + 3), 'text-anchor': anchor, class: bold ? 'metro-line-name' : 'metro-label' }, parent);
          t.textContent = txt;
        });
        if (sub) {
          const t = el('text', { x: 0, y: rows.length * (M_FONT + 3) - 1, 'text-anchor': anchor, class: 'metro-sub' }, parent);
          t.textContent = sub;
        }
      };
      // lines and their names
      METRO.lines.forEach(ln => {
        const y = metroY(ln.row);
        const g = el('g', { class: 'metro-line', 'data-line': ln.id }, gLines);
        el('polyline', { points: mGeo.paths[ln.id].map(p => p.join(',')).join(' '), fill: 'none', stroke: ln.color, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);

      });
      // interchanges: a white capsule joining the member stations, label above its top
      METRO.interchanges.forEach((ic, icIdx) => {
        const { x, y0, y1 } = mGeo.ic[ic.id];
        const openIc = ev => { ev.stopPropagation(); if (!metroDragMoved) selectObject('interchange', ic.id, icIdx); };
        const cap = el('rect', { class: 'metro-ic', 'data-ic': ic.id, x: x - 17, y: y0 - 17, width: 34, height: y1 - y0 + 34, rx: 17, fill: '#ffffff', stroke: '#0a0f1c', 'stroke-width': 4 }, gIc);
        el('title', {}, cap).textContent = `⇄ ${ic.label || ''}${ic.title ? ' — ' + ic.title : ''}`;
        cap.addEventListener('click', openIc);
        const lg = el('g', { class: 'metro-ic-g', 'data-ic': ic.id }, gLab);
        lg.addEventListener('click', openIc);
        const t = el('text', { x: 0, y: 0, 'text-anchor': 'middle', class: 'metro-ic-label' }, lg);
        t.textContent = `⇄ ${ic.label || ''}`;
        metroLabels.push({ g: lg, cx: x, cy: y0, r: 18, prio: 100, ic: true });
      });
      // stations
      const byLine = {};
      METRO.stations.forEach(st => (byLine[st.line] = byLine[st.line] || []).push(st));
      Object.values(byLine).forEach(list => list.sort((a, b) => a.x - b.x).forEach((st, i) => {
        const ln = METRO.lines.find(l => l.id === st.line);
        const { x, y } = mGeo.st[st.ref];
        const e = refEntity(st.ref);
        const g = el('g', { class: 'metro-station', 'data-ref': st.ref }, gSt);
        const lab = metroStationLabel(st);
        el('title', {}, g).textContent = lab.name + (lab.sub ? ` — ${lab.sub}` : '');
        let r = 11;
        if (st.kind === 'plaza') {
          el('rect', { class: 'm-dot', x: x - 12, y: y - 12, width: 24, height: 24, rx: 5, fill: '#0a0f1c', stroke: ln.color, 'stroke-width': 4 }, g);
          el('path', { d: `M${x - 6} ${y}h12M${x} ${y - 6}v12`, stroke: ln.color, 'stroke-width': 2 }, g);
          r = 13;
        } else if (st.kind === 'challenge') {
          const c = e && e.item.verdict ? VERDICT[e.item.verdict].color : '#ffe9a8';
          el('circle', { class: 'm-dot', cx: x, cy: y, r: 13, fill: c, stroke: '#0a0f1c', 'stroke-width': 4 }, g);
          r = 15;
        } else {
          el('circle', { class: 'm-dot', cx: x, cy: y, r: st.interchange ? 9 : 11, fill: '#ffffff', stroke: st.interchange ? '#0a0f1c' : ln.color, 'stroke-width': st.interchange ? 3 : 5 }, g);
          r = st.interchange ? 18 : 13;
        }
        const lg = el('g', { class: 'metro-station-label', 'data-ref': st.ref }, gLab);
        const icon = e && e.kind === 'spire' && HAS_KINDS ? kindOf(e.item).icon + ' ' : '';
        const rows = wrapLabel(lab.name, 22);
        rows[0] = icon + rows[0];
        const sub = lab.sub ? (lab.sub.length > 32 ? lab.sub.slice(0, 31) + '…' : lab.sub) : '';
        textBlock(lg, rows, sub, 'start', false);
        lg.addEventListener('click', ev => { ev.stopPropagation(); if (!metroDragMoved) gotoRef(st.ref); });
        const prio = st.kind === 'challenge' ? 90 : st.kind === 'plaza' ? 80 : st.interchange ? 70 : 50;
        metroLabels.push({ g: lg, cx: x, cy: y, r, prio, side: !!st.interchange, order: i, ref: st.ref });
        g.addEventListener('click', ev => { ev.stopPropagation(); if (!metroDragMoved) gotoRef(st.ref); });
      }));
      // line key (instead of names on the map, which pile up where lines share a terminus)
      const legend = document.getElementById('metroLegend');
      const district = id => (window.DISTRICTS || []).find(d => d.id === id) || {};
      legend.innerHTML = METRO.lines.slice().sort((a, b) => a.row - b.row).map(ln => `
        <div class="metro-legend-item" data-line="${ln.id}"><span class="metro-legend-bar" style="background: ${ln.color};"></span>
          <span>${ln.name}<span class="metro-legend-sub">${district(ln.id).scale_label || ''}</span></span></div>`).join('') +
        (METRO.interchanges.length ? `<div class="metro-legend-item metro-legend-ic"><span class="metro-legend-bar" style="background: #fff; height: 14px; width: 14px; border-radius: 7px; border: 3px solid #0a0f1c; box-sizing: border-box;"></span><span>Interchange — click for why<span class="metro-legend-sub">${METRO.interchanges.length} transfers between lines</span></span></div>` : '');
      legend.querySelectorAll('[data-line]').forEach(item => item.addEventListener('click', ev => {
        ev.stopPropagation();
        focusMetro(METRO.stations.filter(s => s.line === item.dataset.line).map(s => s.ref));
      }));
      legend.addEventListener('mousedown', ev => ev.stopPropagation());
      legend.addEventListener('wheel', ev => ev.stopPropagation());

      // measure every label once, at 1 unit = 1 px
      metroLabels.concat(metroFixed).forEach(L => {
        L.g.setAttribute('transform', 'translate(0,0)');
        const b = L.g.getBBox();
        L.bx = b.x; L.by = b.y; L.w = b.width; L.h = b.height;
      });
      svg.dataset.w = W; svg.dataset.h = H;
      metroView = { x: 0, y: 0, w: W, h: H };
      metroBuilt = true;
      fitMetro();
    }

    function layoutMetroLabels() {
      const svg = document.getElementById('metroSvg');
      const box = svg.getBoundingClientRect();
      if (!box.width || !metroLabels.length) return;
      const k = metroView.w / box.width;               // SVG units per screen pixel
      if (metroLastK !== null && Math.abs(k - metroLastK) / metroLastK < 0.01) return;
      metroLastK = k;
      const placed = [];
      const hit = (a) => placed.some(b => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h);
      const PADX = 3, PADY = 2;
      // obstacles in screen px (relative to an arbitrary origin: unit / k)
      METRO.stations.forEach(st => {
        const p = mGeo.st[st.ref], x = p.x / k, y = p.y / k, r = 9;
        placed.push({ x: x - r, y: y - r, w: 2 * r, h: 2 * r });
      });
      // the line strokes: level runs as one box, diagonals sampled as small boxes
      const half = 6 / k + 2;
      Object.values(mGeo.paths).forEach(pts => {
        for (let i = 1; i < pts.length; i++) {
          const [x0, y0] = pts[i - 1].map(v => v / k), [x1, y1] = pts[i].map(v => v / k);
          if (Math.abs(y1 - y0) < 0.5) { placed.push({ x: x0, y: y0 - half, w: x1 - x0, h: 2 * half }); continue; }
          const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 6));
          for (let j = 0; j <= n; j++) {
            const x = x0 + (x1 - x0) * j / n, y = y0 + (y1 - y0) * j / n;
            placed.push({ x: x - half, y: y - half, w: 2 * half, h: 2 * half });
          }
        }
      });
      METRO.interchanges.forEach(ic => {
        const g = mGeo.ic[ic.id], x = g.x / k, y0 = g.y0 / k, y1 = g.y1 / k;
        placed.push({ x: x - 17 / k - 2, y: y0 - 17 / k, w: 34 / k + 4, h: y1 - y0 + 34 / k });
      });
      metroFixed.forEach(L => {
        const sx = L.ux / k - L.w, sy = L.uy / k - L.h / 2 + 4;
        L.g.setAttribute('transform', `translate(${L.ux},${L.uy - (L.h / 2 - 8) * k}) scale(${k})`);
        placed.push({ x: sx - PADX, y: sy - PADY, w: L.w + 2 * PADX, h: L.h + 2 * PADY });
      });
      const boost = L => (L.ref && metroFocus.has(L.ref) ? 1000 : 0);
      const items = metroLabels.slice().sort((a, b) => (b.prio + boost(b)) - (a.prio + boost(a)) || (a.order || 0) - (b.order || 0));
      items.forEach(L => {
        const cx = L.cx / k, cy = L.cy / k, gap = 6 + L.r / k;
        // candidate top-left corners of the label box, in px, relative to the station
        const above = [-L.w / 2, -gap - L.h], below = [-L.w / 2, gap];
        const right = [gap, -L.h / 2], left = [-gap - L.w, -L.h / 2];
        const ar = [gap * 0.6, -gap - L.h], br = [gap * 0.6, gap], al = [-gap * 0.6 - L.w, -gap - L.h], bl = [-gap * 0.6 - L.w, gap];
        const cands = L.ic ? [[-L.w / 2, -gap - L.h - 2], [-L.w / 2, -gap - L.h - 18], [gap, -gap - L.h], [-gap - L.w, -gap - L.h]]
          : L.side ? [right, left, ar, br, al, bl, above, below]
          : (L.order % 2 === 0 ? [above, below, ar, br, al, bl, right, left] : [below, above, br, ar, bl, al, right, left]);
        for (const [dx, dy] of cands) {
          const r = { x: cx + dx - PADX, y: cy + dy - PADY, w: L.w + 2 * PADX, h: L.h + 2 * PADY };
          if (!hit(r)) {
            placed.push(r);
            // label content starts at its own bbox origin (bx, by); shift so the box lands at (dx, dy)
            const ux = (cx + dx - L.bx) * k, uy = (cy + dy - L.by) * k;
            L.g.setAttribute('transform', `translate(${ux},${uy}) scale(${k})`);
            L.g.style.display = '';
            return;
          }
        }
        L.g.style.display = 'none';
      });
    }

    // Smooth camera moves on the metro map (tour stops, refit): interpolate the viewBox with an
    // ease-in-out curve; the width is interpolated geometrically so zooming feels even.
    let metroAnim = null;
    function animateMetroTo(target, ms) {
      if (metroAnim) cancelAnimationFrame(metroAnim.raf);
      const from = { ...metroView }, t0 = performance.now(), dur = ms || 1200;
      const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      // keep the point under the view centre moving in step with the zoom
      const fc = { x: from.x + from.w / 2, y: from.y + from.h / 2 }, tc = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
      const step = now => {
        const u = Math.min(1, (now - t0) / dur), e = ease(u);
        const w = from.w * Math.pow(target.w / from.w, e), h = from.h * Math.pow(target.h / from.h, e);
        const cx = fc.x + (tc.x - fc.x) * e, cy = fc.y + (tc.y - fc.y) * e;
        metroView = { x: cx - w / 2, y: cy - h / 2, w, h };
        applyMetroView();
        if (u < 1) metroAnim.raf = requestAnimationFrame(step); else metroAnim = null;
      };
      metroAnim = { raf: requestAnimationFrame(step) };
    }
    function stopMetroAnim() { if (metroAnim) { cancelAnimationFrame(metroAnim.raf); metroAnim = null; } }

    function applyMetroView() {
      const v = metroView;
      document.getElementById('metroSvg').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
      layoutMetroLabels();
    }
    function fitMetro(animate) {
      const svg = document.getElementById('metroSvg');
      const W = +svg.dataset.w, H = +svg.dataset.h;
      const box = svg.getBoundingClientRect();
      const aspect = (box.width || 1600) / (box.height || 1000);
      // leave room for the directory on the left and the HUD at top/bottom
      let w = W * 1.08, h = w / aspect;
      if (h < H * 1.25) { h = H * 1.25; w = h * aspect; }
      const target = { x: (W - w) / 2 - w * 0.08, y: (H - h) / 2 - h * 0.02, w, h };
      if (animate) animateMetroTo(target, 1200); else { stopMetroAnim(); metroView = target; applyMetroView(); }
    }
    function focusMetro(refs) {
      const pts = METRO.stations.filter(s => refs.includes(s.ref));
      if (!pts.length) return;
      const xs = pts.map(s => mGeo.st[s.ref].x), ys = pts.map(s => mGeo.st[s.ref].y);
      const svg = document.getElementById('metroSvg');
      const box = svg.getBoundingClientRect();
      const aspect = (box.width || 1600) / (box.height || 1000);
      let w = Math.max(1500, (Math.max(...xs) - Math.min(...xs)) * 1.5 + 700);
      let h = w / aspect;
      const needH = (Math.max(...ys) - Math.min(...ys)) * 1.6 + 500;
      if (h < needH) { h = needH; w = h * aspect; }
      const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
      // the tour card covers the lower third: shift the view down so stations sit higher
      animateMetroTo({ x: cx - w / 2 - w * 0.06, y: cy - h / 2 + h * 0.14, w, h }, 1400);
    }
    function highlightMetro(refs, selected) {
      const set = new Set(refs || []);
      metroFocus = new Set(set); if (selected) metroFocus.add(selected);
      metroLastK = null;
      document.querySelectorAll('.metro-station, .metro-station-label').forEach(g => {
        g.classList.toggle('m-focus', set.has(g.dataset.ref));
        g.classList.toggle('m-selected', g.dataset.ref === selected);
      });
      const lines = new Set(METRO.stations.filter(s => set.has(s.ref)).map(s => s.line));
      document.querySelectorAll('.metro-line').forEach(g => g.classList.toggle('m-focus', lines.has(g.dataset.line)));
      if (metroBuilt) layoutMetroLabels();
    }

    let metroDragMoved = false;
    function setupMetro() {
      const view = document.getElementById('metroView');
      const svg = document.getElementById('metroSvg');
      let drag = null;
      view.addEventListener('mousedown', e => { stopMetroAnim(); drag = { x: e.clientX, y: e.clientY, v: { ...metroView } }; metroDragMoved = false; view.classList.add('dragging'); });
      window.addEventListener('mousemove', e => {
        if (!drag) return;
        const box = svg.getBoundingClientRect(), k = metroView.w / box.width;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) metroDragMoved = true;
        metroView = { ...drag.v, x: drag.v.x - dx * k, y: drag.v.y - dy * k };
        applyMetroView();
      });
      window.addEventListener('mouseup', () => { drag = null; view.classList.remove('dragging'); });
      view.addEventListener('wheel', e => {
        e.preventDefault();
        stopMetroAnim();
        const box = svg.getBoundingClientRect();
        const f = Math.exp(e.deltaY * 0.0015);
        const px = metroView.x + (e.clientX - box.left) / box.width * metroView.w;
        const py = metroView.y + (e.clientY - box.top) / box.height * metroView.h;
        metroView = { x: px - (px - metroView.x) * f, y: py - (py - metroView.y) * f, w: metroView.w * f, h: metroView.h * f };
        applyMetroView();
      }, { passive: false });
      document.querySelectorAll('#viewSwitch button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
      window.addEventListener('resize', () => { if (currentView === 'metro' && metroBuilt) { metroLastK = null; applyMetroView(); } });
      document.getElementById('resetCamBtn').addEventListener('click', () => { if (currentView === 'metro') fitMetro(true); });
      let initial = 'city';
      try { initial = localStorage.getItem('metropolis.view') || 'city'; } catch (e) { /* storage blocked */ }
      if (/view=metro/.test(location.hash)) initial = 'metro';
      if (/view=city/.test(location.hash)) initial = 'city';
      if (!METRO.stations.length) document.getElementById('viewSwitch').style.display = 'none';
      else setView(initial);
    }
    function setView(v) {
      currentView = v === 'metro' && METRO.stations.length ? 'metro' : 'city';
      document.body.classList.toggle('metro', currentView === 'metro');
      document.querySelectorAll('#viewSwitch button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
      try { localStorage.setItem('metropolis.view', currentView); } catch (e) { /* storage blocked */ }
      if (currentView === 'metro') {
        if (!metroBuilt) buildMetro(); else fitMetro();
        const f = metroStationRefs(currentFocus());
        if (f.length) { highlightMetro(f); focusMetro(f); }
      }
    }

    // ===== Live building size (Alt/Option + scroll, [ / ] keys) =====
    // Heights scale through a paint multiplier; footprints are rescaled around each building's
    // centre (or its spire, for scaffolding and queues) from the compiled geometry.
    let buildingSize = 1;                // runtime factor on top of the compiled city_metadata.building_scale
    let buildingScaleFrame = null;
    const ORIG_BUILDINGS = JSON.parse(JSON.stringify(window.BUILDINGS_GEOJSON || { type: 'FeatureCollection', features: [] }));
    const ORIG_WIREFRAME = JSON.parse(JSON.stringify(window.WIREFRAME_GEOJSON || { type: 'FeatureCollection', features: [] }));

    function scaleRing(ring, k, center) {
      const pts = ring.length > 1 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1] ? ring.slice(0, -1) : ring;
      const c = center || [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
      return ring.map(p => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k]);
    }

    function applyBuildingSize() {
      buildingScaleFrame = null;
      const k = buildingSize;
      ['buildings-3d', 'buildings-ghost'].forEach(layer => {
        if (!map.getLayer(layer)) return;
        map.setPaintProperty(layer, 'fill-extrusion-height', ['*', ['get', 'height'], k]);
        map.setPaintProperty(layer, 'fill-extrusion-base', ['*', ['get', 'base_height'], k]);
      });
      const buildings = {
        type: 'FeatureCollection',
        features: ORIG_BUILDINGS.features.map(f => ({
          ...f,
          geometry: { ...f.geometry, coordinates: f.geometry.coordinates.map(r => scaleRing(r, k, f.properties.scale_center)) }
        }))
      };
      map.getSource('buildings-geo').setData(buildings);
      if (map.getSource('wireframe-geo')) {
        map.getSource('wireframe-geo').setData({
          type: 'FeatureCollection',
          features: ORIG_WIREFRAME.features.map(f => ({ ...f, geometry: { ...f.geometry, coordinates: scaleRing(f.geometry.coordinates, k) } }))
        });
      }
      const effective = k * ((window.CITY_CONFIG || {}).building_scale || 1);
      document.getElementById('scaleLabel').textContent = `×${effective.toFixed(2)}`;
    }

    function setBuildingSize(k) {
      buildingSize = Math.min(2.5, Math.max(0.3, k));
      if (!buildingScaleFrame) buildingScaleFrame = setTimeout(applyBuildingSize, 30);  // coalesce bursts of wheel events
    }

    function setupBuildingSizeControls() {
      // Capture phase on the map container, so MapLibre never sees Alt+wheel as a zoom
      document.getElementById('map').addEventListener('wheel', (e) => {
        if (!e.altKey) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        setBuildingSize(buildingSize * Math.exp(-e.deltaY * 0.0015));
      }, { capture: true, passive: false });
      window.addEventListener('keydown', (e) => {
        if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
        if (e.key === ']') setBuildingSize(buildingSize * 1.1);
        if (e.key === '[') setBuildingSize(buildingSize / 1.1);
      });
      document.getElementById('scaleBtn').addEventListener('click', () => setBuildingSize(1));
      applyBuildingSize();
    }

    // ===== Data plazas =====
    const PLAZAS = window.PLAZAS || [];
    const plazaActive = {};           // plaza id -> active layer id
    PLAZAS.forEach(pz => { plazaActive[pz.id] = (pz.layers[0] || {}).id; });

    function plazaBarFilter() {
      const parts = PLAZAS.map(pz => ['all', ['==', ['get', 'plaza'], pz.id], ['==', ['get', 'layer'], plazaActive[pz.id] || '']]);
      return ['all', ['==', ['get', 'kind'], 'bar'], parts.length ? ['any', ...parts] : false];
    }

    function fitFont(g, text, weight, maxPx, maxWidth) {
      let size = maxPx;
      g.font = `${weight} ${size}px "JetBrains Mono", monospace`;
      while (size > 8 && g.measureText(text).width > maxWidth) {
        size -= 1;
        g.font = `${weight} ${size}px "JetBrains Mono", monospace`;
      }
      return size;
    }

    function drawPlaza(pz) {
      const f = pz.frame;
      const ppm = Math.min(4, 4096 / f.width_m);
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(f.width_m * ppm);
      canvas.height = Math.ceil(f.height_m * ppm);
      const g = canvas.getContext('2d');
      const X = m => m * ppm;
      const gx = X(f.grid_x_m), gy = X(f.grid_y_m), cs = X(f.cell_m);
      const layer = pz.layers.find(l => l.id === plazaActive[pz.id]) || pz.layers[0] || { cells: [] };
      const cellsW = cs * pz.cols.length, cellsH = cs * pz.rows.length;
      g.fillStyle = 'rgba(8, 12, 24, 0.72)';
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.textBaseline = 'top';
      // title and axis captions in the header margin
      g.fillStyle = pz.color;
      fitFont(g, pz.title, 800, X(22), canvas.width - X(16));
      g.fillText(pz.title, X(8), X(8));
      g.fillStyle = 'rgba(223, 230, 245, 0.85)';
      fitFont(g, layer.label || pz.subtitle || '', 600, X(13), canvas.width - X(16));
      g.fillText(layer.label || pz.subtitle || '', X(8), X(36));

      if (pz.row_axis) {
        g.fillStyle = 'rgba(223, 230, 245, 0.6)';
        fitFont(g, '↓ ' + pz.row_axis, 600, X(12), gx - X(12));
        g.fillText('↓ ' + pz.row_axis, X(8), X(58));
      }
      // column labels sit under the grid, nearest the viewer, so the bars never hide them
      g.textAlign = 'center';
      pz.cols.forEach((c, i) => {
        g.fillStyle = '#dfe6f5';
        fitFont(g, c, 700, X(13), cs - X(6));
        g.fillText(c, gx + cs * (i + 0.5), gy + cellsH + X(6));
      });
      if (pz.col_axis) {
        g.textAlign = 'left';
        g.fillStyle = 'rgba(223, 230, 245, 0.6)';
        fitFont(g, pz.col_axis + ' →', 600, X(12), cellsW);
        g.fillText(pz.col_axis + ' →', gx, gy + cellsH + X(26));
      }
      // row headers
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      pz.rows.forEach((r, j) => {
        g.fillStyle = '#dfe6f5';
        fitFont(g, r, 700, X(14), gx - X(14));
        g.fillText(r, gx - X(8), gy + cs * (j + 0.5));
      });
      // hatched rows: "structural" rows whose zeros are not findings
      (pz.hatch || []).forEach(h => {
        const y0 = gy + cs * h.row;
        g.save();
        g.beginPath(); g.rect(gx, y0, cellsW, cs); g.clip();
        g.strokeStyle = 'rgba(160, 168, 188, 0.22)';
        g.lineWidth = Math.max(1, X(1.6));
        for (let x = gx - cs; x < gx + cellsW + cs; x += X(9)) { g.beginPath(); g.moveTo(x, y0 + cs); g.lineTo(x + cs, y0); g.stroke(); }
        g.restore();
        if (h.label) {
          g.fillStyle = 'rgba(200, 208, 225, 0.85)';
          g.textAlign = 'right';
          g.textBaseline = 'top';
          fitFont(g, h.label, 700, X(10), gx - X(14));
          g.fillText(h.label, gx - X(8), y0 + cs * 0.5 + X(9));
        }
      });
      // grid
      g.strokeStyle = 'rgba(223, 230, 245, 0.35)';
      g.lineWidth = Math.max(1, X(0.8));
      for (let i = 0; i <= pz.cols.length; i++) { g.beginPath(); g.moveTo(gx + cs * i, gy); g.lineTo(gx + cs * i, gy + cellsH); g.stroke(); }
      for (let j = 0; j <= pz.rows.length; j++) { g.beginPath(); g.moveTo(gx, gy + cs * j); g.lineTo(gx + cellsW, gy + cs * j); g.stroke(); }
      // values: number in the top-left of each cell, n/p for unpublished cells
      g.textAlign = 'left';
      g.textBaseline = 'top';
      // expected count under independence (row total × column total / N), shown under zeros
      const num = v => (typeof v === 'number' ? v : 0);
      const rowTot = (layer.cells || []).map(r => r.reduce((a, v) => a + num(v), 0));
      const colTot = pz.cols.map((_, i) => (layer.cells || []).reduce((a, r) => a + num(r[i]), 0));
      const grand = rowTot.reduce((a, v) => a + v, 0);
      if (pz.expected && grand) {
        (layer.cells || []).forEach((row, j) => row.forEach((v, i) => {
          if (v === null || v === undefined || (typeof v === 'number' && v > 0)) return;
          g.fillStyle = 'rgba(160, 168, 188, 0.75)';
          g.font = `600 ${X(9)}px "JetBrains Mono", monospace`;
          g.fillText(`exp ${(rowTot[j] * colTot[i] / grand).toFixed(2)}`, gx + cs * i + X(4), gy + cs * j + X(21));
        }));
      }
      (layer.cells || []).forEach((row, j) => row.forEach((v, i) => {
        const x = gx + cs * i + X(4), y = gy + cs * j + X(3);
        if (typeof v === 'string') {
          g.fillStyle = '#ffcf66';
          fitFont(g, v, 800, X(15), cs - X(8));
          g.fillText(v, x, y);
        } else if (v === null || v === undefined) {
          g.fillStyle = 'rgba(160, 168, 188, 0.6)';
          g.font = `600 ${X(11)}px "JetBrains Mono", monospace`;
          g.fillText('n/p', x, y);
        } else {
          g.fillStyle = v === 0 ? 'rgba(160, 168, 188, 0.85)' : '#ffffff';
          g.font = `800 ${X(15)}px "JetBrains Mono", monospace`;
          g.fillText(String(v), x, y);
        }
      }));
      // special cells: caption under the fence
      (pz.highlight || []).forEach(h => {
        g.fillStyle = h.kind === 'forbidden' ? '#ff5c7a' : '#ffcf66';
        g.textAlign = 'center';
        g.textBaseline = 'bottom';
        fitFont(g, h.label || '', 800, X(10), cs - X(4));
        g.fillText(h.label || '', gx + cs * (h.col + 0.5), gy + cs * (h.row + 1) - X(3));
      });
      // a cell the narration points at (plaza_cell action)
      const mark = plazaCellMark[pz.id];
      if (mark) {
        const x0 = gx + cs * mark.col, y0 = gy + cs * mark.row;
        g.save();
        g.fillStyle = 'rgba(124, 255, 178, 0.14)';
        g.fillRect(x0, y0, cs, cs);
        g.strokeStyle = '#7cffb2';
        g.lineWidth = X(3);
        g.shadowColor = '#7cffb2';
        g.shadowBlur = X(10);
        g.strokeRect(x0 + X(1.5), y0 + X(1.5), cs - X(3), cs - X(3));
        g.restore();
      }
      return canvas;
    }

    function addPlazaTextures() {
      PLAZAS.forEach(pz => {
        const id = `plaza-tex-${pz.id}`;
        map.addSource(id, { type: 'image', url: drawPlaza(pz).toDataURL('image/png'), coordinates: pz.corners });
        map.addLayer({ id, type: 'raster', source: id, paint: { 'raster-opacity': 0.97, 'raster-fade-duration': 0 } }, 'plaza-highlight');
      });
    }

    function setPlazaLayer(plazaId, layerId) {
      plazaActive[plazaId] = layerId;
      const pz = PLAZAS.find(p => p.id === plazaId);
      redrawPlaza(plazaId);
      map.setFilter('plaza-bars', plazaBarFilter());
      document.querySelectorAll(`.plaza-switch[data-plaza="${plazaId}"] button`).forEach(b => b.classList.toggle('active', b.dataset.layer === layerId));
      if (activeSelection && activeSelection.type === 'plaza' && activeSelection.id === plazaId) {
        selectObject('plaza', plazaId, PLAZAS.indexOf(pz), true);
      }
    }

    function renderPlazaControls() {
      PLAZAS.forEach((pz, idx) => {
        const el = document.createElement('div');
        el.className = 'plaza-switch';
        el.dataset.plaza = pz.id;
        el.dataset.tourRef = pz.id;
        el.innerHTML = `<span class="plaza-switch-title">▦ ${pz.title}</span>` + (pz.layers.length > 1
          ? pz.layers.map(l => `<button data-layer="${l.id}" class="${l.id === plazaActive[pz.id] ? 'active' : ''}" title="${l.label || l.id}">${l.short || l.id}</button>`).join('')
          : '');
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const btn = e.target.closest('button');
          if (btn) setPlazaLayer(pz.id, btn.dataset.layer);
          else selectObject('plaza', pz.id, idx);
        });
        districtMarkers.push(new maplibregl.Marker({ element: el, anchor: 'bottom-left', pitchAlignment: 'viewport' })
          .setLngLat(pz.corners[0]).addTo(map));
      });
    }

    function districtNameAt(lngLat) {
      if (!layerVisibility.districts) return null;
      return districtNames.find(n => lngLat.lng >= n.bbox[0] && lngLat.lng <= n.bbox[2] && lngLat.lat >= n.bbox[1] && lngLat.lat <= n.bbox[3]) || null;
    }
    const bottleneckMarkers = [];
    const incidentMarkers = [];
    const nodeMarkers = [];
    const fieldMarkers = [];

    // Schema v2: constraints drawn where they act (edge = traffic, node = queue, field = weather)
    const BNECKS = window.BOTTLENECKS || [];
    const SCOPED = BNECKS.filter(b => b.scope);
    const TRAFFIC = window.TRAFFIC_GEOJSON || { type: 'FeatureCollection', features: [] };
    const FIELDS = window.FIELDS_GEOJSON || { type: 'FeatureCollection', features: [] };
    const EFFECT_ICON = { slowdown: '⚠️', closure: '⛔', noise: '🌫️', blind: '🌑' };
    const EFFECT_WORD = { slowdown: 'SLOWDOWN', closure: 'CLOSURE', noise: 'NOISE', blind: 'BLIND SPOT' };
    const SCOPE_WORD = { edge: 'ON A HIGHWAY', node: 'AT A SPIRE', field: 'OVER DISTRICTS' };
    // Road types by conduit status: a highway, a ferry (weak or episodic flow), a road not built yet
    const ROAD = {
      operational: { word: 'HIGHWAY', icon: '⚡', title: 'Highway — established flow' },
      thin: { word: 'FERRY', icon: '⛴️', title: 'Ferry — weak or episodic flow' },
      planned: { word: 'PLANNED ROAD', icon: '🚧', title: 'Planned road — called for, not built yet' }
    };
    const roadOf = c => ROAD[c.status] || ROAD.operational;
    // Card wording can be overridden per city (city_metadata.ui_labels), e.g. for a project map
    const L = (key, fallback) => ((window.CITY_CONFIG || {}).ui_labels || {})[key] || fallback;
    const SPIRE_STATUS = {
      done: { icon: '🟢', word: 'Built / operational' },
      active: { icon: '🟡', word: 'In progress' },
      planned: { icon: '⚪', word: 'Planned' }
    };
    const VERDICT = {
      supported: { color: '#00e599', word: 'BOUNDED SUPPORT' },
      conditional: { color: '#ffb700', word: 'CONDITIONAL' },
      contradicted: { color: '#ff1744', word: 'CONTRADICTED' },
      exploratory: { color: '#a0a8bc', word: 'EXPLORATORY' }
    };
    // Spire archetypes (spire `kind`): shape says what a thing is
    const KIND = {
      system: { icon: '🏢', word: 'System' },
      knowledge: { icon: '⛪', word: 'Knowledge' },
      instrument: { icon: '🔭', word: 'Instrument' },
      hub: { icon: '📡', word: 'Hub' },
      failure: { icon: '💥', word: 'Failure mode' }
    };
    const HAS_KINDS = (window.SPIRES_INDEX || []).some(sp => sp.kind && sp.kind !== 'system');
    const kindOf = sp => KIND[sp.kind || 'system'] || KIND.system;
    const kindWord = sp => L(`kind_${sp.kind || 'system'}`, kindOf(sp).word);
    const HAS_STATUS = (window.SPIRES_INDEX || []).some(sp => sp.status && sp.status !== 'done');

    function bneckIcon(b) {
      if (!b.scope) return '⚠️';
      if (b.scope === 'node') return b.effect === 'closure' ? '⛔' : '⏱️';
      return EFFECT_ICON[b.effect] || '⚠️';
    }
    const challengeMarkers = [];
    const conduitMarkers = [];

    // Initialize MapLibre with Directional Sunlight & Depth
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {},
          layers: [{
            id: 'background',
            type: 'background',
            paint: {

            }
          }]
        },
        center: window.CITY_CONFIG.center,
        zoom: window.CITY_CONFIG.zoom,

      map.on('load', () => {

          });
        }

        initHeader();

    function setupSourcesAndLayers() {
      // 1. Districts Runway Base
      const districtPolygons = {
        type: 'FeatureCollection',
        features: window.DISTRICTS.map(d => ({
          type: 'Feature',
          properties: {
            id: d.id,
            name: d.name,
            color: d.color,
            scale_label: d.scale_label
          },
          geometry: {
            type: 'Polygon',
            coordinates: [d.bounds]
          }
        }))
      };

      map.addSource('districts-geo', {
        type: 'geojson',
        data: districtPolygons
      });

      map.addLayer({
        id: 'districts-fill',
        type: 'fill',
        source: 'districts-geo',
        paint: {
          'fill-color': ['get', 'color'],
          'fill-opacity': 0.06
        }
      });

      map.addLayer({
        id: 'districts-line',
        type: 'line',
        source: 'districts-geo',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 1.5,
          'line-dasharray': [4, 3],
          'line-opacity': 0.7
        }
      });

      // 1b. Field constraints: one coloured tape per constraint along the border of each district
      // it covers. Colour = which problem, stroke = effect (solid blind · dotted noise · dashed slowdown).
      addConstraintPatterns();
      map.addSource('fields-geo', { type: 'geojson', data: FIELDS });
      [['blind', null], ['noise', [0.1, 2]], ['slowdown', [4, 2]]].forEach(([effect, dash]) => {
        const paint = { 'line-color': ['get', 'color'], 'line-width': 3, 'line-opacity': 0.85 };
        if (dash) paint['line-dasharray'] = dash;
        map.addLayer({
          id: `fields-tape-${effect}`,
          type: 'line',
          source: 'fields-geo',
          filter: ['==', ['get', 'effect'], effect],
          layout: { 'line-cap': dash && dash[0] < 1 ? 'round' : 'butt' },
          paint
        });
      });
      map.addLayer({
        id: 'fields-tape-hit',
        type: 'line',
        source: 'fields-geo',
        paint: { 'line-color': '#000000', 'line-width': 16, 'line-opacity': 0.001 }
      });

      // 1c. Priorities: ground target (bullseye) with arcs of support (green) and blockage (red)
      map.addSource('targets-geo', { type: 'geojson', data: window.TARGETS_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'targets-dot',
        type: 'fill',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'dot'],

      map.addLayer({
        id: 'targets-rings',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'ring'],
        paint: { 'line-color': '#ffe9a8', 'line-width': 1.6, 'line-opacity': 0.75 }
      });
      map.addLayer({
        id: 'targets-arcs',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'arc'],
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': ['get', 'color'], 'line-width': 4, 'line-opacity': 0.9 }
      });
      map.addLayer({
        id: 'targets-arcs-hit',
        type: 'line',
        source: 'targets-geo',
        filter: ['==', ['get', 'kind'], 'arc'],
        paint: { 'line-color': '#000000', 'line-width': 14, 'line-opacity': 0.001 }
      });

      // Data plazas: grid texture on the ground, bars per cell, fenced special cells
      map.addSource('plaza-geo', { type: 'geojson', data: window.PLAZAS_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'plaza-hit', type: 'fill', source: 'plaza-geo', filter: ['==', ['get', 'kind'], 'hit'],
        paint: { 'fill-color': '#000000', 'fill-opacity': 0.001 }
      });
      map.addLayer({
        id: 'plaza-highlight', type: 'line', source: 'plaza-geo', filter: ['==', ['get', 'kind'], 'highlight'],
        paint: {
          'line-color': ['match', ['get', 'style'], 'forbidden', '#ff1744', '#ffb300'],
          'line-width': 3, 'line-dasharray': [1.5, 1]
        }
      });
      map.addLayer({
        id: 'plaza-bars', type: 'fill-extrusion', source: 'plaza-geo', filter: plazaBarFilter(),
        paint: {
          'fill-extrusion-color': ['get', 'color'], 'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'base_height'], 'fill-extrusion-opacity': 0.85
        }
      });

      // District names painted on the ground (after the webfont is available)
      const fontsReady = document.fonts && document.fonts.load
        ? Promise.all([document.fonts.load('800 96px "JetBrains Mono"'), document.fonts.load('600 68px "JetBrains Mono"')]).catch(() => null)
        : Promise.resolve();
      fontsReady.then(() => { addDistrictNames(); addPlazaTextures(); });

      // 2. Highways (conduits)
      map.addSource('conduits-geo', {
        type: 'geojson',
        data: window.CONDUITS_GEOJSON
      });

      // Wide invisible hit-area for easy clicking anywhere near the conduit
      map.addLayer({
        id: 'conduits-hitarea',
        type: 'line',
        source: 'conduits-geo',
        paint: {
          'line-color': '#000000',
          'line-width': 22,
          'line-opacity': 0.001
        }
      });

      // Outer luminous halo
      map.addLayer({
        id: 'conduits-glow',
        type: 'line',
        source: 'conduits-geo',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 8,
          'line-blur': 5,
          'line-opacity': ['match', ['get', 'status'], 'planned', 0.12, 'thin', 0.3, 0.65]
        }
      });

      // Inner core — one layer per status, since dash patterns cannot be data-driven:
      // operational = solid road, thin = ferry line (sparse dots), planned = road under construction
      map.addLayer({
        id: 'conduits-core',
        type: 'line',
        source: 'conduits-geo',
        filter: ['!', ['in', ['get', 'status'], ['literal', ['thin', 'planned']]]],
        paint: {
          'line-color': '#ffffff',
          'line-width': 2.5,
          'line-dasharray': [3, 2],
          'line-opacity': 0.95
        }
      });
      map.addLayer({
        id: 'conduits-core-thin',
        type: 'line',
        source: 'conduits-geo',
        filter: ['==', ['get', 'status'], 'thin'],
        layout: { 'line-cap': 'round' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 2.5,
          'line-dasharray': [0.1, 3.2],
          'line-opacity': 0.9
        }
      });
      map.addLayer({
        id: 'conduits-core-planned',
        type: 'line',
        source: 'conduits-geo',
        filter: ['==', ['get', 'status'], 'planned'],
        paint: {
          'line-color': '#8a93a6',
          'line-width': 3,
          'line-dasharray': [1.5, 1.5],
          'line-opacity': 0.85
        }
      });

      // One-way arrows along every road (flow direction from source to target)
      map.addLayer({
        id: 'conduits-arrows',
        type: 'symbol',
        source: 'conduits-geo',
        layout: {
          'symbol-placement': 'line',
          'symbol-spacing': 110,
          'icon-image': ['match', ['get', 'status'], 'planned', 'arrow-grey', 'arrow-light'],
          'icon-size': 0.55,
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
          'icon-rotation-alignment': 'map'
        }
      });

      // 2b. Edge constraints: congestion approaching the incident, starved or closed road after it
      map.addSource('traffic-geo', { type: 'geojson', data: TRAFFIC });
      map.addLayer({
        id: 'traffic-starved',
        type: 'line',
        source: 'traffic-geo',
        filter: ['in', ['get', 'kind'], ['literal', ['starved', 'closed']]],
        paint: { 'line-color': '#060a14', 'line-width': 10, 'line-opacity': 0.6 }
      });
      map.addLayer({
        id: 'traffic-closed',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'closed'],
        paint: { 'line-color': '#ff1744', 'line-width': 2.5, 'line-dasharray': [0.8, 1.6], 'line-opacity': 0.9 }
      });
      map.addLayer({
        id: 'traffic-queue',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'queue'],
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'width'], 'line-blur': 1, 'line-opacity': 0.95 }
      });
      map.addLayer({
        id: 'traffic-queue-crawl',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'queue'],
        paint: { 'line-color': '#1a0006', 'line-width': 2, 'line-dasharray': [0, 4, 3], 'line-opacity': 0.8 }
      });

      // Risk cascades: dashed red arrows from a constraint to the one it makes more likely
      map.addSource('causal-geo', { type: 'geojson', data: window.CAUSAL_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'causal-links',
        type: 'line',
        source: 'causal-geo',
        paint: { 'line-color': '#ff1744', 'line-width': 2.5, 'line-dasharray': [1.2, 1.2], 'line-opacity': 0.85 }
      });
      map.addLayer({
        id: 'causal-arrows',
        type: 'symbol',
        source: 'causal-geo',
        layout: {
          'symbol-placement': 'line', 'symbol-spacing': 60, 'icon-image': 'arrow-red', 'icon-size': 0.6,
          'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-rotation-alignment': 'map'
        }
      });

      // "You are here": the project's current position in time across the corridor
      if (window.NOW_MARKER) {
        map.addSource('now-geo', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: window.NOW_MARKER.line } } });
        map.addLayer({ id: 'now-glow', type: 'line', source: 'now-geo', paint: { 'line-color': '#7cffb2', 'line-width': 12, 'line-blur': 8, 'line-opacity': 0.45 } });
        map.addLayer({ id: 'now-line', type: 'line', source: 'now-geo', paint: { 'line-color': '#eafff3', 'line-width': 2.5, 'line-dasharray': [3, 1.5] } });
      }

      // Relation links (on selection) and route overlay
      map.addSource('links-geo', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'relation-links',
        type: 'line',
        source: 'links-geo',
        paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-dasharray': [2, 2], 'line-opacity': 0.9 }
      });
      map.addSource('route-geo', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'route-casing',
        type: 'line',
        source: 'route-geo',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#7cffb2', 'line-width': 14, 'line-blur': 6, 'line-opacity': 0.35 }
      });
      map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route-geo',
        filter: ['!=', ['get', 'kind'], 'walk'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': ['match', ['get', 'kind'], 'against', '#ffd08a', '#7cffb2'], 'line-width': 5 }
      });
      map.addLayer({
        id: 'route-walk',
        type: 'line',
        source: 'route-geo',
        filter: ['==', ['get', 'kind'], 'walk'],
        paint: { 'line-color': '#7cffb2', 'line-width': 3, 'line-dasharray': [0.5, 1.5] }
      });

      // 3. 3D Buildings & Crystals (Spires + Hazard Radars + Priority Monoliths)
      map.addSource('buildings-geo', {
        type: 'geojson',
        data: window.BUILDINGS_GEOJSON
      });

      const buildingPaint = (opacity) => ({
        'fill-extrusion-color': ['case', ['has', 'color'], ['get', 'color'], '#00f0ff'],
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'base_height'],
        'fill-extrusion-opacity': opacity,
        'fill-extrusion-vertical-gradient': true
      });
      // Planned spires (and the unfinished crown of active ones) are drawn as translucent ghosts;
      // opacity is per layer in MapLibre, hence a second layer.
      map.addLayer({
        id: 'buildings-ghost',
        type: 'fill-extrusion',
