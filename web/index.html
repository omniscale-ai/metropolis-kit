          'line-color': '#8a93a6',
          'line-width': 3,
          'line-dasharray': [1.5, 1.5],
          'line-opacity': 0.85
        }
      });

      // One-way arrows along every road (flow direction from source to target)
      map.addLayer({
        id: 'conduits-arrows',
        type: 'symbol',
        source: 'conduits-geo',
        layout: {
          'symbol-placement': 'line',
          'symbol-spacing': 110,
          'icon-image': ['match', ['get', 'status'], 'planned', 'arrow-grey', 'arrow-light'],
          'icon-size': 0.55,
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
          'icon-rotation-alignment': 'map'
        }
      });

      // 2b. Edge constraints: congestion approaching the incident, starved or closed road after it
      map.addSource('traffic-geo', { type: 'geojson', data: TRAFFIC });
      map.addLayer({
        id: 'traffic-starved',
        type: 'line',
        source: 'traffic-geo',
        filter: ['in', ['get', 'kind'], ['literal', ['starved', 'closed']]],
        paint: { 'line-color': '#060a14', 'line-width': 10, 'line-opacity': 0.6 }
      });
      map.addLayer({
        id: 'traffic-closed',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'closed'],
        paint: { 'line-color': '#ff1744', 'line-width': 2.5, 'line-dasharray': [0.8, 1.6], 'line-opacity': 0.9 }
      });
      map.addLayer({
        id: 'traffic-queue',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'queue'],
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'width'], 'line-blur': 1, 'line-opacity': 0.95 }
      });
      map.addLayer({
        id: 'traffic-queue-crawl',
        type: 'line',
        source: 'traffic-geo',
        filter: ['==', ['get', 'kind'], 'queue'],
        paint: { 'line-color': '#1a0006', 'line-width': 2, 'line-dasharray': [0, 4, 3], 'line-opacity': 0.8 }
      });

      // Risk cascades: dashed red arrows from a constraint to the one it makes more likely
      map.addSource('causal-geo', { type: 'geojson', data: window.CAUSAL_GEOJSON || { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'causal-links',
        type: 'line',
        source: 'causal-geo',
        paint: { 'line-color': '#ff1744', 'line-width': 2.5, 'line-dasharray': [1.2, 1.2], 'line-opacity': 0.85 }
      });
      map.addLayer({
        id: 'causal-arrows',
        type: 'symbol',
        source: 'causal-geo',
        layout: {
          'symbol-placement': 'line', 'symbol-spacing': 60, 'icon-image': 'arrow-red', 'icon-size': 0.6,
          'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-rotation-alignment': 'map'
        }
      });

      // "You are here": the project's current position in time across the corridor
      if (window.NOW_MARKER) {
        map.addSource('now-geo', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: window.NOW_MARKER.line } } });
        map.addLayer({ id: 'now-glow', type: 'line', source: 'now-geo', paint: { 'line-color': '#7cffb2', 'line-width': 12, 'line-blur': 8, 'line-opacity': 0.45 } });
        map.addLayer({ id: 'now-line', type: 'line', source: 'now-geo', paint: { 'line-color': '#eafff3', 'line-width': 2.5, 'line-dasharray': [3, 1.5] } });
      }

      // Relation links (on selection) and route overlay
      map.addSource('links-geo', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'relation-links',
        type: 'line',
        source: 'links-geo',
        paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-dasharray': [2, 2], 'line-opacity': 0.9 }
      });
      map.addSource('route-geo', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'route-casing',
        type: 'line',
        source: 'route-geo',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#7cffb2', 'line-width': 14, 'line-blur': 6, 'line-opacity': 0.35 }
      });
      map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route-geo',
        filter: ['!=', ['get', 'kind'], 'walk'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': ['match', ['get', 'kind'], 'against', '#ffd08a', '#7cffb2'], 'line-width': 5 }
      });
      map.addLayer({
        id: 'route-walk',
        type: 'line',
        source: 'route-geo',
        filter: ['==', ['get', 'kind'], 'walk'],
        paint: { 'line-color': '#7cffb2', 'line-width': 3, 'line-dasharray': [0.5, 1.5] }
      });

      // 3. 3D Buildings & Crystals (Spires + Hazard Radars + Priority Monoliths)
      map.addSource('buildings-geo', {
        type: 'geojson',
        data: window.BUILDINGS_GEOJSON
      });

      const buildingPaint = (opacity) => ({
        'fill-extrusion-color': ['case', ['has', 'color'], ['get', 'color'], '#00f0ff'],
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'base_height'],
        'fill-extrusion-opacity': opacity,
        'fill-extrusion-vertical-gradient': true
      });
      // Planned spires (and the unfinished crown of active ones) are drawn as translucent ghosts;
      // opacity is per layer in MapLibre, hence a second layer.
      map.addLayer({
        id: 'buildings-ghost',
        type: 'fill-extrusion',
        source: 'buildings-geo',
        filter: ['==', ['get', 'ghost'], true],
        paint: buildingPaint(0.22)
      });
      map.addLayer({
        id: 'buildings-3d',
        type: 'fill-extrusion',
        source: 'buildings-geo',
        filter: ['!=', ['get', 'ghost'], true],
        paint: {
          'fill-extrusion-color': [
            'case',
            ['has', 'color'], ['get', 'color'],
            '#00f0ff'
          ],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'base_height'],
          'fill-extrusion-opacity': 0.92,
          'fill-extrusion-vertical-gradient': true
        }
      });

      // 4. Wireframe Outlines on Building Facets for Crystalline Aesthetics
      if (window.WIREFRAME_GEOJSON) {
        map.addSource('wireframe-geo', {
          type: 'geojson',
          data: window.WIREFRAME_GEOJSON
        });

        map.addLayer({
          id: 'buildings-wireframe',
          type: 'line',
          source: 'wireframe-geo',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 1.5,
            'line-opacity': 0.75
          }
        });
      }
    }

    // Ground Runways, Beacons, and Punchy Codename Markers
    function renderGroundStencilsAndMarkers() {
      // 2. Bottleneck Hazard Radars (WITH PUNCHY 1-2 WORD CODENAMES!)
      window.BOTTLENECKS.forEach((b, idx) => {
        if (b.scope) return; // schema v2 constraints are rendered by renderConstraintMarkers()
        const hazardEl = document.createElement('div');
        hazardEl.className = 'hazard-radar-marker';
        hazardEl.dataset.tourRef = b.id;
        hazardEl.innerHTML = `
          <div class="hazard-pulse-ring"></div>
          <div class="hazard-radar-text">⚠️ ${b.codename}</div>
        `;
        hazardEl.addEventListener('click', (e) => {
          e.stopPropagation();
          selectObject('bottleneck', b.id, idx);
        });

        const marker = new maplibregl.Marker({
          element: hazardEl,
          pitchAlignment: 'viewport'
        }).setLngLat(b.coordinates).addTo(map);

        bottleneckMarkers.push(marker);
      });

      // 3. Strategic Priorities & Challenges (WITH PUNCHY 1-2 WORD CODENAMES!)
      window.CHALLENGES.forEach((c, idx) => {
        const chalEl = document.createElement('div');
        chalEl.className = 'challenge-beacon-marker';
        chalEl.dataset.tourRef = c.id;
        chalEl.innerHTML = `
          <div class="challenge-gem" ${c.verdict ? `style="background: ${VERDICT[c.verdict].color}; box-shadow: 0 0 10px ${VERDICT[c.verdict].color};"` : ''}></div>
          <div class="challenge-text">🎯 ${c.codename}${c.verdict ? ` <span class="verdict-tag" style="color: ${VERDICT[c.verdict].color};">${VERDICT[c.verdict].word}</span>` : ''}</div>
        `;
        chalEl.addEventListener('click', (e) => {
          e.stopPropagation();
          selectObject('challenge', c.id, idx);
        });

        const marker = new maplibregl.Marker({
          element: chalEl,
          anchor: 'left',
          offset: [22, 0],
          pitchAlignment: 'viewport'
        }).setLngLat(c.coordinates).addTo(map);

        challengeMarkers.push(marker);
      });

      // 4. Clickable road badges (highway / ferry / planned road)
      window.CONDUITS.forEach((cond, idx) => {
        if (!cond.midpoint) return;
        const conduitEl = document.createElement('div');
        conduitEl.className = `conduit-beacon-marker status-${cond.status || 'operational'}`;
        conduitEl.dataset.tourRef = cond.id;
        conduitEl.title = `${roadOf(cond).title}: ${cond.name}`;
        conduitEl.innerHTML = `
          <span style="font-size: 11px;">${roadOf(cond).icon}</span>
          <span class="conduit-beacon-text">${cond.codename}</span>
          ${(cond.constrained_by || []).length ? '<span class="constrained-dot" title="Constrained"></span>' : ''}
        `;
        conduitEl.addEventListener('click', (e) => {
          e.stopPropagation();
          selectObject('conduit', cond.id, idx);
        });

        const marker = new maplibregl.Marker({
          element: conduitEl,
          pitchAlignment: 'viewport'
        }).setLngLat(cond.midpoint).addTo(map);

        conduitMarkers.push(marker);
      });
    }

    // Interaction Setup
    function setupInteraction() {
      // Click on ANY 3D Building (Spire, Bottleneck Tower, Priority Monolith)
      const onBuildingClick = (e) => {
        if (!e.features || !e.features.length) return;
        const feat = e.features[0];
        const props = feat.properties;

        if (props.spire_ref) {
          const sIdx = window.SPIRES_INDEX.findIndex(s => s.id === props.spire_ref);
          if (sIdx !== -1) selectObject('spire', props.spire_ref, sIdx);
        } else if (props.bottleneck_ref) {
          const bIdx = BNECKS.findIndex(b => b.id === props.bottleneck_ref);
          if (bIdx !== -1) selectObject('bottleneck', props.bottleneck_ref, bIdx);
        } else if (props.challenge_ref) {
          const cIdx = window.CHALLENGES.findIndex(c => c.id === props.challenge_ref);
          if (cIdx !== -1) selectObject('challenge', props.challenge_ref, cIdx);
        }
      };
      ['buildings-3d', 'buildings-ghost'].forEach(layer => {
        map.on('click', layer, onBuildingClick);
        map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
      });

      // Click on Conduit Line or Conduit Hit-Area
      const onConduitClick = (e) => {
        if (!e.features || !e.features.length) return;
        const feat = e.features[0];
        const condId = feat.properties.id;
        const cIdx = window.CONDUITS.findIndex(c => c.id === condId);
        if (cIdx !== -1) {
          selectObject('conduit', condId, cIdx);
        }
      };

      map.on('click', 'conduits-core', onConduitClick);
      map.on('click', 'targets-arcs-hit', (e) => {
        const ref = e.features && e.features[0] && e.features[0].properties.ref;
        if (ref) gotoRef(ref);
      });
      map.on('mouseenter', 'targets-arcs-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'targets-arcs-hit', () => { map.getCanvas().style.cursor = ''; });
      map.on('click', 'fields-tape-hit', (e) => {
        const ref = e.features && e.features[0] && e.features[0].properties.bottleneck_ref;
        if (ref) gotoRef(ref);
      });
      map.on('mouseenter', 'fields-tape-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'fields-tape-hit', () => { map.getCanvas().style.cursor = ''; });
      map.on('click', 'traffic-queue', (e) => {
        const ref = e.features && e.features[0] && e.features[0].properties.bottleneck_ref;
        if (ref) gotoRef(ref);
      });

      map.on('click', 'plaza-hit', (e) => {
        if (map.queryRenderedFeatures(e.point, { layers: ['buildings-3d', 'buildings-ghost', 'conduits-hitarea'].filter(l => map.getLayer(l)) }).length) return;
        const id = e.features && e.features[0] && e.features[0].properties.plaza;
        if (id) selectObject('plaza', id, PLAZAS.findIndex(p => p.id === id));
      });
      const interactiveLayers = ['plaza-hit', 'buildings-3d', 'buildings-ghost', 'conduits-hitarea', 'fields-tape-hit', 'targets-arcs-hit', 'traffic-queue'];
      const nothingElseAt = (point) => !map.queryRenderedFeatures(point, { layers: interactiveLayers.filter(l => map.getLayer(l)) }).length;
      map.on('click', (e) => {
        const name = districtNameAt(e.lngLat);
        if (name && nothingElseAt(e.point)) flyToDistrict(name.id);
      });
      map.on('mousemove', (e) => {
        const over = !!districtNameAt(e.lngLat) && nothingElseAt(e.point);
        if (over) { map.getCanvas().style.cursor = 'pointer'; districtNameHover = true; }
        else if (districtNameHover) { map.getCanvas().style.cursor = ''; districtNameHover = false; }
      });

      // Relation chips anywhere (drawer, route panel) jump to the referenced entity
      document.addEventListener('click', (e) => {
        const chip = e.target.closest('[data-ref]');
        if (chip) { e.stopPropagation(); gotoRef(chip.dataset.ref); }
      });
      map.on('click', 'conduits-hitarea', onConduitClick);
      map.on('mouseenter', 'conduits-hitarea', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'conduits-hitarea', () => { map.getCanvas().style.cursor = ''; });

      // Layer Toggles
      document.querySelectorAll('.layer-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const layerKey = btn.dataset.layer;
          layerVisibility[layerKey] = !layerVisibility[layerKey];
          btn.classList.toggle('active', layerVisibility[layerKey]);
          applyLayerVisibility(layerKey);
        });
      });

      // Auto-Orbit Button
      const orbitBtn = document.getElementById('orbitBtn');
      orbitBtn.addEventListener('click', toggleOrbit);

      // Reset Camera Overview
      document.getElementById('resetCamBtn').addEventListener('click', () => {
        stopOrbit();
        map.flyTo({
          center: window.CITY_CONFIG.center,
          zoom: window.CITY_CONFIG.zoom,
          pitch: window.CITY_CONFIG.pitch,
          bearing: window.CITY_CONFIG.bearing,
          duration: 1600
        });
      });

      // Legend Collapse / Restore
      const legendCard = document.getElementById('spireLegendCard');
      const collapseBtn = document.getElementById('collapseLegendBtn');
      const restoreBtn = document.getElementById('restoreLegendBtn');

      collapseBtn.addEventListener('click', () => {
        legendCard.classList.add('collapsed');
        restoreBtn.classList.add('visible');
      });

      restoreBtn.addEventListener('click', () => {
        legendCard.classList.remove('collapsed');
        restoreBtn.classList.remove('visible');
      });

      // Drawer Pager Buttons
      document.getElementById('pagerPrevBtn').addEventListener('click', navigatePrev);
      document.getElementById('pagerNextBtn').addEventListener('click', navigateNext);
      document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
        if (e.key === 'ArrowLeft') navigatePrev();
        if (e.key === 'ArrowRight') navigateNext();
        if (e.key === 'l' || e.key === 'L') {
          if (legendCard.classList.contains('collapsed')) {
            legendCard.classList.remove('collapsed');
            restoreBtn.classList.remove('visible');
          } else {
            legendCard.classList.add('collapsed');
            restoreBtn.classList.add('visible');
          }
        }
      });
    }

    function setLayers(ids, visible) {
      ids.forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'); });
    }

    function setMarkers(list, visible) {
      list.forEach(m => m.getElement().style.display = visible ? 'flex' : 'none');
    }

    // One combined filter, so toggling one entity type never re-shows another
    function refreshBuildingFilter() {
      const hidden = [];
      if (!layerVisibility.spires) hidden.push('spire');
      if (!layerVisibility.bottlenecks) hidden.push('bottleneck');
      if (!layerVisibility.challenges) hidden.push('challenge');
      if (!layerVisibility.queues) hidden.push('queue');
      const visibleType = hidden.length ? ['!', ['in', ['get', 'entity_type'], ['literal', hidden]]] : true;
      map.setFilter('buildings-3d', ['all', ['!=', ['get', 'ghost'], true], visibleType]);
      map.setFilter('buildings-ghost', ['all', ['==', ['get', 'ghost'], true], visibleType]);
    }

    function applyLayerVisibility(layerKey) {
      const isVisible = layerVisibility[layerKey];
      if (layerKey === 'districts') {
        setLayers(['districts-fill', 'districts-line', 'now-glow', 'now-line', 'plaza-hit', 'plaza-highlight', 'plaza-bars',
          ...districtNames.map(n => n.layer), ...PLAZAS.map(p => `plaza-tex-${p.id}`)], isVisible);
        setMarkers(districtMarkers, isVisible);
      } else if (layerKey === 'spires') {
        setLayers(['buildings-wireframe'], isVisible);
      } else if (layerKey === 'conduits') {
        setLayers(['conduits-glow', 'conduits-core', 'conduits-core-thin', 'conduits-core-planned', 'conduits-arrows'], isVisible);
        setMarkers(conduitMarkers, isVisible);
      } else if (layerKey === 'bottlenecks') {
        setMarkers(bottleneckMarkers, isVisible);
      } else if (layerKey === 'challenges') {
        setMarkers(challengeMarkers, isVisible);
        setLayers(['targets-dot', 'targets-rings', 'targets-arcs', 'targets-arcs-hit'], isVisible);
      } else if (layerKey === 'traffic') {
        setLayers(['traffic-starved', 'traffic-closed', 'traffic-queue', 'traffic-queue-crawl', 'causal-links', 'causal-arrows'], isVisible);
        setMarkers(incidentMarkers, isVisible);
      } else if (layerKey === 'queues') {
        setMarkers(nodeMarkers, isVisible);
      } else if (layerKey === 'weather') {
        setLayers(['fields-tape-blind', 'fields-tape-noise', 'fields-tape-slowdown', 'fields-tape-hit'], isVisible);
        setMarkers(fieldMarkers, isVisible);
      }
      refreshBuildingFilter();
    }

    // Selection & Drawer Rendering
    function selectObject(type, id, index, keepCamera) {
      activeSelection = { type, id, index };
      const selected = type === 'bottleneck' ? BNECKS[index] : null;
      highlightField(selected && selected.scope === 'field' ? id : null);
      const drawer = document.getElementById('detailDrawer');
      const badge = document.getElementById('drawerTypeBadge');
      const title = document.getElementById('drawerTitle');
      const subtitle = document.getElementById('drawerSubtitle');
      const body = document.getElementById('drawerBody');

      // Update Legend Selection
      document.querySelectorAll('.spire-item, .conduit-legend-item').forEach(el => el.classList.remove('active'));
      const activeLegendItem = document.querySelector(`[data-id="${id}"]`);
      if (activeLegendItem) activeLegendItem.classList.add('active');

      if (type === 'spire') {
        const item = window.SPIRES_INDEX[index];
        badge.className = 'drawer-type-badge badge-spire';
        const kindPrefix = HAS_KINDS ? `${kindOf(item).icon} ${kindWord(item).toUpperCase()} • ` : '';
        badge.textContent = HAS_STATUS
          ? `${kindPrefix}${SPIRE_STATUS[item.status || 'done'].icon} ${L('spire_badge', 'SPIRE')} • ${item.code} (${item.codename})`

        title.textContent = item.title;
        subtitle.textContent = `${item.district_name} (${item.scale_label})`;

        body.innerHTML = `
          <div class="metrics-grid">
            <div class="metric-card">
              <span class="metric-label">${L('metric_scale', 'Physical Scale')}</span>
              <span class="metric-value" style="color: ${item.color};">${item.metrics.scale || 'N/A'}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">${L('metric_acceleration', 'Acceleration Factor')}</span>
              <span class="metric-value" style="color: var(--accent-emerald);">${item.metrics.acceleration || 'N/A'}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">${L('metric_infrastructure', 'European Infrastructure')}</span>
              <span class="metric-value">${item.metrics.infrastructure || 'N/A'}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">${L('metric_maturity', 'Maturity Level')}</span>
              <span class="metric-value" style="color: var(--accent-amber);">${item.metrics.maturity || 'N/A'}</span>
            </div>
          </div>
          <div>
            <div class="drawer-section-title"><span>✦</span> ${L('abstract_title', 'Scientific Abstract & Methodology')}</div>
            <p class="drawer-body-text">${item.abstract}</p>
          </div>
          ${relationBlock('⏱️ Constraints at this spire', item.constraints)}
          ${relationBlock('🎯 Advances priorities', item.advances)}
          <div class="relation-block conduit-endpoints-row">
            <button class="conduit-endpoint-btn" id="routeFromHereBtn"><span>🧭 ROUTE FROM HERE</span><span>➔</span></button>
            <button class="conduit-endpoint-btn" id="routeToHereBtn"><span>🧭 ROUTE TO HERE</span><span>➔</span></button>
          </div>
        `;
        document.getElementById('routeFromHereBtn').addEventListener('click', () => openRoute(item.id, null));
        document.getElementById('routeToHereBtn').addEventListener('click', () => openRoute(null, item.id));

        showLinks(item.coordinates, [
          ...(item.advances || []).map(ref => ({ ref, color: '#ffe9a8' }))
        ]);
        updatePager(window.SPIRES_INDEX.length, index);
        flyToObject(item.coordinates);
      } else if (type === 'bottleneck') {
        const item = BNECKS[index];
        badge.className = 'drawer-type-badge badge-bottleneck';
        badge.textContent = item.scope
          ? `CONSTRAINT • ${item.scope.toUpperCase()} • ${item.code}`
          : `RATE-LIMITER • ${item.code} [${item.codename}]`;
        title.textContent = `${item.codename}: ${item.title}`;
        subtitle.textContent = item.nature;
        const blocksPriorities = window.CHALLENGES.filter(c => (c.blocked_by || []).includes(item.id)).map(c => c.id);

        body.innerHTML = `
          ${item.scope ? `
          <div class="scope-banner">
            <span class="scope-tag">${bneckIcon(item)} ${EFFECT_WORD[item.effect] || ''} ${SCOPE_WORD[item.scope]}</span>
            ${(item.anchors || []).some(a => a.barrier) ? '<span class="scope-tag">⛔ BLOCKS A PLANNED ROAD</span>' : ''}
            ${item.color ? `<span class="scope-tag" style="background: rgba(255,255,255,0.05); color: #fff; border-color: ${item.color};"><span class="tape-swatch tape-${item.effect}" style="--tape: ${item.color};"></span> BORDER TAPE</span>` : ''}
            <span class="scope-tag" style="background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.2);">SEVERITY ${Math.round(item.severity * 100)}%</span>
            ${item.delay_label ? `<span class="delay-chip">${item.delay_label}</span>` : ''}
          </div>` : ''}
          <div class="hazard-box">
            <strong>${L('impact_title', 'Critical Impact')}:</strong> ${item.impact}
          </div>
          ${relationBlock('📍 Acts on', item.constrains)}
          <div>
            <div class="drawer-section-title" style="color: var(--accent-emerald);"><span>🛡️</span> ${L('remedy_title', 'Strategic European Remedy')}</div>
            <div class="remedy-box">${item.remedy}</div>
          </div>
          ${relationBlock('🩹 Remedied by', item.remedied_by)}
          ${relationBlock('↪️ Leads to', item.causes)}
          ${relationBlock('↩️ Caused by', item.caused_by)}
          ${relationBlock('🎯 Holds back priorities', blocksPriorities)}

        showLinks(item.coordinates, [
          ...(item.anchors || []).slice(1).map(a => ({ coords: a.coordinates, color: '#ff1744' })),
          ...(item.remedied_by || []).map(ref => ({ ref, color: '#00e599' })),
          ...blocksPriorities.map(ref => ({ ref, color: '#ffe9a8' }))
        ]);

        updatePager(BNECKS.length, index);
        flyToObject(item.coordinates);
      } else if (type === 'challenge') {
        const item = window.CHALLENGES[index];
        badge.className = 'drawer-type-badge badge-challenge';
        badge.textContent = `${L('priority_badge', 'MANDATE')} • ${item.code} [${item.codename}]`;
        title.textContent = `${item.codename}: ${item.title}`;
        subtitle.textContent = item.type;

        body.innerHTML = `
          ${item.verdict ? `<div class="scope-banner"><span class="scope-tag" style="background: ${VERDICT[item.verdict].color}22; color: ${VERDICT[item.verdict].color}; border-color: ${VERDICT[item.verdict].color};">VERDICT: ${VERDICT[item.verdict].word}</span></div>` : ''}
          <div class="metric-card" style="border-left: 3px solid var(--accent-amber);">
            <span class="metric-label">${L('target_title', 'Strategic Policy Target')}</span>
            <span class="metric-value" style="font-size: 13.5px; line-height: 1.5; color: #fff;">${item.target}</span>
          </div>
          ${relationBlock(item.verdict ? '🏛️ Supporting evidence' : '🏛️ Advanced by', item.advanced_by)}
          ${relationBlock(item.verdict ? '⚠️ Counterevidence' : '⚠️ Blocked by', item.blocked_by)}
        `;

        showLinks(item.coordinates, [
          ...(item.advanced_by || []).map(ref => ({ ref, color: '#ffe9a8' })),
          ...(item.blocked_by || []).map(ref => ({ ref, color: '#ff1744' }))
        ]);

        updatePager(window.CHALLENGES.length, index);
        flyToObject(item.coordinates);
      } else if (type === 'plaza') {
        const item = PLAZAS[index];
        const layer = item.layers.find(l => l.id === plazaActive[item.id]) || item.layers[0] || { cells: [] };
        badge.className = 'drawer-type-badge badge-conduit';
        badge.textContent = `DATA PLAZA • ${item.rows.length}×${item.cols.length}`;
        title.textContent = item.title;
        subtitle.textContent = layer.label || item.subtitle || '';
        const cell = v => (v === null || v === undefined) ? '<td class="np">n/p</td>' : `<td>${v}</td>`;
        body.innerHTML = `
          ${item.layers.length > 1 ? `<div class="relation-list">${item.layers.map(l =>
            `<span class="ref-chip ${l.id === plazaActive[item.id] ? 'kind-spire' : ''}" data-plaza-layer="${l.id}">${l.label || l.id}</span>`).join('')}</div>` : ''}
          <table class="plaza-table">
            <tr><th>${item.row_axis || ''} \\ ${item.col_axis || ''}</th>${item.cols.map(c => `<th>${c}</th>`).join('')}</tr>
            ${item.rows.map((r, j) => `<tr><th>${r}</th>${(layer.cells[j] || []).map(cell).join('')}</tr>`).join('')}
          </table>
          ${(item.highlight || []).map(h => `<div class="${h.kind === 'forbidden' ? 'hazard-box' : 'remedy-box'}" style="margin-top: 10px;"><strong>${item.rows[h.row]} × ${item.cols[h.col]}:</strong> ${h.note || h.label || ''}</div>`).join('')}
          ${item.description ? `<p class="drawer-body-text" style="margin-top: 12px;">${item.description}</p>` : ''}
        `;
        body.querySelectorAll('[data-plaza-layer]').forEach(chip => chip.addEventListener('click', (e) => {
          e.stopPropagation();
          setPlazaLayer(item.id, chip.dataset.plazaLayer);
        }));
        showLinks(null, []);
        updatePager(PLAZAS.length, index);
        if (!keepCamera) flyToObject(item.coordinates);
      } else if (type === 'conduit') {
        const item = window.CONDUITS[index];
        badge.className = 'drawer-type-badge badge-conduit';
        badge.textContent = `${roadOf(item).word} • ${item.code} [${item.codename}]`;
        title.textContent = `${item.codename}: ${item.name}`;
        subtitle.textContent = `${item.from_name} ➔ ${item.to_name}`;

        body.innerHTML = `
          <div class="metrics-grid">
            <div class="metric-card">
              <span class="metric-label">Pipeline Type</span>
              <span class="metric-value" style="color: var(--accent-violet);">${item.type}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Bandwidth / Stream</span>
              <span class="metric-value">${item.bandwidth}</span>
            </div>
            ${item.status ? `
            <div class="metric-card">
              <span class="metric-label">Road Status</span>
              <span class="metric-value" style="color: ${item.status === 'planned' ? '#8a93a6' : item.status === 'thin' ? '#ffd08a' : 'var(--accent-emerald)'};">${roadOf(item).icon} ${roadOf(item).title}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Direction</span>
              <span class="metric-value">${item.direction === 'south' ? '↓ Southbound (feedback)' : item.direction === 'north' ? '↑ Northbound' : '↔ Within district'}</span>
            </div>` : ''}
          </div>
          ${relationBlock(item.status === 'planned' ? '⛔ Not built because of' : '⚠️ Constrained by', item.constrained_by)}
          ${relationBlock('🩹 Remedy for', item.remedies)}
          <div>
            <div class="drawer-section-title"><span>✦</span> Inter-Scale Scientific Flow</div>
            <p class="drawer-body-text">${item.description}</p>
          </div>
          <div class="conduit-endpoints-row">
            <div class="drawer-section-title"><span>🏛️</span> Connected Spires</div>
            <button class="conduit-endpoint-btn" id="conduitFromBtn">
              <span>SOURCE: ${item.from_name}</span>
              <span>Fly ➔</span>
            </button>
            <button class="conduit-endpoint-btn" id="conduitToBtn">
              <span>TARGET: ${item.to_name}</span>
              <span>Fly ➔</span>
            </button>
          </div>
        `;

        // Wire jump buttons
        setTimeout(() => {
          const fromBtn = document.getElementById('conduitFromBtn');
          const toBtn = document.getElementById('conduitToBtn');
          if (fromBtn) {
            fromBtn.addEventListener('click', () => {
              const sIdx = window.SPIRES_INDEX.findIndex(s => s.id === item.from);
              if (sIdx !== -1) selectObject('spire', item.from, sIdx);
            });
          }
          if (toBtn) {
            toBtn.addEventListener('click', () => {
              const sIdx = window.SPIRES_INDEX.findIndex(s => s.id === item.to);
              if (sIdx !== -1) selectObject('spire', item.to, sIdx);
            });
          }
        }, 50);

        showLinks(item.midpoint, (item.remedies || []).map(ref => ({ ref, color: '#00e599' })));
        updatePager(window.CONDUITS.length, index);
        if (item.midpoint) {
          flyToConduit(item.midpoint);
        }
      }

      drawer.classList.add('open');
    }

    function flyToObject(coords) {
      stopOrbit();
      map.flyTo({
        center: [coords[0], coords[1] - 0.0016],
        zoom: 16.15,
        pitch: 62,
        bearing: -22,
        duration: 1400
      });
    }

    function flyToConduit(midpoint) {
      stopOrbit();
      map.flyTo({
        center: [midpoint[0], midpoint[1] - 0.0022],
        zoom: 15.6,
        pitch: 58,
        bearing: -18,
        duration: 1500
      });
    }

    function flyToDistrict(districtId) {
      const d = window.DISTRICTS.find(x => x.id === districtId);
      if (!d) return;
      stopOrbit();
      map.flyTo({
        center: [d.center[0], d.center[1] - 0.0028],
        zoom: 15.2,
        pitch: 56,
        bearing: -16,
        duration: 1600
      });
    }

    function updatePager(total, current) {
      const prevBtn = document.getElementById('pagerPrevBtn');
      const nextBtn = document.getElementById('pagerNextBtn');
      const chips = document.getElementById('pagerChipsContainer');

      prevBtn.disabled = current <= 0;
      nextBtn.disabled = current >= total - 1;

      chips.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const chip = document.createElement('div');
        chip.className = `pager-chip ${i === current ? 'active' : ''}`;
        chip.textContent = (i + 1);
        chip.addEventListener('click', () => {
          if (activeSelection) {
            const list = getActiveList(activeSelection.type);
            selectObject(activeSelection.type, list[i].id, i);
          }
        });
        chips.appendChild(chip);
      }

      const activeChip = chips.children[current];
      if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    }

    function navigatePrev() {
      if (!activeSelection || activeSelection.index <= 0) return;
      const newIdx = activeSelection.index - 1;
      const list = getActiveList(activeSelection.type);
      selectObject(activeSelection.type, list[newIdx].id, newIdx);
    }

    function navigateNext() {
      if (!activeSelection) return;
      const list = getActiveList(activeSelection.type);
      if (activeSelection.index >= list.length - 1) return;
      const newIdx = activeSelection.index + 1;
      selectObject(activeSelection.type, list[newIdx].id, newIdx);
    }

    function getActiveList(type) {
      if (type === 'spire') return window.SPIRES_INDEX;
      if (type === 'bottleneck') return BNECKS;
      if (type === 'challenge') return window.CHALLENGES;
      if (type === 'conduit') return window.CONDUITS;
      if (type === 'plaza') return PLAZAS;
      return [];
    }

    function closeDrawer() {
      document.getElementById('detailDrawer').classList.remove('open');
      document.querySelectorAll('.spire-item, .conduit-legend-item').forEach(el => el.classList.remove('active'));
      activeSelection = null;
      showLinks(null, []);
      highlightField(null);
    }

    // Legend Builder (districts & spires, highways, constraints, priorities)
    function buildLegendUI() {
      const container = document.getElementById('legendDistrictList');
      container.innerHTML = '';
      if (HAS_KINDS) {
        const present = Object.keys(KIND).filter(k => window.SPIRES_INDEX.some(sp => (sp.kind || 'system') === k));
        const key = document.createElement('div');
        key.className = 'kind-key';
        key.innerHTML = present.map(k => `<span title="${L(`kind_${k}_hint`, '')}">${KIND[k].icon} ${L(`kind_${k}`, KIND[k].word)}</span>`).join('');
        container.appendChild(key);
      }

      // 1. Scale Districts & Spires
      window.DISTRICTS.forEach(d => {
        const group = document.createElement('div');
        group.className = 'district-group';

        const header = document.createElement('div');
        header.className = 'district-group-header';
        header.innerHTML = `
          <div class="district-label-box">
            <div class="district-color-bar" style="background: ${d.color}; box-shadow: 0 0 8px ${d.color};"></div>
            <div>
              <div class="district-group-name">${d.name}</div>
              <div class="district-group-scale">${d.scale_label}</div>
            </div>
          </div>
          <span style="font-size: 10px; color: var(--text-dim);">▶</span>
        `;
        header.addEventListener('click', () => flyToDistrict(d.id));

        group.appendChild(header);

        const districtSpires = window.SPIRES_INDEX.filter(s => s.district_ref === d.id);
        districtSpires.forEach(s => {
          const item = document.createElement('div');
          item.className = 'spire-item';
          item.dataset.id = s.id;
          item.innerHTML = `
            <span class="spire-item-name">${HAS_KINDS ? kindOf(s).icon + ' ' : ''}${HAS_STATUS && s.status && s.status !== 'done' ? SPIRE_STATUS[s.status].icon + ' ' : ''}${s.title}</span>
            <span class="spire-item-code">${s.codename || s.code}</span>
          `;
          item.addEventListener('click', () => {
            const sIdx = window.SPIRES_INDEX.findIndex(x => x.id === s.id);
            selectObject('spire', s.id, sIdx);
          });
          group.appendChild(item);
        });

        container.appendChild(group);
      });

      // 2. Highways Directory Section
      const conduitGroup = document.createElement('div');
      conduitGroup.className = 'district-group';
      conduitGroup.style.borderTop = '1px solid rgba(255, 255, 255, 0.1)';
      conduitGroup.style.paddingTop = '10px';

      const conduitHeader = document.createElement('div');
      conduitHeader.className = 'district-group-header';
      conduitHeader.innerHTML = `
        <div class="district-label-box">
          <span style="font-size: 14px;">⚡</span>
          <div>
            <div class="district-group-name" style="color: var(--accent-violet);">HIGHWAYS (${window.CONDUITS.length})</div>
            <div class="district-group-scale">Highways · Ferries · Planned roads</div>
          </div>
        </div>
      `;
      conduitGroup.appendChild(conduitHeader);

      const roadOrder = ['operational', 'thin', 'planned'];
      const byRoad = roadOrder.map(st => window.CONDUITS.map((c, idx) => ({ c, idx })).filter(({ c }) => (c.status || 'operational') === st));
      const showSubheads = byRoad.filter(list => list.length).length > 1;
      byRoad.forEach((list, r) => {
        if (!list.length) return;
        if (showSubheads) {
          const sub = document.createElement('div');
          sub.className = 'district-group-scale';
          sub.style.margin = '6px 0 2px 4px';
          sub.textContent = `${ROAD[roadOrder[r]].icon} ${ROAD[roadOrder[r]].word}S (${list.length})`.replace('FERRYS', 'FERRIES');
          conduitGroup.appendChild(sub);
        }
        list.forEach(({ c: cond, idx }) => {
        const cItem = document.createElement('div');
        cItem.className = 'spire-item conduit-legend-item';
        cItem.dataset.id = cond.id;
        cItem.innerHTML = `
          <span class="spire-item-name">${roadOf(cond).icon} ${cond.codename}</span>
          <span class="spire-item-code" style="color: var(--accent-violet); border-color: rgba(192, 64, 255, 0.3);">${cond.code}</span>
        `;
        cItem.addEventListener('click', () => {
          selectObject('conduit', cond.id, idx);
        });
        conduitGroup.appendChild(cItem);
        });
      });

      container.appendChild(conduitGroup);

      // 3. Constraints and priorities (towers are gone for scoped constraints, so the index matters)
      const addSection = (heading, sub, color, items, type) => {
        if (!items.length) return;
        const group = document.createElement('div');
        group.className = 'district-group';
        group.style.borderTop = '1px solid rgba(255, 255, 255, 0.1)';
        group.style.paddingTop = '10px';
        group.innerHTML = `
          <div class="district-group-header">
            <div class="district-label-box">
              <div>
                <div class="district-group-name" style="color: ${color};">${heading} (${items.length})</div>
                <div class="district-group-scale">${sub}</div>
              </div>
            </div>
          </div>`;
        items.forEach((it, idx) => {
          const row = document.createElement('div');
          row.className = 'spire-item conduit-legend-item';
          row.dataset.id = it.id;
          if (it.color) row.style.borderLeft = `3px solid ${it.color}`;
          row.innerHTML = `
            <span class="spire-item-name">${type === 'bottleneck' ? bneckIcon(it) : '🎯'} ${it.codename}</span>
            <span class="spire-item-code" style="color: ${color}; border-color: ${color}55;">${type === 'bottleneck' && it.scope ? it.scope.toUpperCase() : it.code}</span>`;
          row.addEventListener('click', () => selectObject(type, it.id, idx));
          group.appendChild(row);
        });
        container.appendChild(group);
      };
      if (PLAZAS.length) {
        const group = document.createElement('div');
        group.className = 'district-group';
        group.style.borderTop = '1px solid rgba(255, 255, 255, 0.1)';
        group.style.paddingTop = '10px';
        group.innerHTML = `<div class="district-group-header"><div class="district-label-box"><div>
          <div class="district-group-name" style="color: var(--accent-cyan);">▦ DATA PLAZAS (${PLAZAS.length})</div>
          <div class="district-group-scale">Tables painted on the ground</div></div></div></div>`;
        PLAZAS.forEach((pz, idx) => {
          const row = document.createElement('div');
          row.className = 'spire-item conduit-legend-item';
          row.dataset.id = pz.id;
          row.innerHTML = `<span class="spire-item-name">▦ ${pz.title}</span><span class="spire-item-code">${pz.rows.length}×${pz.cols.length}</span>`;
          row.addEventListener('click', () => selectObject('plaza', pz.id, idx));
          group.appendChild(row);
        });
        container.appendChild(group);
      }
      addSection('⚠️ CONSTRAINTS', 'Traffic · Queues · Weather', 'var(--accent-red)', BNECKS, 'bottleneck');
      addSection('🎯 PRIORITIES', 'Research challenges & recommendations', 'var(--accent-amber)', window.CHALLENGES, 'challenge');
    }

    // Scale Runway Builder
    function buildScaleRunway() {
      const strip = document.getElementById('scaleAxisStrip');
      window.DISTRICTS.forEach(d => {
        const item = document.createElement('div');
        item.className = 'scale-step-item';
        item.innerHTML = `
          <span class="scale-step-dot" style="background: ${d.color}; box-shadow: 0 0 8px ${d.color};"></span>
          <span>${d.scale_label}</span>
        `;
        item.addEventListener('click', () => flyToDistrict(d.id));
        strip.appendChild(item);
      });
    }

    // Auto-Orbit
    function toggleOrbit() {
      if (isOrbiting) {
        stopOrbit();
      } else {
        startOrbit();
      }
    }

    function startOrbit() {
      isOrbiting = true;
      document.getElementById('orbitBtn').classList.add('active');
      function rotateCamera() {
        if (!isOrbiting) return;
        map.setBearing((map.getBearing() + 0.18) % 360);
        orbitAnimationId = requestAnimationFrame(rotateCamera);
      }
      rotateCamera();
    }

    function stopOrbit() {
      if (!isOrbiting) return;
      isOrbiting = false;
      document.getElementById('orbitBtn').classList.remove('active');
      if (orbitAnimationId) cancelAnimationFrame(orbitAnimationId);
    }

    // ===== Header from compiled metadata =====
    function initHeader() {
      const cfg = window.CITY_CONFIG || {};
      document.getElementById('hudTitle').textContent = cfg.title || 'Metropolis';
      document.title = cfg.title || document.title;
      const sub = document.getElementById('hudSubtitle');
      sub.innerHTML = '';
      [cfg.subtitle, cfg.scale_axis_label, ...(cfg.hud_tags || [])].filter(Boolean).forEach((t, i) => {
        const span = document.createElement('span');
        if (i > 0) span.className = 'hud-tag';
        span.textContent = t;
        sub.appendChild(span);
      });
    }

    // ===== Canvas-generated icons and fill patterns =====
    function canvasImage(w, h, paint) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      paint(g, w, h);
      return g.getImageData(0, 0, w, h);
    }

    function addConstraintPatterns() {
      const arrow = color => canvasImage(32, 32, (g) => {
        g.strokeStyle = color; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round';
        g.beginPath(); g.moveTo(10, 7); g.lineTo(22, 16); g.lineTo(10, 25); g.stroke();
      });
      map.addImage('arrow-light', arrow('rgba(255,255,255,0.95)'));
      map.addImage('arrow-grey', arrow('rgba(150,158,176,0.9)'));
      map.addImage('arrow-red', arrow('rgba(255,23,68,0.95)'));
    }

    function startConstraintAnimations() {
      // Stop-and-go dashes crawling along congested segments
      const dashSeq = [[0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0],
        [0, 0.5, 3, 3.5], [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2], [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]];
      let step = 0;
      if (TRAFFIC.features.length) {
        setInterval(() => {
          if (document.hidden || !layerVisibility.traffic) return;
          step = (step + 1) % dashSeq.length;
          map.setPaintProperty('traffic-queue-crawl', 'line-dasharray', dashSeq[step]);
        }, 90);
      }
    }

    // ===== Constraint markers (schema v2) =====
    function renderConstraintMarkers() {
      renderPlazaControls();
      if (window.NOW_MARKER) {
        const el = document.createElement('div');
        el.className = 'now-chip';
        el.textContent = `📍 ${window.NOW_MARKER.label}`;
        districtMarkers.push(new maplibregl.Marker({ element: el, anchor: 'left', offset: [6, 0], pitchAlignment: 'viewport' })
          .setLngLat(window.NOW_MARKER.label_point).addTo(map));
      }
      const nodeGroups = {};
      SCOPED.forEach(b => {
        const idx = BNECKS.indexOf(b);
        (b.anchors || []).forEach((a, aIdx) => {
          if (a.kind === 'edge') {
            const el = document.createElement('div');
            el.dataset.tourRef = b.id;
            if (a.barrier) {
              // A planned road: the constraint is the barrier that keeps it from being built
              el.className = 'incident-pin barrier';
              el.title = `${b.title} — why this road is not built`;
              el.innerHTML = `<span class="incident-icon">⛔</span><span>${b.codename}</span><span class="delay-chip">blocks construction</span>`;
            } else {
              el.className = `incident-pin ${b.effect === 'closure' ? 'closure' : ''}`;
              el.title = `${b.title} — ${EFFECT_WORD[b.effect]}`;
              el.innerHTML = `<span class="incident-icon">${EFFECT_ICON[b.effect] || '⚠️'}</span><span>${b.codename}</span>${
                b.delay_label ? `<span class="delay-chip">${b.delay_label}</span>` : ''}`;
            }
            el.addEventListener('click', (e) => { e.stopPropagation(); selectObject('bottleneck', b.id, idx); });
            incidentMarkers.push(new maplibregl.Marker({ element: el, pitchAlignment: 'viewport' }).setLngLat(a.coordinates).addTo(map));
          } else if (a.kind === 'node') {
            (nodeGroups[a.ref] = nodeGroups[a.ref] || { coords: a.coordinates, items: [] }).items.push({ b, idx });
          }
        });
      });
      // Forecast row: one clickable chip per field constraint acting on the district
      window.DISTRICTS.forEach(d => {
        if (!d.fields || !d.fields.length) return;
        const row = document.createElement('div');
        row.className = 'forecast-row';
        d.fields.forEach(ref => {
          const idx = BNECKS.findIndex(x => x.id === ref);
          const b = BNECKS[idx];
          const chip = document.createElement('div');
          chip.className = 'forecast-chip';
          chip.dataset.bneck = b.id;
          chip.dataset.tourRef = b.id;
          chip.style.borderColor = b.color;
          chip.style.setProperty('--tape', b.color);
          chip.title = `${b.title} — ${EFFECT_WORD[b.effect]} over ${b.constrains.length} district(s)`;
          chip.innerHTML = `<span class="tape-swatch tape-${b.effect}" style="--tape: ${b.color};"></span><span>${EFFECT_ICON[b.effect]}</span><span>${b.codename}</span>`;
          chip.addEventListener('click', (e) => { e.stopPropagation(); selectObject('bottleneck', b.id, idx); });
          row.appendChild(chip);
        });
        fieldMarkers.push(new maplibregl.Marker({ element: row, anchor: 'top-left', pitchAlignment: 'viewport' })
          .setLngLat(d.forecast_anchor).addTo(map));
      });

      // Wait-time chips stacked under each constrained spire
      Object.values(nodeGroups).forEach(group => {
        const stack = document.createElement('div');
        stack.className = 'node-chip-stack';
        group.items.forEach(({ b, idx }) => {
          const chip = document.createElement('div');
          chip.className = 'node-chip';
          chip.dataset.tourRef = b.id;
          chip.title = b.title;
          chip.innerHTML = `<span>${bneckIcon(b)}</span><span>${b.codename}</span>${b.delay_label ? `<span class="delay-chip">${b.delay_label}</span>` : ''}`;
          chip.addEventListener('click', (e) => { e.stopPropagation(); selectObject('bottleneck', b.id, idx); });
          stack.appendChild(chip);
        });
        nodeMarkers.push(new maplibregl.Marker({ element: stack, anchor: 'top', offset: [0, 14], pitchAlignment: 'viewport' })
          .setLngLat(group.coords).addTo(map));
      });

      // Layer buttons: only offer what the dataset contains
      const has = {
        traffic: SCOPED.some(b => b.scope === 'edge'),
        queues: SCOPED.some(b => b.scope === 'node'),
        weather: SCOPED.some(b => b.scope === 'field'),
        bottlenecks: BNECKS.some(b => !b.scope)
      };
      Object.entries(has).forEach(([key, present]) => {
        const btn = document.querySelector(`.layer-btn[data-layer="${key}"]`);
        if (btn) btn.classList.toggle('hidden-layer', !present);
      });
    }

    // ===== References between entities =====
    function refEntity(ref) {
      if (!ref) return null;
      if (ref.startsWith('@spire-')) { const i = window.SPIRES_INDEX.findIndex(x => x.id === ref); return i < 0 ? null : { kind: 'spire', i, item: window.SPIRES_INDEX[i] }; }
      if (ref.startsWith('@conduit-')) { const i = window.CONDUITS.findIndex(x => x.id === ref); return i < 0 ? null : { kind: 'conduit', i, item: window.CONDUITS[i] }; }
      if (ref.startsWith('@bneck-')) { const i = BNECKS.findIndex(x => x.id === ref); return i < 0 ? null : { kind: 'bottleneck', i, item: BNECKS[i] }; }
      if (ref.startsWith('@chal-')) { const i = window.CHALLENGES.findIndex(x => x.id === ref); return i < 0 ? null : { kind: 'challenge', i, item: window.CHALLENGES[i] }; }
      if (ref.startsWith('@dist-')) { const d = window.DISTRICTS.find(x => x.id === ref); return d ? { kind: 'district', item: d } : null; }
      if (ref.startsWith('@plaza-')) { const i = PLAZAS.findIndex(x => x.id === ref); return i < 0 ? null : { kind: 'plaza', i, item: PLAZAS[i] }; }
      return null;
    }

    function refLabel(ref) {
      const e = refEntity(ref);
      if (!e) return ref;
      if (e.kind === 'district') return e.item.name;
      if (e.kind === 'bottleneck') return `${bneckIcon(e.item)} ${e.item.codename}`;
      if (e.kind === 'challenge') return `🎯 ${e.item.codename}`;
      if (e.kind === 'conduit') return `${roadOf(e.item).icon} ${e.item.codename}`;
      return e.item.codename || e.item.title;
    }

    function refLocation(ref) {
      const e = refEntity(ref);
      if (!e) return null;
      if (e.kind === 'conduit') return e.item.midpoint;
      if (e.kind === 'district') return e.item.center;
      return e.item.coordinates;
    }

    function gotoRef(ref) {
      const e = refEntity(ref);
      if (!e) return;
      if (e.kind === 'district') flyToDistrict(ref);
      else selectObject(e.kind, ref, e.i);
    }

    function relationBlock(heading, refs) {
      if (!refs || !refs.length) return '';
      const kindClass = r => r.startsWith('@bneck-') ? 'kind-bneck' : r.startsWith('@chal-') ? 'kind-chal'
        : r.startsWith('@conduit-') ? 'kind-conduit' : r.startsWith('@spire-') ? 'kind-spire' : 'kind-dist';
      return `<div class="relation-block">
        <div class="drawer-section-title"><span></span>${heading}</div>
        <div class="relation-list">${refs.map(r => `<span class="ref-chip ${kindClass(r)}" data-ref="${r}">${refLabel(r)}</span>`).join('')}</div>
      </div>`;
    }

    // Spotlight one field constraint: its tapes and chips stay bright, the rest fade back
    function highlightField(id) {
      if (!map || !map.getLayer('fields-tape-blind')) return;
      const match = ['==', ['get', 'bottleneck_ref'], id || ''];
      ['blind', 'noise', 'slowdown'].forEach(effect => {
        map.setPaintProperty(`fields-tape-${effect}`, 'line-opacity', id ? ['case', match, 1, 0.15] : 0.85);
        map.setPaintProperty(`fields-tape-${effect}`, 'line-width', id ? ['case', match, 5, 2] : 3);
      });
      document.querySelectorAll('.forecast-chip').forEach(chip => {
        chip.classList.toggle('dim', !!id && chip.dataset.bneck !== id);
        chip.classList.toggle('lit', !!id && chip.dataset.bneck === id);
      });
    }

    function showLinks(origin, targets) {
      const src = map && map.getSource('links-geo');
      if (!src) return;
      const features = [];
      if (origin) {
        targets.forEach(t => {
          const to = t.coords || refLocation(t.ref);
          if (to) features.push({ type: 'Feature', properties: { color: t.color }, geometry: { type: 'LineString', coordinates: [origin, to] } });
        });
      }
      src.setData({ type: 'FeatureCollection', features });
    }

    // ===== Directions: shortest path over highways and ferries (+ walking inside a district) =====
    function setupRoutePanel() {
      const from = document.getElementById('routeFrom');
      const to = document.getElementById('routeTo');
      const byDistrict = window.DISTRICTS.map(d => ({ d, spires: window.SPIRES_INDEX.filter(s => s.district_ref === d.id) }));
      [from, to].forEach(sel => {
        sel.innerHTML = byDistrict.map(({ d, spires }) =>
          `<optgroup label="${d.name}">${spires.map(sp => `<option value="${sp.id}">${sp.codename} — ${sp.title}</option>`).join('')}</optgroup>`).join('');
      });
      const first = byDistrict.find(g => g.spires.length);
      const last = [...byDistrict].reverse().find(g => g.spires.length);
      if (first) from.value = first.spires[0].id;
      if (last) to.value = last.spires[last.spires.length - 1].id;
      from.addEventListener('change', renderRoute);
      document.getElementById('routeIncludePlanned').addEventListener('change', renderRoute);
      to.addEventListener('change', renderRoute);
      document.getElementById('routeSwapBtn').addEventListener('click', () => { const v = from.value; from.value = to.value; to.value = v; renderRoute(); });
      document.getElementById('routeBtn').addEventListener('click', () => {
        const panel = document.getElementById('routePanel');
        if (panel.classList.contains('open')) closeRoute(); else openRoute(null, null);
      });
      document.getElementById('routeCloseBtn').addEventListener('click', closeRoute);
    }

    function openRoute(fromId, toId) {
      if (fromId) document.getElementById('routeFrom').value = fromId;
      if (toId) document.getElementById('routeTo').value = toId;
      document.getElementById('routePanel').classList.add('open');
      document.getElementById('routeBtn').classList.add('active');
      closeDrawer();
      renderRoute();
    }

    function closeRoute() {
      document.getElementById('routePanel').classList.remove('open');
      document.getElementById('routeBtn').classList.remove('active');
      map.getSource('route-geo').setData({ type: 'FeatureCollection', features: [] });
    }

    function computeRoute(fromId, toId, includePlanned) {
      // Planned roads do not exist yet, so by default the router will not drive on them
      const edges = (window.ROUTE_GRAPH || []).filter(e => includePlanned || !e.planned);
      const dist = { [fromId]: 0 };
      const prev = {};
      const done = new Set();
      while (true) {
        let u = null;
        for (const k in dist) if (!done.has(k) && (u === null || dist[k] < dist[u])) u = k;
        if (u === null) return null;
        if (u === toId) break;
        done.add(u);
        edges.filter(e => e.from === u).forEach(e => {
          const nd = dist[u] + e.cost;
          if (dist[e.to] === undefined || nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = e; }
        });
      }
      const legs = [];
      for (let v = toId; v !== fromId; v = prev[v].from) legs.unshift(prev[v]);
      return { legs, cost: dist[toId] };
    }

    function renderRoute() {
      const fromId = document.getElementById('routeFrom').value;
      const toId = document.getElementById('routeTo').value;
      const out = document.getElementById('routeResult');
      const src = map.getSource('route-geo');
      if (fromId === toId) { out.innerHTML = '<div class="route-summary">Pick two different spires.</div>'; src.setData({ type: 'FeatureCollection', features: [] }); return; }
      const includePlanned = document.getElementById('routeIncludePlanned').checked;
      const route = computeRoute(fromId, toId, includePlanned);
      if (!route) { out.innerHTML = '<div class="route-summary">No connection between these spires — the city has no road here.</div>'; src.setData({ type: 'FeatureCollection', features: [] }); return; }

      const spire = id => window.SPIRES_INDEX.find(x => x.id === id);
      const features = [];
      const incidents = [];
      const seen = new Set();
      const note = (key, html) => { if (!seen.has(key)) { seen.add(key); incidents.push(html); } };
      const visited = [fromId, ...route.legs.map(l => l.to)];

      const legsHtml = route.legs.map(leg => {
        if (leg.kind === 'walk') {
          features.push({ type: 'Feature', properties: { kind: 'walk' }, geometry: { type: 'LineString', coordinates: [spire(leg.from).coordinates, spire(leg.to).coordinates] } });
          return `<li class="route-leg"><span class="leg-kind">🚶</span><span>${spire(leg.from).codename} → ${spire(leg.to).codename} <span style="color: var(--text-dim);">(same district)</span></span></li>`;
        }
        const cond = window.CONDUITS.find(c => c.id === leg.conduit);
        const geom = window.CONDUITS_GEOJSON.features.find(f => f.properties.id === leg.conduit).geometry.coordinates;
        features.push({ type: 'Feature', properties: { kind: leg.against_flow ? 'against' : 'conduit' }, geometry: { type: 'LineString', coordinates: leg.against_flow ? [...geom].reverse() : geom } });
        (cond.status === 'planned' ? [] : (cond.constrained_by || [])).forEach(ref => {
          const b = refEntity(ref).item;
          note(ref, `<div class="route-incident" data-ref="${ref}">${bneckIcon(b)} ${b.codename} on ${cond.codename}${b.delay_label ? ` — ${b.delay_label}` : ''}</div>`);
        });
        if (cond.status === 'planned') note('st-' + cond.id, `<div class="route-incident status" data-ref="${cond.id}">🚧 ${cond.codename} is only planned — this road does not exist yet</div>`);
        if (cond.status === 'thin') note('st-' + cond.id, `<div class="route-incident status" data-ref="${cond.id}">⛴️ ${cond.codename} is a ferry — weak or episodic flow, expect waiting</div>`);
        return `<li class="route-leg ${leg.against_flow ? 'against' : ''}"><span class="leg-kind">${leg.against_flow ? '↺' : roadOf(cond).icon}</span><span>${cond.codename}: ${spire(leg.from).codename} → ${spire(leg.to).codename}${leg.against_flow ? ' <em>(against the flow)</em>' : ''}</span></li>`;
      }).join('');

      visited.forEach(id => (spire(id).constraints || []).forEach(ref => {
        const b = refEntity(ref).item;
        note(ref, `<div class="route-incident" data-ref="${ref}">${bneckIcon(b)} ${b.codename} at ${spire(id).codename}${b.delay_label ? ` — ${b.delay_label}` : ''}</div>`);
      }));
      const districtsOnRoute = new Set(visited.map(id => spire(id).district_ref));
      SCOPED.filter(b => b.scope === 'field' && b.constrains.some(d => districtsOnRoute.has(d))).forEach(b => {
        note(b.id, `<div class="route-incident field" data-ref="${b.id}">${bneckIcon(b)} route passes through ${b.codename}</div>`);
      });

      const conduitLegs = route.legs.filter(l => l.kind === 'conduit').length;
      out.innerHTML = `
        <div class="route-summary">${conduitLegs} road leg${conduitLegs === 1 ? '' : 's'} · ${route.legs.length - conduitLegs} walk · ${incidents.length} incident${incidents.length === 1 ? '' : 's'} on the way</div>
        <ul class="route-legs">${legsHtml}</ul>
        ${incidents.length ? `<div class="route-incidents">${incidents.join('')}</div>` : ''}`;
      src.setData({ type: 'FeatureCollection', features });

      const all = features.flatMap(f => f.geometry.coordinates);
      const lngs = all.map(c => c[0]), lats = all.map(c => c[1]);
      stopOrbit();
      map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
        { padding: { top: 90, bottom: 300, left: 370, right: 60 }, pitch: 25, bearing: -16, duration: 1400 });
    }

    // Launch Map
    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
